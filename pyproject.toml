[project]
name = "impots"
version = "0.0.0"
description = "A transparent, layered simulator of the French tax system"
requires-python = ">=3.11"
# Determined, not chosen: openfisca-core and openfisca-france are both
# AGPL-3.0-or-later and this package imports them directly, so anything
# distributed here is a derivative work. See docs/DECISIONS.md D-017.
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
  # Phase 0 engine. Pinned exactly: openfisca-france ships weekly and golden
  # values move with the law (docs/PHASE0_SPEC.md §1, §7.10).
  "openfisca-france==176.0.8",
  "openfisca-core==44.7.0",
  # Phase 0 API
  "fastapi>=0.110",
  "uvicorn[standard]",
  "pydantic>=2.6",
  # Phase 1 population pipeline. The EEC fichier détail is parquet and the
  # population is 353 420 rows; this is where a dataframe finally earns its place.
  "openpyxl>=3.1",
  "polars>=1.0",
  "pyarrow>=15",
  # numpy est importé en une trentaine d'endroits de `src/`. Il arrivait jusqu'ici
  # PAR HASARD, en dépendance transitive de polars/pyarrow : un jour où l'une d'elles
  # cesse d'en avoir besoin, trente fichiers cassent d'un coup.
  "numpy>=1.26",
  # pypdf lit les trois documents du store macro et le bulletin AFT. Il n'était
  # déclaré NULLE PART et n'arrive par aucune transitive : il n'existait que sur la
  # machine du propriétaire, où il avait été installé à la main. Sur tout
  # environnement neuf — y compris chaque runner de CI — `imk.load()` levait
  # « pypdf is required », message qui se lit comme un défaut de DONNÉES et qui a été
  # classé comme tel (D-161).
  # Borné sous 6 : pypdf 6 lève « LimitReachedError » sur le PDF de la Cnaf et ne retrouve
  # plus les panneaux de la figure 2 de Bach et al. ; 5.9 les lit (but 14, D-339).
  "pypdf>=4.0,<6",
  # certifi complète le magasin de certificats du téléchargeur. Il n'arrivait que par
  # httpx, une dépendance de développement : sur une installation sans `[dev]`,
  # `impots data fetch` n'aurait plus démarré (D-232).
  "certifi",
]

[project.scripts]
impots = "impots.population.cli:main"

[project.optional-dependencies]
# pytest-xdist : `make impact` en parallèle (D-309). La suite ne l'exige pas : sans lui,
# `make gate` et `make full` tournent.
dev = ["pytest", "pyyaml", "httpx", "ruff", "pytest-xdist"]
# Dataframe/ML stack for phases 1+. Deliberately NOT a Phase 0 dependency:
# nothing in the household calculator needs a dataframe (spec §1).
data = ["pandas", "dbnomics", "scikit-learn"]

[build-system]
# 77 is where setuptools learned PEP 639 (`license` as an SPDX expression plus
# `license-files`). Below that the metadata above is silently dropped.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The default run is the gate: everything except the tests that need a full
# population pass. Those are not weakened or deleted — they are marked, and run by
# `make full` (`-m ""`) before any substantive commit; CI runs them only when the
# workflow is dispatched by hand (D-172). Local test pain is how green suites rot, so
# the gate is kept fast enough to run without thinking about it.
addopts = "-m 'not slow'"
markers = [
  """slow: needs a 20 000-household population run (about a minute each); excluded \
from the default gate AND from automatic CI (D-172). `make full` on a machine \
holding the data is where they run; CI runs them only when the workflow is \
dispatched by hand, and no full-suite run has yet finished on a runner. An earlier \
text said 'always run in CI', which was false in the dangerous direction: it would \
let a reader skip the local hour. See D-114.""",
  """chrono: a wall-clock budget (`quiet_machine`). It skips on a loaded machine, which \
parallel workers make: `make impact` runs these alone, after the parallel pass (D-309).""",
  """lourd: listed in tests/lourds.txt, a test that climbs past 1 GB cold. Two at once, or \
several in one process, overflow the memory: `make impact` runs each in a fresh process \
(D-309).""",
]
filterwarnings = [
  "ignore::DeprecationWarning",
  # openfisca-france divides by a zero head-count for household members with no
  # employer (children). Noise from the library, not from anything we compute.
  "ignore:invalid value encountered:RuntimeWarning",
  "ignore:divide by zero encountered:RuntimeWarning",
]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
# Pinned explicitly: a ruff release that widens its defaults must not turn a
# green CI red without anyone choosing to adopt the new rules.
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]  # line length is handled by the formatter, not the linter
# This codebase is half French and half arithmetic. A multiplication sign in
# "age x sex", a real minus in "-0.4 %" and a typographic apostrophe in "branch A'"
# are the correct characters, not homoglyph mistakes — RUF001/2 flags them because
# they *can* be used to disguise identifiers, which docstrings and messages cannot.
allowed-confusables = ["×", "−", "’", "–", "ρ"]  # ρ : la réalisation des annonces (D-319)

[tool.ruff.lint.per-file-ignores]
# The verify_* scripts are reference gates published alongside the phase specs and
# kept as written: they start a timer and *then* import openfisca so they can
# report load time (E402), and they pack assertions onto one line to stay readable
# as a checklist (E702). They are the reference the golden values come from;
# reformatting them would make the spec and the repo disagree over whitespace.
"scripts/verify_*.py" = ["E402", "E702"]
