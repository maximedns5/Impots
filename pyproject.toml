[project]
name = "impots"
version = "0.0.0"
description = "A transparent, layered simulator of the French tax system"
requires-python = ">=3.11"
# Determined, not chosen: openfisca-core and openfisca-france are both
# AGPL-3.0-or-later and this package imports them directly, so anything
# distributed here is a derivative work. See docs/DECISIONS.md D-017.
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
  # Phase 0 engine. Pinned exactly: openfisca-france ships weekly and golden
  # values move with the law (docs/PHASE0_SPEC.md §1, §7.10).
  "openfisca-france==176.0.8",
  "openfisca-core==44.7.0",
  # Phase 0 API
  "fastapi>=0.110",
  "uvicorn[standard]",
  "pydantic>=2.6",
  # Phase 1 population pipeline. The EEC fichier détail is parquet and the
  # population is 353 420 rows; this is where a dataframe finally earns its place.
  "polars>=1.0",
  "pyarrow>=15",
]

[project.scripts]
impots = "impots.population.cli:main"

[project.optional-dependencies]
dev = ["pytest", "pyyaml", "httpx", "ruff"]
# Dataframe/ML stack for phases 1+. Deliberately NOT a Phase 0 dependency:
# nothing in the household calculator needs a dataframe (spec §1).
data = ["pandas", "dbnomics", "scikit-learn"]

[build-system]
# 77 is where setuptools learned PEP 639 (`license` as an SPDX expression plus
# `license-files`). Below that the metadata above is silently dropped.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
  "ignore::DeprecationWarning",
  # openfisca-france divides by a zero head-count for household members with no
  # employer (children). Noise from the library, not from anything we compute.
  "ignore:invalid value encountered:RuntimeWarning",
  "ignore:divide by zero encountered:RuntimeWarning",
]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
# Pinned explicitly: a ruff release that widens its defaults must not turn a
# green CI red without anyone choosing to adopt the new rules.
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]  # line length is handled by the formatter, not the linter

[tool.ruff.lint.per-file-ignores]
# The verify_* scripts are reference gates published alongside the phase specs and
# kept as written: they start a timer and *then* import openfisca so they can
# report load time (E402), and they pack assertions onto one line to stay readable
# as a checklist (E702). They are the reference the golden values come from;
# reformatting them would make the spec and the repo disagree over whitespace.
"scripts/verify_*.py" = ["E402", "E702"]
