<title id="pres2027_glucksmann_programme-trajectoire-t">Le solde, la dette et le PIB, de 2026 à 2035</title>
<desc id="pres2027_glucksmann_programme-trajectoire-d">De 2026 à 2035, à θ½, vue vieillie, persistance lue. Le solde public : −0,81 pt en 2026, −0,02 pt en 2035, la boîte θ de −0,31 pt à +0,07 pt en 2035. La dette (Δb) : +0,54 pt en 2026, +0,88 pt en 2035, la boîte θ de −2,19 pt à +6,00 pt en 2035. Le PIB : +0,23 % en 2026, +1,18 % en 2035, la boîte θ de +0,62 % à +1,71 % en 2035. Δ dette en 2035, par persistance et vue : lue, vieillie +0,88 pt ; lue, figée +0,54 pt ; éteinte, vieillie +7,74 pt ; éteinte, figée +6,82 pt ; tenue, vieillie +1,87 pt ; tenue, figée +1,48 pt. La dette lit le canal des créations d&#x27;entreprises, une hypothèse non validée ; sans lui : +1,13 pt en 2035, vue vieillie, persistance lue.</desc>
