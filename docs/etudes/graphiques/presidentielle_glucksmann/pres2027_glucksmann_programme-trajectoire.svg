<title id="pres2027_glucksmann_programme-trajectoire-t">Le solde, la dette et le PIB, de 2026 à 2035</title>
<desc id="pres2027_glucksmann_programme-trajectoire-d">De 2026 à 2035, à θ½, vue vieillie, persistance lue. Le solde public : −0,79 pt en 2026, −0,02 pt en 2035, la boîte θ de −0,32 pt à +0,07 pt en 2035. La dette (Δb) : +0,53 pt en 2026, +0,86 pt en 2035, la boîte θ de −2,23 pt à +6,01 pt en 2035. Le PIB : +0,22 % en 2026, +1,19 % en 2035, la boîte θ de +0,63 % à +1,72 % en 2035. Δ dette en 2035, par persistance et vue : lue, vieillie +0,86 pt ; lue, figée +0,46 pt ; éteinte, vieillie +7,74 pt ; éteinte, figée +6,53 pt ; tenue, vieillie +1,86 pt ; tenue, figée +1,38 pt. La dette lit le canal des créations d&#x27;entreprises, une hypothèse non validée ; sans lui : +1,12 pt en 2035, vue vieillie, persistance lue.</desc>
