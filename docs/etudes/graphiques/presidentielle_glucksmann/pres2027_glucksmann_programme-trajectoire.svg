<desc id="pres2027_glucksmann_programme-trajectoire-d">De 2026 à 2035, à θ½, vue vieillie, persistance lue. Le solde public : −0,71 pt en 2026, −0,05 pt en 2035, la boîte θ de −0,29 pt à 0,00 pt en 2035. La dette (Δb) : +0,49 pt en 2026, +0,98 pt en 2035, la boîte θ de −1,51 pt à +5,26 pt en 2035. Le PIB : +0,19 % en 2026, +0,99 % en 2035, la boîte θ de +0,55 % à +1,41 % en 2035. Δ dette en 2035, par persistance et vue : lue, vieillie +0,98 pt ; lue, figée +0,99 pt ; éteinte, vieillie +6,93 pt ; éteinte, figée +7,01 pt ; tenue, vieillie +1,85 pt ; tenue, figée +1,89 pt.</desc>
