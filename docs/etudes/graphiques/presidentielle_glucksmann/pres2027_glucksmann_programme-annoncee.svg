<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 385" width="360" height="385" role="img" aria-labelledby="pres2027_glucksmann_programme-annoncee-t pres2027_glucksmann_programme-annoncee-d" font-size="13">
<title id="pres2027_glucksmann_programme-annoncee-t">La dette de 2026 à 2035, si ce qui est annoncé est tenu</title>
<desc id="pres2027_glucksmann_programme-annoncee-d">Δ dette de 2026 à 2035, vue vieillie, à θ½, persistance lue. part réalisée 0 % : +0,49 pt en 2026, +0,98 pt en 2035 ; part réalisée 50 % : +0,48 pt en 2026, +1,06 pt en 2035 ; part réalisée 100 % : +0,47 pt en 2026, +1,13 pt en 2035.</desc>
