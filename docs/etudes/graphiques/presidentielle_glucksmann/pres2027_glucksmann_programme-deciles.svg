<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 439" width="360" height="439" role="img" aria-labelledby="pres2027_glucksmann_programme-deciles-t pres2027_glucksmann_programme-deciles-d" font-size="13">
<title id="pres2027_glucksmann_programme-deciles-t">Ce que chaque décile y gagne ou y perd en 2026</title>
<desc id="pres2027_glucksmann_programme-deciles-d">Le gain moyen par ménage en 2026, par décile de niveau de vie : D1 +57 € ; D2 +95 € ; D3 +273 € ; D4 +238 € ; D5 +189 € ; D6 +207 € ; D7 +168 € ; D8 +156 € ; D9 +112 € ; D10 +55 €.</desc>
