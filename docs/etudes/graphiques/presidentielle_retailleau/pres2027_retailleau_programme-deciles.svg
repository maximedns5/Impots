<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 439" width="360" height="439" role="img" aria-labelledby="pres2027_retailleau_programme-deciles-t pres2027_retailleau_programme-deciles-d" font-size="13">
<title id="pres2027_retailleau_programme-deciles-t">Ce que chaque décile y gagne ou y perd en 2026</title>
<desc id="pres2027_retailleau_programme-deciles-d">Le gain moyen par ménage en 2026, par décile de niveau de vie : D1 +627 € ; D2 +1 077 € ; D3 +1 467 € ; D4 +1 264 € ; D5 +1 434 € ; D6 +1 359 € ; D7 +1 350 € ; D8 +1 104 € ; D9 +1 048 € ; D10 +1 242 €.</desc>
