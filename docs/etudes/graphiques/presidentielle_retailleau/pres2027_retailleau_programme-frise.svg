<title id="pres2027_retailleau_programme-frise-t">Les mesures chiffrées dans le temps, et leurs plages</title>
<desc id="pres2027_retailleau_programme-frise-d">Les mesures chiffrées : Seuil « zéro cotisation » : aucune cotisation sociale (salariale ou patronale) au-delà de 1 623 h par an ; CSG et CRDS maintenues ; exonération d&#x27;IR des heures supplémentaires maintenue, de 2026 à 2035, plage heures_sup_franchise_heures : bas 0 +6,38 Md€, candidat 16 +4,77 Md€, haut 16 +4,77 Md€ ; Revenu d&#x27;incitation à l&#x27;activité (RIA), qui fusionne RSA, prime d&#x27;activité et ASS ; activité de 15 h/semaine, de 2026 à 2035, plage ria.taux_autres_revenus : bas 0,3 +7,91 Md€, candidat 1 +5,79 Md€, haut 1 +5,79 Md€ ; Gains rendus pour moitié aux salariés, pour moitié aux entreprises, de 2026 à 2035, plage cotisations_salariales_retraite_echelle : bas 0,805 +16,66 Md€, candidat 0,87 +11,11 Md€, haut 1 0,00 Md€ ; Suppression de la C3S et de la CVAE ; forfait social maintenu à 20 % sur la participation légale, supprimé sur l&#x27;intéressement, la participation supra-légale et l&#x27;épargne retraite individuelle ; part industrielle de la CFE exonérée ; CIR sanctuarisé, de 2026 à 2035, plage c3s_taux : bas 0 % +6,55 Md€, candidat 0 % +6,55 Md€, haut 0,16 % +2,55 Md€, plage cvae_echelle : bas 0 +6,55 Md€, candidat 0 +6,55 Md€, haut 1 +4,00 Md€ ; Revenu familial remplaçant 12 dispositifs, dont le quotient familial ; conditionné à 5 ans de résidence régulière et d&#x27;activité, de 2026 à 2035 ; Réduction d&#x27;IR sur les intérêts d&#x27;emprunt de la résidence principale, de 2026 à 2035.</desc>
