<desc id="pres2027_retailleau_programme-trajectoire-d">De 2026 à 2035, à θ½, vue vieillie, persistance lue. Le solde public : −1,52 pt en 2026, −1,03 pt en 2035, la boîte θ de −1,13 pt à −1,07 pt en 2035. La dette (Δb) : +1,48 pt en 2026, +11,40 pt en 2035, la boîte θ de +10,89 pt à +12,74 pt en 2035. Le PIB : +0,04 % en 2026, +0,33 % en 2035, la boîte θ de +0,22 % à +0,44 % en 2035. Δ dette en 2035, par persistance et vue : lue, vieillie +11,40 pt ; lue, figée +10,83 pt ; éteinte, vieillie +13,28 pt ; éteinte, figée +12,55 pt ; tenue, vieillie +12,20 pt ; tenue, figée +11,50 pt. Si les économies annoncées sont tenues : −0,88 pt en 2035.</desc>
