<title id="pres2027_retailleau_programme-trajectoire-t">Le solde, la dette et le PIB, de 2026 à 2035</title>
<desc id="pres2027_retailleau_programme-trajectoire-d">De 2026 à 2035, à θ½, vue vieillie, persistance lue. Le solde public : −1,52 pt en 2026, −0,98 pt en 2035, la boîte θ de −1,13 pt à −0,96 pt en 2035. La dette (Δb) : +1,47 pt en 2026, +10,99 pt en 2035, la boîte θ de +10,09 pt à +12,74 pt en 2035. Le PIB : +0,04 % en 2026, +0,44 % en 2035, la boîte θ de +0,22 % à +0,65 % en 2035. Δ dette en 2035, par persistance et vue : lue, vieillie +10,99 pt ; lue, figée +10,50 pt ; éteinte, vieillie +12,87 pt ; éteinte, figée +12,21 pt ; tenue, vieillie +11,79 pt ; tenue, figée +11,17 pt. La dette lit le canal des créations d&#x27;entreprises, une hypothèse non validée ; sans lui : +11,40 pt en 2035, vue vieillie, persistance lue.</desc>
