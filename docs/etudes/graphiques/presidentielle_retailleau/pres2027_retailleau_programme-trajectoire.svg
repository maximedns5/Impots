<title id="pres2027_retailleau_programme-trajectoire-t">Le solde, la dette et le PIB, de 2026 à 2035</title>
<desc id="pres2027_retailleau_programme-trajectoire-d">De 2026 à 2035, à θ½, vue vieillie, persistance lue. Le solde public : −1,43 pt en 2026, −1,01 pt en 2035, la boîte θ de −1,11 pt à −1,04 pt en 2035. La dette (Δb) : +1,39 pt en 2026, +10,87 pt en 2035, la boîte θ de +10,35 pt à +12,19 pt en 2035. Le PIB : +0,04 % en 2026, +0,33 % en 2035, la boîte θ de +0,21 % à +0,44 % en 2035. Δ dette en 2035, par persistance et vue : lue, vieillie +10,87 pt ; lue, figée +9,97 pt ; éteinte, vieillie +12,67 pt ; éteinte, figée +11,57 pt ; tenue, vieillie +11,63 pt ; tenue, figée +10,61 pt. La dette lit le canal des créations d&#x27;entreprises, une hypothèse non validée ; sans lui : +10,90 pt en 2035, vue vieillie, persistance lue.</desc>
