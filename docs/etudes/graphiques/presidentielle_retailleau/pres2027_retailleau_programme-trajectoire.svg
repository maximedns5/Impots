<title id="pres2027_retailleau_programme-trajectoire-t">Le solde, la dette et le PIB, de 2026 à 2035</title>
<desc id="pres2027_retailleau_programme-trajectoire-d">De 2026 à 2035, à θ½, vue vieillie, persistance lue. Le solde public : −1,52 pt en 2026, −1,03 pt en 2035, la boîte θ de −1,13 pt à −1,06 pt en 2035. La dette (Δb) : +1,48 pt en 2026, +11,37 pt en 2035, la boîte θ de +10,83 pt à +12,74 pt en 2035. Le PIB : +0,04 % en 2026, +0,34 % en 2035, la boîte θ de +0,22 % à +0,46 % en 2035. Δ dette en 2035, par persistance et vue : lue, vieillie +11,37 pt ; lue, figée +10,81 pt ; éteinte, vieillie +13,25 pt ; éteinte, figée +12,53 pt ; tenue, vieillie +12,17 pt ; tenue, figée +11,48 pt. La dette lit le canal des créations d&#x27;entreprises, une hypothèse non validée ; sans lui : +11,40 pt en 2035, vue vieillie, persistance lue.</desc>
