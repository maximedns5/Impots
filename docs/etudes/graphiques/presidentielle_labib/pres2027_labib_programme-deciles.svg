<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 439" width="360" height="439" role="img" aria-labelledby="pres2027_labib_programme-deciles-t pres2027_labib_programme-deciles-d" font-size="13">
<title id="pres2027_labib_programme-deciles-t">Ce que chaque décile y gagne ou y perd en 2026</title>
