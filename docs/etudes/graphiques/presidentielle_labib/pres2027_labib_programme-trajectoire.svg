<title id="pres2027_labib_programme-trajectoire-t">Le solde, la dette et le PIB, de 2026 à 2035</title>
<desc id="pres2027_labib_programme-trajectoire-d">De 2026 à 2035, à θ½, vue vieillie, persistance lue. Le solde public : −1,47 pt en 2026, −0,50 pt en 2035, la boîte θ de −0,90 pt à −0,34 pt en 2035. La dette (Δb) : +1,12 pt en 2026, +5,58 pt en 2035, la boîte θ de +1,66 pt à +11,89 pt en 2035. Le PIB : +0,30 % en 2026, +1,35 % en 2035, la boîte θ de +0,67 % à +2,00 % en 2035. Δ dette en 2035, par persistance et vue : lue, vieillie +5,58 pt ; lue, figée +6,00 pt ; éteinte, vieillie +13,79 pt ; éteinte, figée +14,07 pt ; tenue, vieillie +6,47 pt ; tenue, figée +6,92 pt.</desc>
