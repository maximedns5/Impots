<title id="plf2027_art_74_ppa-trajectoire-t">Le solde, la dette et le PIB, de 2026 à 2035</title>
<desc id="plf2027_art_74_ppa-trajectoire-d">De 2026 à 2035, à θ½, vue vieillie, persistance lue. Le solde public : +0,02 pt en 2026, +0,01 pt en 2035, la boîte θ de +0,01 pt à +0,01 pt en 2035. La dette (Δb) : −0,02 pt en 2026, −0,16 pt en 2035, la boîte θ de −0,16 pt à −0,16 pt en 2035. Le PIB : 0,00 % en 2026, 0,00 % en 2035, la boîte θ de 0,00 % à 0,00 % en 2035. Δ dette en 2035, par persistance et vue : lue, vieillie −0,16 pt ; lue, figée −0,25 pt ; éteinte, vieillie −0,16 pt ; éteinte, figée −0,25 pt ; tenue, vieillie −0,16 pt ; tenue, figée −0,25 pt. La dette lit le canal des créations d&#x27;entreprises, une hypothèse non validée ; sans lui : −0,16 pt en 2035, vue vieillie, persistance lue.</desc>
