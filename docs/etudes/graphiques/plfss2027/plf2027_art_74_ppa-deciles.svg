<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 439" width="360" height="439" role="img" aria-labelledby="plf2027_art_74_ppa-deciles-t plf2027_art_74_ppa-deciles-d" font-size="13">
<title id="plf2027_art_74_ppa-deciles-t">Ce que chaque décile y gagne ou y perd en 2026</title>
<desc id="plf2027_art_74_ppa-deciles-d">Le gain moyen par ménage en 2026, par décile de niveau de vie : D1 −11 € ; D2 −29 € ; D3 −38 € ; D4 −34 € ; D5 −30 € ; D6 −15 € ; D7 −8 € ; D8 −7 € ; D9 −5 € ; D10 −3 €.</desc>
