<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 385" width="360" height="385" role="img" aria-labelledby="pres2027_attal_programme-annoncee-t pres2027_attal_programme-annoncee-d" font-size="13">
<title id="pres2027_attal_programme-annoncee-t">La dette de 2026 à 2035, si ce qui est annoncé est tenu</title>
<desc id="pres2027_attal_programme-annoncee-d">Δ dette de 2026 à 2035, vue vieillie, à θ½, persistance lue. part réalisée 0 % : +0,64 pt en 2026, +4,28 pt en 2035 ; part réalisée 50 % : +0,81 pt en 2026, +2,36 pt en 2035 ; part réalisée 100 % : +0,98 pt en 2026, +0,44 pt en 2035.</desc>
