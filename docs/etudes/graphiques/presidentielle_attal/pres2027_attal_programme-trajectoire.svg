<title id="pres2027_attal_programme-trajectoire-t">Le solde, la dette et le PIB, de 2026 à 2035</title>
<desc id="pres2027_attal_programme-trajectoire-d">De 2026 à 2035, à θ½, vue vieillie, persistance lue. Le solde public : −1,62 pt en 2026, −0,33 pt en 2035, la boîte θ de −1,29 pt à +0,10 pt en 2035. La dette (Δb) : +0,64 pt en 2026, +4,24 pt en 2035, la boîte θ de −4,13 pt à +15,78 pt en 2035. Le PIB : +0,84 % en 2026, +2,56 % en 2035, la boîte θ de +1,16 % à +3,95 % en 2035. Δ dette en 2035, par persistance et vue : lue, vieillie +4,24 pt ; lue, figée +3,47 pt ; éteinte, vieillie +17,65 pt ; éteinte, figée +15,29 pt ; tenue, vieillie +6,82 pt ; tenue, figée +5,76 pt. La dette lit le canal des créations d&#x27;entreprises, une hypothèse non validée ; sans lui : +4,28 pt en 2035, vue vieillie, persistance lue.</desc>
