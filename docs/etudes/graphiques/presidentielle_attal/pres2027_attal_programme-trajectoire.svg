<title id="pres2027_attal_programme-trajectoire-t">Le solde, la dette et le PIB, de 2026 à 2035</title>
<desc id="pres2027_attal_programme-trajectoire-d">De 2026 à 2035, à θ½, vue vieillie, persistance lue. Le solde public : −1,54 pt en 2026, −0,32 pt en 2035, la boîte θ de −1,24 pt à +0,09 pt en 2035. La dette (Δb) : +0,60 pt en 2026, +3,96 pt en 2035, la boîte θ de −4,06 pt à +15,02 pt en 2035. Le PIB : +0,80 % en 2026, +2,46 % en 2035, la boîte θ de +1,12 % à +3,79 % en 2035. Δ dette en 2035, par persistance et vue : lue, vieillie +3,96 pt ; lue, figée +3,20 pt ; éteinte, vieillie +16,84 pt ; éteinte, figée +14,55 pt ; tenue, vieillie +6,44 pt ; tenue, figée +5,40 pt. La dette lit le canal des créations d&#x27;entreprises, une hypothèse non validée ; sans lui : +3,95 pt en 2035, vue vieillie, persistance lue.</desc>
