<title id="pres2027_attal_programme-trajectoire-t">Le solde, la dette et le PIB, de 2026 à 2035</title>
<desc id="pres2027_attal_programme-trajectoire-d">De 2026 à 2035, à θ½, vue vieillie, persistance lue. Le solde public : −1,62 pt en 2026, −0,34 pt en 2035, la boîte θ de −1,29 pt à +0,09 pt en 2035. La dette (Δb) : +0,64 pt en 2026, +4,28 pt en 2035, la boîte θ de −4,04 pt à +15,78 pt en 2035. Le PIB : +0,83 % en 2026, +2,55 % en 2035, la boîte θ de +1,16 % à +3,94 % en 2035. Δ dette en 2035, par persistance et vue : lue, vieillie +4,28 pt ; lue, figée +3,52 pt ; éteinte, vieillie +17,69 pt ; éteinte, figée +15,34 pt ; tenue, vieillie +6,87 pt ; tenue, figée +5,80 pt.</desc>
