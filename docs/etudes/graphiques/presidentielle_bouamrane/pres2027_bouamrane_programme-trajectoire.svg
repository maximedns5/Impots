<desc id="pres2027_bouamrane_programme-trajectoire-d">De 2026 à 2035, à θ½, vue vieillie, persistance lue. Le solde public : −0,36 pt en 2026, −0,02 pt en 2035, la boîte θ de −0,14 pt à 0,00 pt en 2035. La dette (Δb) : +0,24 pt en 2026, +0,49 pt en 2035, la boîte θ de −0,73 pt à +2,57 pt en 2035. Le PIB : +0,10 % en 2026, +0,48 % en 2035, la boîte θ de +0,27 % à +0,68 % en 2035. Δ dette en 2035, par persistance et vue : lue, vieillie +0,49 pt ; lue, figée +0,51 pt ; éteinte, vieillie +3,41 pt ; éteinte, figée +3,62 pt ; tenue, vieillie +0,91 pt ; tenue, figée +0,97 pt.</desc>
