<title id="pres2027_bouamrane_programme-trajectoire-t">Le solde, la dette et le PIB, de 2026 à 2035</title>
<desc id="pres2027_bouamrane_programme-trajectoire-d">De 2026 à 2035, à θ½, vue vieillie, persistance lue. Le solde public : −0,36 pt en 2026, −0,01 pt en 2035, la boîte θ de −0,14 pt à +0,03 pt en 2035. La dette (Δb) : +0,24 pt en 2026, +0,38 pt en 2035, la boîte θ de −0,95 pt à +2,57 pt en 2035. Le PIB : +0,10 % en 2026, +0,51 % en 2035, la boîte θ de +0,27 % à +0,74 % en 2035. Δ dette en 2035, par persistance et vue : lue, vieillie +0,38 pt ; lue, figée +0,39 pt ; éteinte, vieillie +3,30 pt ; éteinte, figée +3,50 pt ; tenue, vieillie +0,80 pt ; tenue, figée +0,85 pt. La dette lit le canal des créations d&#x27;entreprises, une hypothèse non validée ; sans lui : +0,49 pt en 2035, vue vieillie, persistance lue.</desc>
