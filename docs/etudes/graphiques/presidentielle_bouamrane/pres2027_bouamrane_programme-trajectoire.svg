<title id="pres2027_bouamrane_programme-trajectoire-t">Le solde, la dette et le PIB, de 2026 à 2035</title>
<desc id="pres2027_bouamrane_programme-trajectoire-d">De 2026 à 2035, à θ½, vue vieillie, persistance lue. Le solde public : −0,42 pt en 2026, −0,01 pt en 2035, la boîte θ de −0,15 pt à +0,03 pt en 2035. La dette (Δb) : +0,28 pt en 2026, +0,44 pt en 2035, la boîte θ de −1,08 pt à +2,95 pt en 2035. Le PIB : +0,12 % en 2026, +0,57 % en 2035, la boîte θ de +0,31 % à +0,83 % en 2035. Δ dette en 2035, par persistance et vue : lue, vieillie +0,44 pt ; lue, figée +0,31 pt ; éteinte, vieillie +3,82 pt ; éteinte, figée +3,67 pt ; tenue, vieillie +0,93 pt ; tenue, figée +0,80 pt. La dette lit le canal des créations d&#x27;entreprises, une hypothèse non validée ; sans lui : +0,56 pt en 2035, vue vieillie, persistance lue.</desc>
