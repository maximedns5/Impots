<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 439" width="360" height="439" role="img" aria-labelledby="pres2027_bouamrane_programme-deciles-t pres2027_bouamrane_programme-deciles-d" font-size="13">
<title id="pres2027_bouamrane_programme-deciles-t">Ce que chaque décile y gagne ou y perd en 2026</title>
<desc id="pres2027_bouamrane_programme-deciles-d">Le gain moyen par ménage en 2026, par décile de niveau de vie : D1 +20 € ; D2 +29 € ; D3 +108 € ; D4 +73 € ; D5 +74 € ; D6 +75 € ; D7 +60 € ; D8 +62 € ; D9 +42 € ; D10 +21 €.</desc>
<style>.g-fond{fill:#fcfcfb}.g-encre{fill:#1d1d1b}.g-doux{fill:#52514e}
