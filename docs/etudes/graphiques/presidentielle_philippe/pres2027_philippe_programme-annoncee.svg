<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 385" width="360" height="385" role="img" aria-labelledby="pres2027_philippe_programme-annoncee-t pres2027_philippe_programme-annoncee-d" font-size="13">
<title id="pres2027_philippe_programme-annoncee-t">La dette de 2026 à 2035, si ce qui est annoncé est tenu</title>
<desc id="pres2027_philippe_programme-annoncee-d">Δ dette de 2026 à 2035, vue vieillie, à θ½, persistance lue. part réalisée 0 % : +1,47 pt en 2026, +11,73 pt en 2035 ; part réalisée 50 % : +1,78 pt en 2026, +8,24 pt en 2035 ; part réalisée 100 % : +2,09 pt en 2026, +4,71 pt en 2035.</desc>
