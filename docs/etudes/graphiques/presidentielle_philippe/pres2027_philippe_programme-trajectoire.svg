<desc id="pres2027_philippe_programme-trajectoire-d">De 2026 à 2035, à θ½, vue vieillie, persistance lue. Le solde public : −1,47 pt en 2026, −1,00 pt en 2035, la boîte θ de −1,00 pt à −1,00 pt en 2035. La dette (Δb) : +1,47 pt en 2026, +11,69 pt en 2035, la boîte θ de +11,69 pt à +11,69 pt en 2035. Le PIB : 0,00 % en 2026, 0,00 % en 2035, la boîte θ de 0,00 % à 0,00 % en 2035. Δ dette en 2035, par persistance et vue : lue, vieillie +11,69 pt ; lue, figée +12,69 pt ; éteinte, vieillie +11,69 pt ; éteinte, figée +12,69 pt ; tenue, vieillie +11,69 pt ; tenue, figée +12,69 pt. La dette lit le canal des créations d&#x27;entreprises, une hypothèse non validée ; sans lui : +11,69 pt en 2035, vue vieillie, persistance lue.</desc>
