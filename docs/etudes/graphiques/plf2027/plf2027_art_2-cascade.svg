<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 423" width="360" height="423" role="img" aria-labelledby="plf2027_art_2-cascade-t plf2027_art_2-cascade-d" font-size="13">
<title id="plf2027_art_2-cascade-t">Du coût de 2026 à la dette de 2035</title>
