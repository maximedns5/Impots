<desc id="plf2027_art_15-trajectoire-d">De 2026 à 2035, à θ½, vue vieillie, persistance lue. Le solde public : 0,00 pt en 2026, 0,00 pt en 2035, la boîte θ de 0,00 pt à 0,00 pt en 2035. La dette (Δb) : 0,00 pt en 2026, −0,21 pt en 2035, la boîte θ de −0,22 pt à −0,20 pt en 2035. Le PIB : 0,00 % en 2026, 0,00 % en 2035, la boîte θ de 0,00 % à 0,00 % en 2035. Δ dette en 2035, par persistance et vue : lue, vieillie −0,21 pt ; lue, figée −0,20 pt ; éteinte, vieillie −0,21 pt ; éteinte, figée −0,20 pt ; tenue, vieillie −0,21 pt ; tenue, figée −0,20 pt. La dette lit le canal des créations d&#x27;entreprises, une hypothèse non validée ; sans lui : −0,22 pt en 2035, vue vieillie, persistance lue.</desc>
