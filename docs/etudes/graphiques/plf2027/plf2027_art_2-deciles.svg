<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 439" width="360" height="439" role="img" aria-labelledby="plf2027_art_2-deciles-t plf2027_art_2-deciles-d" font-size="13">
<title id="plf2027_art_2-deciles-t">Ce que chaque décile y gagne ou y perd en 2026</title>
<desc id="plf2027_art_2-deciles-d">Le gain moyen par ménage en 2026, par décile de niveau de vie : D1 0 € ; D2 +2 € ; D3 +5 € ; D4 +22 € ; D5 +49 € ; D6 +81 € ; D7 +97 € ; D8 +133 € ; D9 +175 € ; D10 +279 €.</desc>
<style>.g-fond{fill:#fcfcfb}.g-encre{fill:#1d1d1b}.g-doux{fill:#52514e}
.g-axe{stroke:#8a877f}.g-grille{stroke:#e4e1da}.g-zero{stroke:#52514e}
.g-s1{stroke:#2a78d6}.g-s2{stroke:#eb6834}.g-s3{stroke:#1baf7a}.g-s4{stroke:#6250d6}
.g-f1{fill:#2a78d6}.g-f2{fill:#eb6834}.g-f3{fill:#1baf7a}.g-f4{fill:#6250d6}
.g-bande{fill:#2a78d6;fill-opacity:.16}.g-plus{fill:#2a78d6}.g-moins{fill:#e34948}
.g-total{fill:#52514e}.g-lien{stroke:#8a877f}.g-sur{fill:#ffffff}
@media (prefers-color-scheme: dark){
.g-fond{fill:#1a1a19}.g-encre{fill:#ece9e2}.g-doux{fill:#c3c2b7}
.g-axe{stroke:#8f8b80}.g-grille{stroke:#33322f}.g-zero{stroke:#c3c2b7}
.g-s1{stroke:#3987e5}.g-s2{stroke:#d95926}.g-s3{stroke:#199e70}.g-s4{stroke:#9085e9}
.g-f1{fill:#3987e5}.g-f2{fill:#d95926}.g-f3{fill:#199e70}.g-f4{fill:#9085e9}
.g-bande{fill:#3987e5;fill-opacity:.24}.g-plus{fill:#3987e5}.g-moins{fill:#e66767}
.g-total{fill:#6b6862}.g-lien{stroke:#8f8b80}}
text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}</style>
<rect class="g-fond" fill="#fcfcfb" x="0" y="0" width="360" height="439"/>
<text class="g-encre" fill="#1d1d1b" x="12" y="20" text-anchor="start" font-size="15" font-weight="600">Ce que chaque décile y gagne ou y perd en</text>
<text class="g-encre" fill="#1d1d1b" x="12" y="39" text-anchor="start" font-size="15" font-weight="600">2026</text>
<text class="g-doux" fill="#52514e" x="12" y="58" text-anchor="start">Le revenu disponible moyen par ménage, avec la</text>
<text class="g-doux" fill="#52514e" x="12" y="75" text-anchor="start">mesure moins sans elle ; les déciles du niveau de</text>
<text class="g-doux" fill="#52514e" x="12" y="92" text-anchor="start">vie.</text>
<rect class="g-plus" fill="#2a78d6" x="12" y="113" width="14" height="12" rx="2"/>
<text class="g-encre" fill="#1d1d1b" x="30" y="124" text-anchor="start">gain</text>
<rect class="g-moins" fill="#e34948" x="80" y="113" width="14" height="12" rx="2"/>
<text class="g-encre" fill="#1d1d1b" x="98" y="124" text-anchor="start">perte</text>
<line class="g-grille" stroke="#e4e1da" stroke-width="1" x1="46" y1="137" x2="46" y2="377"/>
<line class="g-grille" stroke="#e4e1da" stroke-width="1" x1="145.3" y1="137" x2="145.3" y2="377"/>
<line class="g-grille" stroke="#e4e1da" stroke-width="1" x1="244.7" y1="137" x2="244.7" y2="377"/>
<line class="g-grille" stroke="#e4e1da" stroke-width="1" x1="344" y1="137" x2="344" y2="377"/>
<rect class="g-plus" fill="#2a78d6" x="46" y="142" width="1" height="14" rx="2"><title>D1 : 0 € par ménage</title></rect>
<text class="g-doux" fill="#52514e" x="40" y="154" text-anchor="end" font-size="12">D1</text>
<text class="g-encre" fill="#1d1d1b" x="50.3" y="154" text-anchor="start" font-size="12">0 €</text>
