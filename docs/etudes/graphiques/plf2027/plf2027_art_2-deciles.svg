<text class="g-encre" fill="#1d1d1b" x="99" y="250" text-anchor="start" font-size="12">+49 €</text>
<rect class="g-plus" fill="#2a78d6" x="46" y="262" width="80.3" height="14" rx="2"><title>D6 : +81 € par ménage</title></rect>
<text class="g-doux" fill="#52514e" x="40" y="274" text-anchor="end" font-size="12">D6</text>
<text class="g-encre" fill="#1d1d1b" x="130.3" y="274" text-anchor="start" font-size="12">+81 €</text>
<rect class="g-plus" fill="#2a78d6" x="46" y="286" width="96.2" height="14" rx="2"><title>D7 : +97 € par ménage</title></rect>
<text class="g-doux" fill="#52514e" x="40" y="298" text-anchor="end" font-size="12">D7</text>
<text class="g-encre" fill="#1d1d1b" x="146.2" y="298" text-anchor="start" font-size="12">+97 €</text>
<rect class="g-plus" fill="#2a78d6" x="46" y="310" width="131.7" height="14" rx="2"><title>D8 : +133 € par ménage</title></rect>
<text class="g-doux" fill="#52514e" x="40" y="322" text-anchor="end" font-size="12">D8</text>
<text class="g-encre" fill="#1d1d1b" x="181.7" y="322" text-anchor="start" font-size="12">+133 €</text>
<rect class="g-plus" fill="#2a78d6" x="46" y="334" width="173.8" height="14" rx="2"><title>D9 : +175 € par ménage</title></rect>
<text class="g-doux" fill="#52514e" x="40" y="346" text-anchor="end" font-size="12">D9</text>
<text class="g-encre" fill="#1d1d1b" x="223.8" y="346" text-anchor="start" font-size="12">+175 €</text>
<rect class="g-plus" fill="#2a78d6" x="46" y="358" width="277.6" height="14" rx="2"><title>D10 : +279 € par ménage</title></rect>
<text class="g-doux" fill="#52514e" x="40" y="370" text-anchor="end" font-size="12">D10</text>
<text class="g-encre" fill="#1d1d1b" x="319.6" y="370" text-anchor="end" font-size="12">+279 €</text>
<line class="g-zero" stroke="#52514e" stroke-width="1.2" x1="46" y1="135" x2="46" y2="377"/>
<line class="g-axe" stroke="#8a877f" stroke-width="1" x1="46" y1="381" x2="344" y2="381"/>
<text class="g-doux" fill="#52514e" x="46" y="396" text-anchor="middle" font-size="12">0</text>
<text class="g-doux" fill="#52514e" x="145.3" y="396" text-anchor="middle" font-size="12">100</text>
<text class="g-doux" fill="#52514e" x="244.7" y="396" text-anchor="middle" font-size="12">200</text>
<text class="g-doux" fill="#52514e" x="344" y="396" text-anchor="middle" font-size="12">300</text>
<text class="g-doux" fill="#52514e" x="348" y="412" text-anchor="end" font-size="12">euros par ménage et par an, 2026</text>
<text class="g-doux" fill="#52514e" x="12" y="429" text-anchor="start" font-size="12">D1 : le dixième le plus modeste ; D10 : le plus aisé.</text>
</svg>
