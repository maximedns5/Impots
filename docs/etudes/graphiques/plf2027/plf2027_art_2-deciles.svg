<text class="g-doux" fill="#52514e" x="40" y="226" text-anchor="end" font-size="12">D4</text>
<text class="g-encre" fill="#1d1d1b" x="71.5" y="226" text-anchor="start" font-size="12">+22 €</text>
<rect class="g-plus" fill="#2a78d6" x="46" y="238" width="49" height="14" rx="2"><title>D5 : +49 € par ménage</title></rect>
