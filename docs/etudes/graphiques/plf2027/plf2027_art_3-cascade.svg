<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 393" width="360" height="393" role="img" aria-labelledby="plf2027_art_3-cascade-t plf2027_art_3-cascade-d" font-size="13">
<title id="plf2027_art_3-cascade-t">Du coût de 2026 à la dette de 2035</title>
<desc id="plf2027_art_3-cascade-d">Le coût de 2026 : coût mécanique −1,10 Md€ ; total −1,10 Md€. La dette en 2035, à θ½, vue vieillie, persistance lue : le coût, sans boucle −0,40 pt ; le PIB, dénominateur +0,04 pt ; les recettes induites +0,19 pt ; Δ dette −0,17 pt.</desc>
