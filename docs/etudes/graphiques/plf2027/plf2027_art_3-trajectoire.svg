<title id="plf2027_art_3-trajectoire-t">Le solde, la dette et le PIB, de 2026 à 2035</title>
<desc id="plf2027_art_3-trajectoire-d">De 2026 à 2035, à θ½, vue vieillie, persistance lue. Le solde public : +0,03 pt en 2026, +0,02 pt en 2035, la boîte θ de +0,01 pt à +0,04 pt en 2035. La dette (Δb) : −0,01 pt en 2026, −0,18 pt en 2035, la boîte θ de −0,36 pt à +0,02 pt en 2035. Le PIB : −0,02 % en 2026, −0,04 % en 2035, la boîte θ de −0,07 % à −0,01 % en 2035. Δ dette en 2035, par persistance et vue : lue, vieillie −0,18 pt ; lue, figée −0,14 pt ; éteinte, vieillie −0,36 pt ; éteinte, figée −0,28 pt ; tenue, vieillie −0,15 pt ; tenue, figée −0,12 pt. La dette lit le canal des créations d&#x27;entreprises, une hypothèse non validée ; sans lui : −0,18 pt en 2035, vue vieillie, persistance lue.</desc>
