<title id="plf2027_art_2-trajectoire-t">Le solde, la dette et le PIB, de 2026 à 2035</title>
<desc id="plf2027_art_2-trajectoire-d">De 2026 à 2035, à θ½, vue vieillie, persistance lue. Le solde public : −0,07 pt en 2026, −0,05 pt en 2035, la boîte θ de −0,09 pt à −0,01 pt en 2035. La dette (Δb) : +0,03 pt en 2026, +0,37 pt en 2035, la boîte θ de −0,08 pt à +0,81 pt en 2035. Le PIB : +0,04 % en 2026, +0,09 % en 2035, la boîte θ de +0,02 % à +0,16 % en 2035. Δ dette en 2035, par persistance et vue : lue, vieillie +0,37 pt ; lue, figée +0,28 pt ; éteinte, vieillie +0,79 pt ; éteinte, figée +0,61 pt ; tenue, vieillie +0,32 pt ; tenue, figée +0,24 pt.</desc>
