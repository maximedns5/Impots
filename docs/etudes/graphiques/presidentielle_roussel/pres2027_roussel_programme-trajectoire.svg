<title id="pres2027_roussel_programme-trajectoire-t">Le solde, la dette et le PIB, de 2026 à 2035</title>
<desc id="pres2027_roussel_programme-trajectoire-d">De 2026 à 2035, à θ½, vue vieillie, persistance lue. Le solde public : −0,79 pt en 2026, +0,01 pt en 2035, la boîte θ de −0,41 pt à +0,26 pt en 2035. La dette (Δb) : +0,50 pt en 2026, +0,48 pt en 2035, la boîte θ de −3,44 pt à +6,27 pt en 2035. Le PIB : +0,24 % en 2026, +1,28 % en 2035, la boîte θ de +0,52 % à +2,02 % en 2035. Δ dette en 2035, par persistance et vue : lue, vieillie +0,48 pt ; lue, figée +0,40 pt ; éteinte, vieillie +6,78 pt ; éteinte, figée +6,74 pt ; tenue, vieillie +1,16 pt ; tenue, figée +1,12 pt. La dette lit le canal des créations d&#x27;entreprises, une hypothèse non validée ; sans lui : +1,43 pt en 2035, vue vieillie, persistance lue.</desc>
