<title id="pres2027_roussel_programme-trajectoire-t">Le solde, la dette et le PIB, de 2026 à 2035</title>
<desc id="pres2027_roussel_programme-trajectoire-d">De 2026 à 2035, à θ½, vue vieillie, persistance lue. Le solde public : −0,79 pt en 2026, −0,09 pt en 2035, la boîte θ de −0,41 pt à +0,06 pt en 2035. La dette (Δb) : +0,52 pt en 2026, +1,23 pt en 2035, la boîte θ de −1,97 pt à +6,27 pt en 2035. Le PIB : +0,24 % en 2026, +1,09 % en 2035, la boîte θ de +0,52 % à +1,64 % en 2035. Δ dette en 2035, par persistance et vue : lue, vieillie +1,23 pt ; lue, figée +1,18 pt ; éteinte, vieillie +7,55 pt ; éteinte, figée +7,54 pt ; tenue, vieillie +1,91 pt ; tenue, figée +1,91 pt. La dette lit le canal des créations d&#x27;entreprises, une hypothèse non validée ; sans lui : +1,43 pt en 2035, vue vieillie, persistance lue.</desc>
