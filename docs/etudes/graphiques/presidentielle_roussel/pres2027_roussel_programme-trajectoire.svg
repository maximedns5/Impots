<desc id="pres2027_roussel_programme-trajectoire-d">De 2026 à 2035, à θ½, vue vieillie, persistance lue. Le solde public : −0,80 pt en 2026, −0,12 pt en 2035, la boîte θ de −0,41 pt à 0,00 pt en 2035. La dette (Δb) : +0,52 pt en 2026, +1,43 pt en 2035, la boîte θ de −1,57 pt à +6,27 pt en 2035. Le PIB : +0,23 % en 2026, +1,04 % en 2035, la boîte θ de +0,52 % à +1,53 % en 2035. Δ dette en 2035, par persistance et vue : lue, vieillie +1,43 pt ; lue, figée +1,40 pt ; éteinte, vieillie +7,76 pt ; éteinte, figée +7,76 pt ; tenue, vieillie +2,12 pt ; tenue, figée +2,12 pt.</desc>
