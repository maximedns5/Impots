<title id="pres2027_roussel_programme-trajectoire-t">Le solde, la dette et le PIB, de 2026 à 2035</title>
<desc id="pres2027_roussel_programme-trajectoire-d">De 2026 à 2035, à θ½, vue vieillie, persistance lue. Le solde public : −0,88 pt en 2026, −0,09 pt en 2035, la boîte θ de −0,43 pt à +0,07 pt en 2035. La dette (Δb) : +0,57 pt en 2026, +1,32 pt en 2035, la boîte θ de −2,23 pt à +6,97 pt en 2035. Le PIB : +0,26 % en 2026, +1,22 % en 2035, la boîte θ de +0,60 % à +1,82 % en 2035. Δ dette en 2035, par persistance et vue : lue, vieillie +1,32 pt ; lue, figée +0,92 pt ; éteinte, vieillie +8,51 pt ; éteinte, figée +7,39 pt ; tenue, vieillie +2,13 pt ; tenue, figée +1,67 pt. La dette lit le canal des créations d&#x27;entreprises, une hypothèse non validée ; sans lui : +1,56 pt en 2035, vue vieillie, persistance lue.</desc>
