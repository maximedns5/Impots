<title id="pres2027_roussel_programme-trajectoire-t">Le solde, la dette et le PIB, de 2026 à 2035</title>
<desc id="pres2027_roussel_programme-trajectoire-d">De 2026 à 2035, à θ½, vue vieillie, persistance lue. Le solde public : −0,90 pt en 2026, −0,09 pt en 2035, la boîte θ de −0,43 pt à +0,07 pt en 2035. La dette (Δb) : +0,58 pt en 2026, +1,34 pt en 2035, la boîte θ de −2,20 pt à +6,97 pt en 2035. Le PIB : +0,27 % en 2026, +1,21 % en 2035, la boîte θ de +0,60 % à +1,80 % en 2035. Δ dette en 2035, par persistance et vue : lue, vieillie +1,34 pt ; lue, figée +0,99 pt ; éteinte, vieillie +8,51 pt ; éteinte, figée +7,65 pt ; tenue, vieillie +2,14 pt ; tenue, figée +1,77 pt. La dette lit le canal des créations d&#x27;entreprises, une hypothèse non validée ; sans lui : +1,57 pt en 2035, vue vieillie, persistance lue.</desc>
