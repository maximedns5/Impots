<rect class="g-fond" fill="#fcfcfb" x="0" y="0" width="360" height="385"/>
<text class="g-encre" fill="#1d1d1b" x="12" y="20" text-anchor="start" font-size="15" font-weight="600">La dette de 2026 à 2035, si ce qui est</text>
<text class="g-encre" fill="#1d1d1b" x="12" y="39" text-anchor="start" font-size="15" font-weight="600">annoncé est tenu</text>
<text class="g-doux" fill="#52514e" x="12" y="58" text-anchor="start">Annoncé par le candidat, non vérifié ; jamais</text>
<text class="g-doux" fill="#52514e" x="12" y="75" text-anchor="start">additionné au coût ni au verdict. Vue vieillie, à</text>
<text class="g-doux" fill="#52514e" x="12" y="92" text-anchor="start">θ½, persistance « lue ».</text>
<line class="g-zero" stroke="#52514e" stroke-width="3" x1="12" y1="119" x2="34" y2="119"/>
