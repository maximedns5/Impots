<polyline class="g-s4" stroke="#6250d6" fill="none" stroke-width="2.5" stroke-dasharray="6 4" points="52,319.3 84.7,320.1 117.3,312.5 150,298.3 182.7,283.4 215.3,269.2 248,255.5 280.7,242.3 313.3,229.6 346,217.5"><title>part réalisée 50 %, 2035 : +2,51 pt</title></polyline>
