<title id="pres2027_ruffin_programme-trajectoire-t">Le solde, la dette et le PIB, de 2026 à 2035</title>
<desc id="pres2027_ruffin_programme-trajectoire-d">De 2026 à 2035, à θ½, vue vieillie, persistance lue. Le solde public : −0,84 pt en 2026, −0,22 pt en 2035, la boîte θ de −0,63 pt à +0,09 pt en 2035. La dette (Δb) : +0,44 pt en 2026, +2,13 pt en 2035, la boîte θ de −2,15 pt à +7,42 pt en 2035. Le PIB : +0,34 % en 2026, +1,17 % en 2035, la boîte θ de +0,42 % à +1,90 % en 2035. Δ dette en 2035, par persistance et vue : lue, vieillie +2,13 pt ; lue, figée +1,76 pt ; éteinte, vieillie +7,82 pt ; éteinte, figée +7,29 pt ; tenue, vieillie +2,33 pt ; tenue, figée +2,04 pt. La dette lit le canal des créations d&#x27;entreprises, une hypothèse non validée ; sans lui : +2,71 pt en 2035, vue vieillie, persistance lue.</desc>
