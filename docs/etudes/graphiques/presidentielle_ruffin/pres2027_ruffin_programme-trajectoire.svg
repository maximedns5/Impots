<title id="pres2027_ruffin_programme-trajectoire-t">Le solde, la dette et le PIB, de 2026 à 2035</title>
<desc id="pres2027_ruffin_programme-trajectoire-d">De 2026 à 2035, à θ½, vue vieillie, persistance lue. Le solde public : −0,84 pt en 2026, −0,28 pt en 2035, la boîte θ de −0,63 pt à −0,03 pt en 2035. La dette (Δb) : +0,45 pt en 2026, +2,59 pt en 2035, la boîte θ de −1,25 pt à +7,42 pt en 2035. Le PIB : +0,33 % en 2026, +1,05 % en 2035, la boîte θ de +0,42 % à +1,67 % en 2035. Δ dette en 2035, par persistance et vue : lue, vieillie +2,59 pt ; lue, figée +2,25 pt ; éteinte, vieillie +8,29 pt ; éteinte, figée +7,79 pt ; tenue, vieillie +2,79 pt ; tenue, figée +2,53 pt. La dette lit le canal des créations d&#x27;entreprises, une hypothèse non validée ; sans lui : +2,71 pt en 2035, vue vieillie, persistance lue.</desc>
