<title id="pres2027_ruffin_programme-trajectoire-t">Le solde, la dette et le PIB, de 2026 à 2035</title>
<desc id="pres2027_ruffin_programme-trajectoire-d">De 2026 à 2035, à θ½, vue vieillie, persistance lue. Le solde public : −0,91 pt en 2026, −0,28 pt en 2035, la boîte θ de −0,64 pt à −0,02 pt en 2035. La dette (Δb) : +0,50 pt en 2026, +2,63 pt en 2035, la boîte θ de −1,40 pt à +7,81 pt en 2035. Le PIB : +0,35 % en 2026, +1,13 % en 2035, la boîte θ de +0,46 % à +1,77 % en 2035. Δ dette en 2035, par persistance et vue : lue, vieillie +2,63 pt ; lue, figée +2,13 pt ; éteinte, vieillie +8,84 pt ; éteinte, figée +7,89 pt ; tenue, vieillie +2,91 pt ; tenue, figée +2,45 pt. La dette lit le canal des créations d&#x27;entreprises, une hypothèse non validée ; sans lui : +2,77 pt en 2035, vue vieillie, persistance lue.</desc>
