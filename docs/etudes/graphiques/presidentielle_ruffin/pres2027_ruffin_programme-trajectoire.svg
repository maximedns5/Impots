<desc id="pres2027_ruffin_programme-trajectoire-d">De 2026 à 2035, à θ½, vue vieillie, persistance lue. Le solde public : −0,85 pt en 2026, −0,30 pt en 2035, la boîte θ de −0,63 pt à −0,06 pt en 2035. La dette (Δb) : +0,46 pt en 2026, +2,71 pt en 2035, la boîte θ de −1,01 pt à +7,42 pt en 2035. Le PIB : +0,33 % en 2026, +1,02 % en 2035, la boîte θ de +0,42 % à +1,61 % en 2035. Δ dette en 2035, par persistance et vue : lue, vieillie +2,71 pt ; lue, figée +2,39 pt ; éteinte, vieillie +8,42 pt ; éteinte, figée +7,93 pt ; tenue, vieillie +2,92 pt ; tenue, figée +2,67 pt.</desc>
