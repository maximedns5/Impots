<title id="pres2027_ruffin_programme-trajectoire-t">Le solde, la dette et le PIB, de 2026 à 2035</title>
<desc id="pres2027_ruffin_programme-trajectoire-d">De 2026 à 2035, à θ½, vue vieillie, persistance lue. Le solde public : −0,92 pt en 2026, −0,28 pt en 2035, la boîte θ de −0,64 pt à −0,02 pt en 2035. La dette (Δb) : +0,50 pt en 2026, +2,64 pt en 2035, la boîte θ de −1,39 pt à +7,80 pt en 2035. Le PIB : +0,36 % en 2026, +1,12 % en 2035, la boîte θ de +0,46 % à +1,76 % en 2035. Δ dette en 2035, par persistance et vue : lue, vieillie +2,64 pt ; lue, figée +2,18 pt ; éteinte, vieillie +8,83 pt ; éteinte, figée +8,05 pt ; tenue, vieillie +2,92 pt ; tenue, figée +2,51 pt. La dette lit le canal des créations d&#x27;entreprises, une hypothèse non validée ; sans lui : +2,78 pt en 2035, vue vieillie, persistance lue.</desc>
