<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 439" width="360" height="439" role="img" aria-labelledby="pres2027_lisnard_programme-deciles-t pres2027_lisnard_programme-deciles-d" font-size="13">
<title id="pres2027_lisnard_programme-deciles-t">Ce que chaque décile y gagne ou y perd en 2026</title>
<desc id="pres2027_lisnard_programme-deciles-d">Le gain moyen par ménage en 2026, par décile de niveau de vie : D1 +64 € ; D2 +187 € ; D3 +363 € ; D4 +468 € ; D5 +639 € ; D6 +763 € ; D7 +883 € ; D8 +1 080 € ; D9 +1 556 € ; D10 +2 926 €.</desc>
