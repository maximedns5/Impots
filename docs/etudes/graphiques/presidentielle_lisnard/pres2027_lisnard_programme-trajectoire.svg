<title id="pres2027_lisnard_programme-trajectoire-t">Le solde, la dette et le PIB, de 2026 à 2035</title>
<desc id="pres2027_lisnard_programme-trajectoire-d">De 2026 à 2035, à θ½, vue vieillie, persistance lue. Le solde public : −1,02 pt en 2026, −0,67 pt en 2035, la boîte θ de −1,14 pt à −0,19 pt en 2035. La dette (Δb) : +0,51 pt en 2026, +5,49 pt en 2035, la boîte θ de +0,38 pt à +10,54 pt en 2035. Le PIB : +0,43 % en 2026, +0,93 % en 2035, la boîte θ de +0,16 % à +1,71 % en 2035. Δ dette en 2035, par persistance et vue : lue, vieillie +5,49 pt ; lue, figée +4,43 pt ; éteinte, vieillie +9,89 pt ; éteinte, figée +8,05 pt ; tenue, vieillie +4,72 pt ; tenue, figée +3,78 pt. La dette lit le canal des créations d&#x27;entreprises, une hypothèse non validée ; sans lui : +5,70 pt en 2035, vue vieillie, persistance lue.</desc>
