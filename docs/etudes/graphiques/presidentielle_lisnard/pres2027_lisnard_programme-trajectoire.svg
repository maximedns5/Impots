<title id="pres2027_lisnard_programme-trajectoire-t">Le solde, la dette et le PIB, de 2026 à 2035</title>
<desc id="pres2027_lisnard_programme-trajectoire-d">De 2026 à 2035, à θ½, vue vieillie, persistance lue. Le solde public : −1,02 pt en 2026, −0,69 pt en 2035, la boîte θ de −1,14 pt à −0,25 pt en 2035. La dette (Δb) : +0,51 pt en 2026, +5,71 pt en 2035, la boîte θ de +0,78 pt à +10,57 pt en 2035. Le PIB : +0,43 % en 2026, +0,88 % en 2035, la boîte θ de +0,15 % à +1,60 % en 2035. Δ dette en 2035, par persistance et vue : lue, vieillie +5,71 pt ; lue, figée +4,63 pt ; éteinte, vieillie +10,12 pt ; éteinte, figée +8,25 pt ; tenue, vieillie +4,94 pt ; tenue, figée +3,97 pt. La dette lit le canal des créations d&#x27;entreprises, une hypothèse non validée ; sans lui : +5,70 pt en 2035, vue vieillie, persistance lue.</desc>
