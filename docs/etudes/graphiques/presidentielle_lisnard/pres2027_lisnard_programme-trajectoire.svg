<title id="pres2027_lisnard_programme-trajectoire-t">Le solde, la dette et le PIB, de 2026 à 2035</title>
<desc id="pres2027_lisnard_programme-trajectoire-d">De 2026 à 2035, à θ½, vue vieillie, persistance lue. Le solde public : −1,02 pt en 2026, −0,69 pt en 2035, la boîte θ de −1,14 pt à −0,23 pt en 2035. La dette (Δb) : +0,51 pt en 2026, +5,65 pt en 2035, la boîte θ de +0,70 pt à +10,54 pt en 2035. Le PIB : +0,43 % en 2026, +0,89 % en 2035, la boîte θ de +0,16 % à +1,63 % en 2035. Δ dette en 2035, par persistance et vue : lue, vieillie +5,65 pt ; lue, figée +4,58 pt ; éteinte, vieillie +10,06 pt ; éteinte, figée +8,20 pt ; tenue, vieillie +4,88 pt ; tenue, figée +3,92 pt. La dette lit le canal des créations d&#x27;entreprises, une hypothèse non validée ; sans lui : +5,70 pt en 2035, vue vieillie, persistance lue.</desc>
