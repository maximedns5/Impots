<desc id="pres2027_lisnard_programme-trajectoire-d">De 2026 à 2035, à θ½, vue vieillie, persistance lue. Le solde public : −1,02 pt en 2026, −0,69 pt en 2035, la boîte θ de −1,14 pt à −0,25 pt en 2035. La dette (Δb) : +0,51 pt en 2026, +5,70 pt en 2035, la boîte θ de +0,78 pt à +10,54 pt en 2035. Le PIB : +0,43 % en 2026, +0,88 % en 2035, la boîte θ de +0,16 % à +1,60 % en 2035. Δ dette en 2035, par persistance et vue : lue, vieillie +5,70 pt ; lue, figée +4,62 pt ; éteinte, vieillie +10,10 pt ; éteinte, figée +8,24 pt ; tenue, vieillie +4,93 pt ; tenue, figée +3,96 pt. Si les économies annoncées sont tenues : −24,26 pt en 2035.</desc>
