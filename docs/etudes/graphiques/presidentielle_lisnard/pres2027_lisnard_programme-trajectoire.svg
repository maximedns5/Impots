<title id="pres2027_lisnard_programme-trajectoire-t">Le solde, la dette et le PIB, de 2026 à 2035</title>
<desc id="pres2027_lisnard_programme-trajectoire-d">De 2026 à 2035, à θ½, vue vieillie, persistance lue. Le solde public : −1,03 pt en 2026, −0,70 pt en 2035, la boîte θ de −1,15 pt à −0,25 pt en 2035. La dette (Δb) : +0,51 pt en 2026, +5,71 pt en 2035, la boîte θ de +0,72 pt à +10,63 pt en 2035. Le PIB : +0,44 % en 2026, +0,89 % en 2035, la boîte θ de +0,15 % à +1,62 % en 2035. Δ dette en 2035, par persistance et vue : lue, vieillie +5,71 pt ; lue, figée +4,69 pt ; éteinte, vieillie +10,18 pt ; éteinte, figée +8,37 pt ; tenue, vieillie +4,93 pt ; tenue, figée +4,02 pt. La dette lit le canal des créations d&#x27;entreprises, une hypothèse non validée ; sans lui : +5,69 pt en 2035, vue vieillie, persistance lue.</desc>
