<title id="pres2027_arthaud_programme-trajectoire-t">Le solde, la dette et le PIB, de 2026 à 2035</title>
<desc id="pres2027_arthaud_programme-trajectoire-d">De 2026 à 2035, à θ½, vue vieillie, persistance lue. Le solde public : −1,92 pt en 2026, −0,28 pt en 2035, la boîte θ de −1,19 pt à −0,01 pt en 2035. La dette (Δb) : +1,45 pt en 2026, +3,41 pt en 2035, la boîte θ de −4,06 pt à +16,32 pt en 2035. Le PIB : +0,40 % en 2026, +3,19 % en 2035, la boîte θ de +1,66 % à +4,66 % en 2035. Δ dette en 2035, par persistance et vue : lue, vieillie +3,41 pt ; lue, figée +3,82 pt ; éteinte, vieillie +20,83 pt ; éteinte, figée +17,78 pt ; tenue, vieillie +6,05 pt ; tenue, figée +6,20 pt.</desc>
