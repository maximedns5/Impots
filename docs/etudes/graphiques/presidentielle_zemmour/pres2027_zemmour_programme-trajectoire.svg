<desc id="pres2027_zemmour_programme-trajectoire-d">De 2026 à 2035, à θ½, vue vieillie, persistance lue. Le solde public : −2,46 pt en 2026, −1,59 pt en 2035, la boîte θ de −2,84 pt à −0,33 pt en 2035. La dette (Δb) : +0,91 pt en 2026, +12,24 pt en 2035, la boîte θ de −1,71 pt à +26,37 pt en 2035. Le PIB : +1,32 % en 2026, +2,45 % en 2035, la boîte θ de +0,40 % à +4,50 % en 2035. Δ dette en 2035, par persistance et vue : lue, vieillie +12,24 pt ; lue, figée +10,34 pt ; éteinte, vieillie +25,30 pt ; éteinte, figée +21,59 pt ; tenue, vieillie +9,86 pt ; tenue, figée +8,25 pt.</desc>
