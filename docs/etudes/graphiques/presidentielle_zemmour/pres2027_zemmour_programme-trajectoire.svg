<title id="pres2027_zemmour_programme-trajectoire-t">Le solde, la dette et le PIB, de 2026 à 2035</title>
<desc id="pres2027_zemmour_programme-trajectoire-d">De 2026 à 2035, à θ½, vue vieillie, persistance lue. Le solde public : −2,42 pt en 2026, −1,58 pt en 2035, la boîte θ de −2,82 pt à −0,33 pt en 2035. La dette (Δb) : +0,87 pt en 2026, +12,02 pt en 2035, la boîte θ de −1,90 pt à +26,12 pt en 2035. Le PIB : +1,31 % en 2026, +2,45 % en 2035, la boîte θ de +0,40 % à +4,49 % en 2035. Δ dette en 2035, par persistance et vue : lue, vieillie +12,02 pt ; lue, figée +10,09 pt ; éteinte, vieillie +25,04 pt ; éteinte, figée +21,29 pt ; tenue, vieillie +9,65 pt ; tenue, figée +8,01 pt. La dette lit le canal des créations d&#x27;entreprises, une hypothèse non validée ; sans lui : +12,02 pt en 2035, vue vieillie, persistance lue.</desc>
