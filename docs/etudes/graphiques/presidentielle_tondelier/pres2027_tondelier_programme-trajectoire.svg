<title id="pres2027_tondelier_programme-trajectoire-t">Le solde, la dette et le PIB, de 2026 à 2035</title>
<desc id="pres2027_tondelier_programme-trajectoire-d">De 2026 à 2035, à θ½, vue vieillie, persistance lue. Le solde public : −0,50 pt en 2026, −0,22 pt en 2035, la boîte θ de −0,29 pt à −0,22 pt en 2035. La dette (Δb) : +0,44 pt en 2026, +2,51 pt en 2035, la boîte θ de +1,78 pt à +3,95 pt en 2035. Le PIB : +0,05 % en 2026, +0,30 % en 2035, la boîte θ de +0,19 % à +0,40 % en 2035. Δ dette en 2035, par persistance et vue : lue, vieillie +2,51 pt ; lue, figée +2,20 pt ; éteinte, vieillie +4,47 pt ; éteinte, figée +4,54 pt ; tenue, vieillie +2,88 pt ; tenue, figée +2,61 pt. La dette lit le canal des créations d&#x27;entreprises, une hypothèse non validée ; sans lui : +2,60 pt en 2035, vue vieillie, persistance lue.</desc>
