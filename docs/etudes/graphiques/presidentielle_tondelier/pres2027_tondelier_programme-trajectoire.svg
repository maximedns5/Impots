<title id="pres2027_tondelier_programme-trajectoire-t">Le solde, la dette et le PIB, de 2026 à 2035</title>
<desc id="pres2027_tondelier_programme-trajectoire-d">De 2026 à 2035, à θ½, vue vieillie, persistance lue. Le solde public : −0,58 pt en 2026, −0,23 pt en 2035, la boîte θ de −0,30 pt à −0,23 pt en 2035. La dette (Δb) : +0,50 pt en 2026, +2,64 pt en 2035, la boîte θ de +1,74 pt à +4,38 pt en 2035. Le PIB : +0,07 % en 2026, +0,36 % en 2035, la boîte θ de +0,23 % à +0,49 % en 2035. Δ dette en 2035, par persistance et vue : lue, vieillie +2,64 pt ; lue, figée +2,21 pt ; éteinte, vieillie +5,05 pt ; éteinte, figée +4,90 pt ; tenue, vieillie +3,09 pt ; tenue, figée +2,67 pt. La dette lit le canal des créations d&#x27;entreprises, une hypothèse non validée ; sans lui : +2,75 pt en 2035, vue vieillie, persistance lue.</desc>
