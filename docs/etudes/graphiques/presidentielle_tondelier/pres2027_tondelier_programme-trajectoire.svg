<title id="pres2027_tondelier_programme-trajectoire-t">Le solde, la dette et le PIB, de 2026 à 2035</title>
<desc id="pres2027_tondelier_programme-trajectoire-d">De 2026 à 2035, à θ½, vue vieillie, persistance lue. Le solde public : −0,50 pt en 2026, −0,23 pt en 2035, la boîte θ de −0,29 pt à −0,24 pt en 2035. La dette (Δb) : +0,45 pt en 2026, +2,60 pt en 2035, la boîte θ de +1,95 pt à +3,95 pt en 2035. Le PIB : +0,05 % en 2026, +0,28 % en 2035, la boîte θ de +0,19 % à +0,36 % en 2035. Δ dette en 2035, par persistance et vue : lue, vieillie +2,60 pt ; lue, figée +2,30 pt ; éteinte, vieillie +4,56 pt ; éteinte, figée +4,64 pt ; tenue, vieillie +2,97 pt ; tenue, figée +2,71 pt.</desc>
