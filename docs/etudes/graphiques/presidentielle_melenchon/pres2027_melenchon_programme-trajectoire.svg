<title id="pres2027_melenchon_programme-trajectoire-t">Le solde, la dette et le PIB, de 2026 à 2035</title>
<desc id="pres2027_melenchon_programme-trajectoire-d">De 2026 à 2035, à θ½, vue vieillie, persistance lue. Le solde public : −3,10 pt en 2026, −2,51 pt en 2035, la boîte θ de −2,96 pt à −2,10 pt en 2035. La dette (Δb) : +3,44 pt en 2026, +27,50 pt en 2035, la boîte θ de +24,65 pt à +31,33 pt en 2035. Le PIB : −0,28 % en 2026, −0,48 % en 2035, la boîte θ de −1,12 % à +0,14 % en 2035. Δ dette en 2035, par persistance et vue : lue, vieillie +27,50 pt ; lue, figée +24,83 pt ; éteinte, vieillie +26,11 pt ; éteinte, figée +24,45 pt ; tenue, vieillie +28,47 pt ; tenue, figée +25,76 pt. La dette lit le canal des créations d&#x27;entreprises, une hypothèse non validée ; sans lui : +27,71 pt en 2035, vue vieillie, persistance lue.</desc>
