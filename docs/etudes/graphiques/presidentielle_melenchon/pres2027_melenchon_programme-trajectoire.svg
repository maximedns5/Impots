<title id="pres2027_melenchon_programme-trajectoire-t">Le solde, la dette et le PIB, de 2026 à 2035</title>
<desc id="pres2027_melenchon_programme-trajectoire-d">De 2026 à 2035, à θ½, vue vieillie, persistance lue. Le solde public : −3,09 pt en 2026, −2,51 pt en 2035, la boîte θ de −2,96 pt à −2,11 pt en 2035. La dette (Δb) : +3,42 pt en 2026, +27,48 pt en 2035, la boîte θ de +24,69 pt à +31,29 pt en 2035. Le PIB : −0,28 % en 2026, −0,46 % en 2035, la boîte θ de −1,10 % à +0,14 % en 2035. Δ dette en 2035, par persistance et vue : lue, vieillie +27,48 pt ; lue, figée +24,76 pt ; éteinte, vieillie +26,14 pt ; éteinte, figée +24,16 pt ; tenue, vieillie +28,46 pt ; tenue, figée +25,66 pt. La dette lit le canal des créations d&#x27;entreprises, une hypothèse non validée ; sans lui : +27,70 pt en 2035, vue vieillie, persistance lue.</desc>
