<title id="pres2027_melenchon_programme-trajectoire-t">Le solde, la dette et le PIB, de 2026 à 2035</title>
<desc id="pres2027_melenchon_programme-trajectoire-d">De 2026 à 2035, à θ½, vue vieillie, persistance lue. Le solde public : −2,97 pt en 2026, −2,53 pt en 2035, la boîte θ de −2,96 pt à −2,10 pt en 2035. La dette (Δb) : +3,36 pt en 2026, +27,54 pt en 2035, la boîte θ de +23,97 pt à +31,73 pt en 2035. Le PIB : −0,32 % en 2026, −0,73 % en 2035, la boîte θ de −1,40 % à −0,08 % en 2035. Δ dette en 2035, par persistance et vue : lue, vieillie +27,54 pt ; lue, figée +25,30 pt ; éteinte, vieillie +24,78 pt ; éteinte, figée +24,41 pt ; tenue, vieillie +28,29 pt ; tenue, figée +26,14 pt. Si les économies annoncées sont tenues : +32,55 pt en 2035.</desc>
