<title id="pres2027_melenchon_programme-trajectoire-t">Le solde, la dette et le PIB, de 2026 à 2035</title>
<desc id="pres2027_melenchon_programme-trajectoire-d">De 2026 à 2035, à θ½, vue vieillie, persistance lue. Le solde public : −2,97 pt en 2026, −2,44 pt en 2035, la boîte θ de −2,96 pt à −1,92 pt en 2035. La dette (Δb) : +3,34 pt en 2026, +26,78 pt en 2035, la boîte θ de +22,48 pt à +31,73 pt en 2035. Le PIB : −0,31 % en 2026, −0,55 % en 2035, la boîte θ de −1,40 % à +0,27 % en 2035. Δ dette en 2035, par persistance et vue : lue, vieillie +26,78 pt ; lue, figée +24,41 pt ; éteinte, vieillie +24,04 pt ; éteinte, figée +23,52 pt ; tenue, vieillie +27,53 pt ; tenue, figée +25,24 pt. La dette lit le canal des créations d&#x27;entreprises, une hypothèse non validée ; sans lui : +27,54 pt en 2035, vue vieillie, persistance lue.</desc>
