<title id="pres2027_melenchon_programme-trajectoire-t">Le solde, la dette et le PIB, de 2026 à 2035</title>
<desc id="pres2027_melenchon_programme-trajectoire-d">De 2026 à 2035, à θ½, vue vieillie, persistance lue. Le solde public : −2,97 pt en 2026, −2,51 pt en 2035, la boîte θ de −2,96 pt à −2,06 pt en 2035. La dette (Δb) : +3,35 pt en 2026, +27,38 pt en 2035, la boîte θ de +23,65 pt à +31,73 pt en 2035. Le PIB : −0,32 % en 2026, −0,69 % en 2035, la boîte θ de −1,40 % à 0,00 % en 2035. Δ dette en 2035, par persistance et vue : lue, vieillie +27,38 pt ; lue, figée +25,11 pt ; éteinte, vieillie +24,62 pt ; éteinte, figée +24,22 pt ; tenue, vieillie +28,13 pt ; tenue, figée +25,94 pt. La dette lit le canal des créations d&#x27;entreprises, une hypothèse non validée ; sans lui : +27,54 pt en 2035, vue vieillie, persistance lue.</desc>
