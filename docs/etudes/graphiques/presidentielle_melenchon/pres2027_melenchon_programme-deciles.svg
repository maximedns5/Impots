<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 439" width="360" height="439" role="img" aria-labelledby="pres2027_melenchon_programme-deciles-t pres2027_melenchon_programme-deciles-d" font-size="13">
<title id="pres2027_melenchon_programme-deciles-t">Ce que chaque décile y gagne ou y perd en 2026</title>
<desc id="pres2027_melenchon_programme-deciles-d">Le gain moyen par ménage en 2026, par décile de niveau de vie : D1 +3 208 € ; D2 +2 158 € ; D3 +2 581 € ; D4 +2 520 € ; D5 +2 608 € ; D6 +2 718 € ; D7 +2 769 € ; D8 +2 617 € ; D9 +2 724 € ; D10 −1 912 €.</desc>
