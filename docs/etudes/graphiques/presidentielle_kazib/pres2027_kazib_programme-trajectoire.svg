<title id="pres2027_kazib_programme-trajectoire-t">Le solde, la dette et le PIB, de 2026 à 2035</title>
<desc id="pres2027_kazib_programme-trajectoire-d">De 2026 à 2035, à θ½, vue vieillie, persistance lue. Le solde public : −0,36 pt en 2026, +0,04 pt en 2035, la boîte θ de −0,14 pt à +0,14 pt en 2035. La dette (Δb) : +0,23 pt en 2026, −0,02 pt en 2035, la boîte θ de −1,75 pt à +2,60 pt en 2035. Le PIB : +0,11 % en 2026, +0,61 % en 2035, la boîte θ de +0,27 % à +0,95 % en 2035. Δ dette en 2035, par persistance et vue : lue, vieillie −0,02 pt ; lue, figée −0,04 pt ; éteinte, vieillie +2,92 pt ; éteinte, figée +3,09 pt ; tenue, vieillie +0,41 pt ; tenue, figée +0,42 pt. La dette lit le canal des créations d&#x27;entreprises, une hypothèse non validée ; sans lui : +0,49 pt en 2035, vue vieillie, persistance lue.</desc>
