<title id="pres2027_le_pen_programme-trajectoire-t">Le solde, la dette et le PIB, de 2026 à 2035</title>
<desc id="pres2027_le_pen_programme-trajectoire-d">De 2026 à 2035, à θ½, vue vieillie, persistance lue. Le solde public : −0,62 pt en 2026, −0,43 pt en 2035, la boîte θ de −0,79 pt à −0,07 pt en 2035. La dette (Δb) : +0,29 pt en 2026, +3,01 pt en 2035, la boîte θ de −0,56 pt à +6,98 pt en 2035. Le PIB : +0,28 % en 2026, +0,72 % en 2035, la boîte θ de +0,15 % à +1,30 % en 2035. Δ dette en 2035, par persistance et vue : lue, vieillie +3,01 pt ; lue, figée +2,27 pt ; éteinte, vieillie +6,71 pt ; éteinte, figée +5,17 pt ; tenue, vieillie +2,51 pt ; tenue, figée +1,87 pt. La dette lit le canal des créations d&#x27;entreprises, une hypothèse non validée ; sans lui : +3,01 pt en 2035, vue vieillie, persistance lue.</desc>
