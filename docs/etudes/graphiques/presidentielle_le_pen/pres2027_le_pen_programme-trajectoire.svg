<desc id="pres2027_le_pen_programme-trajectoire-d">De 2026 à 2035, à θ½, vue vieillie, persistance lue. Le solde public : −0,61 pt en 2026, −0,43 pt en 2035, la boîte θ de −0,79 pt à −0,07 pt en 2035. La dette (Δb) : +0,29 pt en 2026, +3,00 pt en 2035, la boîte θ de −0,56 pt à +6,96 pt en 2035. Le PIB : +0,27 % en 2026, +0,72 % en 2035, la boîte θ de +0,15 % à +1,30 % en 2035. Δ dette en 2035, par persistance et vue : lue, vieillie +3,00 pt ; lue, figée +2,25 pt ; éteinte, vieillie +6,68 pt ; éteinte, figée +5,12 pt ; tenue, vieillie +2,50 pt ; tenue, figée +1,85 pt. Si les économies annoncées sont tenues : −7,24 pt en 2035.</desc>
