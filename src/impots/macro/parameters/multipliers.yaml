# Fiscal multipliers by instrument (PHASE4_SPEC §2).
#
# NO VALUES LIVE IN THIS FILE. Every number is parsed from the published PDF by
# `impots.macro.mesange`, per D-026. What lives here is what a PDF cannot carry —
# scope, support, the verifier's verdict, and the reasons a row is narrower than
# someone might wish.
#
# THE SPEC'S SEEDS WERE WRONG, and this is the record of how. §2 proposed "0.2-0.6
# tax-side, 0.5-1.2 spending-side, 1.3-2.5 in slack", flagged as reviewer-compiled and
# suspect by precedent. Measured against the source:
#
#   * tax-side 0.2-0.6 is a YEAR-ONE range wearing no horizon. The tax-side variants
#     run 0.20-0.51 at one year and 0.72-0.90 at three.
#   * spending-side 0.5-1.2 excludes its own most important case: public investment is
#     1.31 at one year and 1.38 at two.
#   * 1.3-2.5 in slack has no source here. See dispersion.yaml.
#
# AND THE FIRST VERSION OF THIS FILE WAS ALSO WRONG, on scope rather than on values.
# The adversarial pass of 2026-09-03 returned SCOPE_PROBLEM on both rows with
# twenty-five findings; the corrections are folded in below and the largest are named
# in each `verifier.note`.

thresholds:
  extrapolation_widening: 2.0

source_table:
  reader: impots.macro.mesange
  file: insee_G2017-04_mesange.pdf
  citation: >
    Bardaji, Campagne, Khder, Lafféter, Simon et al., « Le modèle macroéconométrique
    Mésange : réestimation et nouveautés », INSEE Document de travail G2017/04 /
    DG Trésor, mai 2017, section 4 « Principales variantes ». Les numéros de page
    portés par le lecteur sont des pages PDF, soit le FOLIO IMPRIMÉ PLUS UN.
  url: https://www.insee.fr/fr/statistiques/fichier/2848300/G2017-04.pdf
  vintage: "2017"
  quote: >-
    Sauf mention contraire, le choc est effectué de façon permanente, à taux d'intérêt
    réels constants et à taux de change nominaux constants. Il n'y a pas non plus de
    réaction endogène de la politique budgétaire.

parameters:
  multiplier_by_instrument:
    value:
      from_source_table: gdp
      distribution: triangular
      usable_horizons: ["1", "2", "3"]
    applies_to: >
      Réponse du PIB en volume à un choc permanent de 1 point de PIB sur l'instrument,
      en écart au compte central. NEUF variantes, dont une ciblée bas salaires.

      CONDITIONS DE SIMULATION, héritées par toutes les lignes et non déclarées avant
      la vérification : choc PERMANENT, à taux d'intérêt réels constants, à taux de
      change nominaux constants, SANS réaction endogène de la politique budgétaire ni
      monétaire. Un chiffrage qui suppose une banque centrale ou un gouvernement
      réagissant ne peut pas s'appuyer sur ces valeurs.

      LES VARIANTES SONT UNIFORMES, sauf `cotisations_employeurs_ciblees`. Le modèle
      n'a qu'un seul taux d'imposition sur le revenu pour tous les salariés (p118), et
      les baisses de cotisations sont des baisses uniformes de 3,7 points. Aucune de
      ces lignes ne représente donc un effet de barème, de progressivité ou de ciblage :
      elles décrivent le montant déplacé, pas sa distribution.

      L'HORIZON « 1 » EST UN EFFET MOYEN SUR LA PREMIÈRE ANNÉE, pas un niveau à quatre
      trimestres, le choc intervenant au premier trimestre 2015.

      `depense_publique` N'EST PAS UN INSTRUMENT mais un composite (8 % investissement
      public, 25 % rémunérations publiques, 9 % prestations en nature, 12 %
      consommations intermédiaires, 46 % prestations sociales en espèces). Elle
      recoupe `investissement_public` à 8 % : les additionner double compte.
    responds_to_knobs: [ir_bareme, csg_*, cotisations_*, tva_*]
    support:
      estimated_on: >
        Chocs d'un point de PIB, mais PAS SUR LA MÊME BASE selon les lignes, ce que la
        première version de ce champ affirmait à tort. p101 réserve la convention
        ex ante : « les variantes FISCALES sont effectuées à hauteur de 1 % du PIB ex
        ante, soit un montant de 22 Md€ en 2015 ». Les deux variantes de dépense sont
        des chocs EN VOLUME. Et la TVA est un cas à part : le choc s'élève à 1,18 point
        de PIB ex ante pour 1 point NET, les APU versant environ 15 % de la TVA — une
        réforme de TVA chiffrée en brut ex ante, convention usuelle en PLF, recevrait
        sinon un multiplicateur surestimé de 18 %. `mesange.VariantSpec.ex_ante_points`
        porte ce facteur.

        LA BORNE DE 1,0 EST UN CHOIX DU PROJET, PAS UNE CITATION (D-230). Le document
        ne fixe aucun seuil. p101 (folio 100) concède la linéarité « dès lors que les
        chocs sont d'ampleur limitée » et prévient que « pour l'étude de chocs de plus
        forte ampleur [...] l'utilisation de Mésange devient moins directe » ; p109
        (folio 108) dit le cadre linéaire « valable pour des chocs de quelques points de
        PIB ». « Quelques » n'est pas un nombre. Les variantes sont simulées à un point :
        jusque-là, un chiffrage lit ce que le modèle a fait tourner ; au-delà, il
        l'extrapole par une linéarité que le folio 108 accorde sans la chiffrer, et le
        grade « illustrative » le dit. Un point de PIB, c'est déjà +28 %
        d'investissement public (folio 102), environ un tiers de l'impôt sur le revenu
        (2,5 points sur 7,6 %, folio 117), plus du quart des cotisations salariales
        (3,7 points sur un peu plus de 13 %, folio 110) : des ordres de grandeur que le
        projet tire du document, non une phrase qu'il cite.
      max_variation_graded_in_support: 1.0
    verifier:
      verdict: SCOPE_PROBLEM
      date: 2026-10-20
      ref: D-230
      note: >
        LIGNE ROUVERTE PAR D-230, sur la décision du propriétaire, pour deux textes que
        la passe de D-218 avait trouvés faux sans les corriger, faute de rouvrir la
        ligne. Passe adverse du 2026-10-20 contre le PDF, aucune valeur touchée. (1) La
        borne de 1,0 : CONFIRMÉ qu'elle est un choix du projet. Les deux citations sont
        mot pour mot, aux folios 100 et 108, et aucune page ne donne de seuil chiffré
        (recherche de linéa-, ampleur, seuil, symétri-, proportionn-, additiv- sur tout le
        document) ; les ordres de grandeur d'un point se tirent des folios 102, 110 et
        117 et ne sont pas cités. (2) L'encadré 15 : SCOPE_PROBLEM. « Au centime » était
        faux, six cases s'écartent d'une unité du dernier chiffre imprimé, et aucune
        mise à l'échelle ne les fait tomber juste, le PIB de long terme fixant les poids
        à un pour un ; l'emploi est imprimé en milliers entiers, d'où « dernier chiffre
        imprimé » et non « deux décimales » ; et l'accord à l'arrondi près est ce que
        l'addition des deux tables donnerait aussi, d'où « compatible avec
        l'additivité » et non « la démontre ». Corrections intégrées ci-dessus.

        Passe du 2026-09-03 (wf_8caa3e5e-1e6). Les 48 valeurs et les huit références
        de page ont été relues une à une dans le PDF : AUCUNE erreur de chiffre,
        aucune transposition, aucune colonne empruntée à une voisine, et le piège
        CSG/IR — 0,41 la première année dans les deux cas — est correctement franchi.
        Le verdict porte entièrement sur la portée, et les corrections sont intégrées
        ci-dessus. Les trois plus lourdes : (1) le support « ex ante » était faux pour
        trois lignes sur huit et manquait le facteur 1,18 de la TVA ; (2) les
        variantes sont NON CIBLÉES, alors que le document publie une contrepartie
        ciblée bas salaires à l'encadré 14 — d'où la neuvième variante et le routage
        de `shocks.targets_low_wages` ; (3) les conditions de simulation n'étaient
        nulle part. RESTE OUVERT, non corrigé : la conclusion p141 avertit que ces
        résultats « n'ont cependant pas vocation à être directement transposés à
        l'évaluation des politiques économiques passées », ce qui vise le backtest de
        M4 et non le chiffrage prospectif ; et la phrase d'ancrage de
        `investissement_public` n'est pas unique dans le document — le lecteur n'est
        sauvé que parce qu'il exige toutes ses lignes sur la même page.
    confidence: medium
    note: >
      CONFIANCE ABAISSÉE DE HIGH À MEDIUM, et les horizons longs sont retirés de
      l'usage plutôt que pondérés. L'analyse de sensibilité §4.4 montre que les
      colonnes 1 à 3 ans sont quasi invariantes aux quatre jeux d'hypothèses testés,
      mais que le long terme est entièrement déterminé par un choix de spécification :
      sous courbe de Phillips au lieu de « wage setting », le PIB LT des cotisations
      employeurs tombe de 1,73 à 0,25, un facteur sept. `usable_horizons` s'arrête donc
      à trois ans — ce qui coïncide avec le refus déjà posé par §0 de tout horizon
      au-delà de trois ans, pour une raison indépendante et convergente.

      CONVENTION DE SIGNE, hypothèse et non lecture : les variantes publiées en hausse
      sont retournées pour ramener toutes les lignes à « réponse par point d'impulsion
      expansionniste ». L'ADDITIVITÉ entre instruments est compatible avec le
      document, sans y être démontrée : l'encadré 15 (« TVA sociale », folio 114)
      reproduit la somme des variantes TVA et cotisations employeurs à une unité du
      dernier chiffre imprimé près, non au centime — le PIB s'en écarte de 0,01 à un
      an et à dix ans, la consommation de 0,01 à dix ans, l'emploi d'un millier à deux
      ans, le solde primaire de 0,01 à deux ans, l'IPC de 0,01 à dix ans ; le solde
      commercial tombe juste (D-230) —, ce que l'addition des deux tables donnerait
      aussi, et le document ne dit pas l'avoir simulé à part. Aucune table ne fait
      tourner une variante dans les deux sens. La symétrie reste non mesurée. Elle est
      en outre explicitement déconseillée pour la taxe carbone, dont le choc porte sur
      des VOLUMES d'énergie et dont « le calibrage doit donc être réalisé hors
      modèle ».

  employment_by_instrument:
    value:
      from_source_table: emploi_milliers
      distribution: triangular
      usable_horizons: ["1", "2", "3"]
    applies_to: >
      Emploi salarié marchand, en MILLIERS D'ÉQUIVALENTS TEMPS PLEIN — pas en
      personnes physiques, contrairement à ce que cette ligne affirmait avant
      vérification. Le modèle ne modélise l'emploi qu'en ETP, « de façon à limiter le
      biais de l'évolution du recours au temps partiel sur la productivité par tête »
      (p40), et n'annonce aucune conversion. À NE PAS CONFONDRE avec
      `io_layer.Composition.persons_per_million_eur`, qui compte des PERSONNES parce
      qu'il vient des comptes nationaux : deux unités d'emploi coexistent dans la
      couche macro et ne s'additionnent pas.

      C'est le lien emploi-activité que §2 demandait sous forme « d'Okun », mais PROPRE
      À L'INSTRUMENT : 290 000 emplois à trois ans pour une baisse uniforme de
      cotisations employeurs contre 107 000 pour la dépense publique générique, et
      403 000 pour la même baisse ciblée sur 1-1,6 SMIC.
    responds_to_knobs: [ir_bareme, csg_*, cotisations_*, tva_*]
    support:
      estimated_on: >
        Mêmes variantes, mêmes bases de choc, mêmes réserves que la ligne ci-dessus.
        L'emploi marchand NON SALARIÉ est endogène dans le modèle et n'est pas dans
        cette ligne. L'emploi non marchand est exogène SAUF dans la variante de dépense
        publique, où il bouge : à long terme celle-ci perd 42 000 emplois marchands
        POUR UNE HAUSSE DE L'EMPLOI TOTAL, public compris, DE 26 000 (p107). Rapporter
        le seul chiffre marchand pour cette variante inverse la conclusion.
      max_variation_graded_in_support: 1.0
    verifier:
      verdict: SCOPE_PROBLEM
      date: 2026-09-03
      ref: wf_8caa3e5e-1e6
      note: >
        Valeurs exactes, portée fausse sur trois points, tous corrigés ci-dessus :
        l'unité est l'ÉQUIVALENT TEMPS PLEIN et non la personne ; l'exogénéité de
        l'emploi non marchand ne vaut pas pour la variante de dépense publique, dont le
        signe d'emploi total s'inverse ; et l'affirmation qu'un niveau en milliers « ne
        se met pas à l'échelle comme un multiplicateur » était un non-sequitur que le
        document contredit, la linéarité valant pour les grandeurs en niveau comme pour
        les taux, dans la limite des chocs d'ampleur modérée.
    confidence: medium
    note: >
      Ces chiffres remplacent la loi d'Okun que le cahier des charges demandait, et pas
      par commodité : une élasticité emploi-croissance agrégée appliquerait le même
      contenu en emplois à un allègement ciblé sur le SMIC et à un point de TVA, alors
      que le modèle mesure entre eux un facteur trois à trois ans.

      Horizons longs retirés pour le même motif que la ligne mère, et le cas est ici
      plus net encore : sous courbe de Phillips, l'emploi de long terme tombe à ZÉRO
      pour TOUTES les variantes testées.

  primary_balance_by_instrument:
    value:
      from_source_table: solde_primaire_pts_pib
      absent_for: [cotisations_employeurs_ciblees]
      distribution: triangular
      usable_horizons: ["1", "2", "3"]
    applies_to: >
      Réponse du solde PRIMAIRE des APU, en points de PIB, à un choc permanent d'un
      point de PIB sur l'instrument, dans la même variante que `multiplier_by_instrument`
      et sous les mêmes conditions de simulation. Les folios cités sont les folios
      imprimés, soit la page PDF moins un.

      LA LIGNE CONTIENT LE CHOC LUI-MÊME. Le choc a « un impact ex-post sur le solde
      public différent de son effet ex ante », et « il ne sera pas imposé de contrainte
      d'équilibre budgétaire et on laissera le déficit se creuser » (folio 92) ; les
      mesures sont « étudiées sans financement associé » (note 78, folio 107). Pour
      l'impôt sur le revenu, le solde reste « durablement dégradé » (folio 118). Ce qui
      revient de l'activité est l'écart entre la ligne et le coût ex ante BRUT que la
      chaîne compte : un point pour les cotisations et la CSG (encadré 16, folio 119),
      1,18 pour la TVA, dont les APU versent environ 15 % (folio 112). Calculé par
      `predictif.retroaction`, jamais écrit ici. Recoupement : l'encadré 15 (TVA
      sociale, folio 114) imprime un solde de 0,08, −0,07, 0,01 aux trois premiers
      horizons, la somme des deux lignes à un centime près.

      CE QUE LA LIGNE MESURE : l'effet induit sur le solde primaire, pas la seule
      réponse des recettes. « La quasi intégralité des dépenses et des recettes
      publiques réagit en prix, pour un effet quasi symétrique et donc neutre sur le
      solde public. En volume, seules les recettes et les prestations chômage
      réagissent » (note 70, folio 93), et le tableau 10 fait suivre le PIB aux
      transferts D7-D92-D99. La ligne ne se lit donc que sous un scénario de dépense
      gelée en volume (D-214). Pour la TVA et la taxe carbone, qui relèvent les prix à
      la consommation, la neutralité des prestations indexées sur les prix (folio 99)
      est moins sûre. Les intérêts sont exogènes (tableau 10) : la ligne exclut la
      charge de la dette supplémentaire, que la chaîne porte elle-même.

      PAS D'AUTOFINANCEMENT À LIRE ICI. Le document avertit : « en conclure qu'il serait
      économiquement efficace de supprimer toutes les cotisations patronales puisque la
      mesure serait autofinancée à terme est erroné » (folio 108). Les horizons longs,
      où l'écart dépasse un point pour les cotisations, sont exclus pour le motif de
      `multiplier_by_instrument`.

      VARIANTES LUES : les cotisations salariés et employeurs uniformes, la CSG, l'impôt
      sur le revenu et la TVA. La variante ciblée bas salaires (encadré 14, folio 109)
      n'imprime ni cette ligne ni aucune ligne de prix : elle est déclarée absente
      plutôt qu'empruntée. La taxe carbone imprime la ligne mais en est exclue par le
      calcul : son choc porte sur les volumes d'énergie (folio 120), et son écart
      contient la baisse de l'assiette énergie, qui n'est pas un effet de l'activité.
      Les deux variantes de dépense l'impriment aussi, mais leur choc est en volume
      (folios 102 et 105) et leur coût nominal suit les prix publics.

      MÊME CONVENTION DE SIGNE que la ligne mère : la TVA et la taxe carbone, publiées
      en hausse, sont retournées avec tout leur tableau, ce que la linéarité permet
      (« la linéarité du modèle permet de simuler un scénario réaliste comme une
      combinaison linéaire de chocs analytiques », folio 100). Une hausse de TVA
      améliore bien le solde (folio 113). La symétrie elle-même n'est pas testée par le
      document.
    responds_to_knobs: [ir_bareme, csg_*, cotisations_*, tva_*]
    support:
      estimated_on: >
        Les mêmes variantes que `multiplier_by_instrument`, chocs d'un point de PIB ex
        ante pour les variantes fiscales, effectifs au premier trimestre 2015. La colonne
        « 1 an » est lue comme une moyenne de la première année : le document le dit
        pour le tableau 12 (folio 119), pas pour cette ligne, et la lecture est une
        inférence. Le cadre linéaire est « valable pour des chocs de quelques points de
        PIB » (folio 108).
      max_variation_graded_in_support: 1.0
    verifier:
      verdict: SCOPE_PROBLEM
      date: 2026-10-19
      ref: D-218
      note: >
        Passe adverse du 2026-10-19 sur le PDF, pages rendues en image pour la TVA, la
        taxe carbone et l'encadré 14. TOUTES LES VALEURS sont exactes aux trois
        horizons, retournement compris, et les deux affirmations structurelles tiennent :
        la ligne contient le choc, et son coût net est d'un point pour les six variantes
        fiscales. Le verdict porte sur la portée, et les corrections sont intégrées
        ci-dessus. Les trois qui changent un calcul : (1) contre un coût brut, l'écart
        de la TVA est solde + 1,18 et non solde + 1 ; (2) l'écart de la taxe carbone
        contient la baisse de son assiette, d'où son exclusion ; (3) la note 70 dit que
        les prestations chômage réagissent en volume, et le tableau 10 que des transferts
        suivent le PIB : la ligne est l'effet induit sur le solde, pas la réponse des
        seules recettes. Corrigés aussi : le garde-fou de linéarité « à un point de PIB »
        que le premier jet attribuait à la page 101, qui ne fixe aucun seuil ; la
        citation des variantes de dépense ; l'avertissement du folio 108 ; les styles
        de citation mêlés.
    confidence: medium
    note: >
      Ligne ouverte par D-218 sur la recommandation de D-214, après le refus de D-059.
      Lue par `predictif.retroaction`, qui refuse : une dépense autre que gelée en
      volume, un horizon au-delà de trois ans sans scénario de persistance nommé, et un
      solde de première année hors de ]−1 ; 0[ pour une variante fiscale, ce qui
      trahirait une ligne lue avec le mauvais signe ou sans son choc.

# Lignes retirées : elles apparaissent ici avec leur motif plutôt que d'être
# supprimées — un canal qui rétrécit doit montrer pourquoi.
removed:
  multiplier_slack_state: >
    MORTE SOUS LA FORME DEMANDÉE, REMPLACÉE PAR `multiplier_regime_shift`
    (dispersion.yaml), qui mesure autre chose et le dit : les moyennes par régime de
    Gechert et Rannenberg (2014) servent d'AMPLEUR à un décalage entre deux scénarios
    affichés, jamais de multiplicateur tiré au sort. Le motif d'origine tient pour la
    forme initiale : Mésange est un modèle linéaire sans état conjoncturel, il ne peut
    pas produire un multiplicateur « en bas de cycle », et l'amorce 1,3-2,5 du cahier
    des charges ne vient pas de lui.
  multiplier_confidence_band: >
    MORTE SOUS LA FORME DEMANDÉE, REMPLACÉE PAR `multiplier_dispersion`
    (dispersion.yaml) : la largeur vient de la dispersion inter-études des
    méta-analyses IMK, composée en RELATIF autour du centre français. Mésange ne publie
    pas d'intervalle, et son analyse de sensibilité est à un an quasi invariante — la
    première rédaction de ce paragraphe affirmait « -0,32 partout pour la TVA » avec
    « une seule exception », ce qui est faux à la décimale près : p138 imprime -0,31
    pour la TVA sous courbe de Phillips, soit DEUX écarts à un an et non un. Le fait
    corrigé ne change pas la conclusion, la dispersion à un an restant nulle au
    centième.
  multiplier_impot_societes: >
    Mésange ne publie pas de variante d'impôt sur les sociétés en section 4. Les canaux
    entreprises n'héritent donc PAS du multiplicateur des cotisations employeurs : les
    deux passent par des mécanismes différents dans le modèle — coût du travail contre
    coût du capital — et seul le premier est mesuré.
