# Elasticity of compulsory levies to GDP, and the marginal propensity to consume.
#
# BOTH ROWS ARE DEAD. There is nothing to load in this file.
#
# The elasticity row was authored, sourced from the primary document, and returned
# WRONG by the adversarial pass on five separate counts. It is kept here in full,
# because a row that died is worth more as a record than as a deletion — and because
# one of the five is a violation by the author of the rule this project cares most
# about.

thresholds:
  extrapolation_widening: 2.0

parameters: {}

removed:
  revenue_gdp_elasticity: >
    VERDICT WRONG (passe adversariale du 2026-09-03, lentille « valeurs », réf.
    wf_8caa3e5e-1e6). La ligne déclarait 1,07 avec une bande [0,98 ; 1,16] tirée du
    HCFP, note méthodologique 2023-1. Cinq défauts, dont trois suffisent à la tuer.

    (1) CHIFFRES INVENTÉS DANS LE CHAMP `note`. Il affirmait « 1,5 en 2017 et 2022, 0,4
    en 2023 ». AUCUN de ces chiffres n'existe dans le document. Les seules élasticités
    annuelles publiées sont au tableau 5 p. 14 : 0,84 (2020), 1,15 (2021), 1,48 (2022,
    PLF 2023). Aucune valeur 2023 ne PEUT y figurer, la note étant de février 2023 et
    sa série s'arrêtant en 2021. Ces chiffres venaient d'un résumé de moteur de
    recherche et non du fichier — c'est-à-dire exactement ce que D-026 interdit, commis
    par l'auteur de la ligne dans le fichier même qui proclame la règle. C'est le
    défaut le plus grave des cinq, et le seul qui ne soit pas une question de degré.

    (2) R² LU DANS LA MAUVAISE COLONNE. Le champ `support` attribuait à l'équation (2)
    « R² de 0,88, écart-type de régression 0,89 % ». Le tableau 2 n'imprime le R² que
    pour la colonne (1) ; la cellule de la colonne (2) est VIDE, et la note de lecture
    p. 8 dit que le R² « n'est défini que lorsque l'équation estimée comprend une
    constante ». Le 0,89 % vient bien de (2), le 0,88 vient de (1) : deux colonnes
    mélangées. C'est la même faute que les deux totaux du TES lus dans une seule
    colonne (D-049), commise trois semaines plus tard sur un autre document.

    (3) PORTÉE DE LA BANDE FAUSSE D'UN FACTEUR VINGT. σ = coefficient/t est l'erreur
    d'échantillonnage de la PENTE MOYENNE, soit ±0,087. Ce n'est pas l'incertitude
    d'une prévision de recettes, qui se lit sur le résidu de la même équation :
    écart-type 0,89 % de croissance des PO, soit ±19,7 Md€ contre ±0,96 Md€ pour la
    bande déclarée. La ligne aurait donné un intervalle vingt fois trop étroit à
    l'usage même pour lequel elle était chargée — boucler Δdéficit.

    (4) L'ÉQUATION RETENUE EST CELLE QUE LA NOTE DÉPASSE ENSUITE. Le tableau 3 p. 11,
    équation (4), ajoute la part des salaires privés : PIB 1,05*** (28,46) et masse
    salariale 0,60*** (3,68), l'écart-type tombant de 0,89 % à 0,74 %. La relecture que
    le HCFP fait lui-même (tableau 5 p. 14) applique 1,05 et 0,60, et non 1,07 seul.

    (5) LE REFUS DE CYCLICITÉ ÉTAIT CONTREDIT PAR LA PRATIQUE DE LA SOURCE. La ligne
    retirée ci-dessous soutenait que le HCFP ne trouve pas d'effet de régime
    significatif. Le tableau 4 imprime 0,18** (2,29), significatif à 5 % selon la
    convention d'étoilage de la note, et surtout le tableau 5 p. 14 APPLIQUE la
    correction cyclique dans sa propre relecture : « (1) – 0,92 x (2) – 0,56 x (3) –
    (0,18 x (2)) si (4) > 1,6 % ». Le texte p. 12 dit « à la limite de la
    significativité » et un rejet CONDITIONNEL à l'incertitude sur le seuil, ce qui
    n'est pas « non significatif ».

    CONSÉQUENCE ASSUMÉE : B3 n'a pas de boucle de retour de recettes. Δdéficit se
    limite au mécanique et au comportemental, et le fan ne prétend pas boucler le solde
    public. Une élasticité correcte demanderait la spécification à trois termes du
    tableau 3, avec une bande tirée du résidu et non de l'erreur sur la pente ; c'est
    un travail de sourcing à refaire, pas un chiffre à corriger.
  revenue_elasticity_by_cycle_state: >
    Retirée avec sa ligne mère, et pour un motif qui s'est retourné. Elle affirmait que
    le HCFP teste la dépendance conjoncturelle et ne la trouve significative sous aucune
    forme. C'est faux : le tableau 4 imprime 0,18** (2,29) et le tableau 5 applique le
    terme cyclique dans la relecture que le HCFP fait de ses propres années. Ce qui est
    vrai est plus faible et plus intéressant : la significativité est marginale et
    « pourrait même être rejetée » une fois tenue compte l'incertitude sur le seuil de
    1,6 % lui-même. Ce n'est pas une raison de refuser la cyclicité ; c'est une raison
    de la traiter comme incertaine.
  mpc_by_income_position: >
    RIEN DE FRANÇAIS NE MESURE CET OBJET. §2 demandait une propension marginale à
    consommer par position dans la distribution des revenus, evidence française
    d'abord, sur base HFCS. Les travaux français disponibles — Arrondel, Lamarche et
    Savignac — estiment la propension à consommer LE PATRIMOINE, et la font varier le
    long de la distribution DE PATRIMOINE : environ 0,5 centime par euro de richesse en
    moyenne, 11 centimes pour la richesse financière sous la médiane, zéro pour le
    dernier décile. Ce n'est pas la propension à consommer un supplément de REVENU par
    décile de revenu. Charger l'un pour l'autre reviendrait à additionner deux objets
    différents — exactement le motif du retrait de
    `eti_labour_income_low_earners` en phase 3, et le précédent est contraignant.
    CONSÉQUENCE, PLUS LÉGÈRE QU'IL N'Y PARAISSAIT : B1 n'a besoin d'AUCUNE propension.
    Le multiplicateur de l'impôt sur le revenu de Mésange EST la réponse du PIB à une
    baisse d'impôt sur le revenu ; l'arbitrage consommation-épargne est déjà dedans, et
    l'ajouter en amont le compterait deux fois. Cette ligne ne coûte donc que la
    différenciation par décile, pas le canal.
