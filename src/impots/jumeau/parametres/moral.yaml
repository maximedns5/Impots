# Le moral des gens : la satisfaction dans la vie et les WELLBY (but 29, volet `bienetre`,
# D-595 à D-599). `jumeau/impacts/moral.py` lit ce fichier.
#
# La satisfaction dans la vie se mesure de 0 à 10 (« Sur une échelle de 0 à 10, quelle
# est votre satisfaction concernant la vie que vous menez actuellement ? », SRCV,
# EU-SILC, ONS). Un WELLBY est un point de cette échelle pour une personne pendant un an
# (Green Book). Chaque coefficient a sa source (document, page du PDF, tableau), sa valeur
# centrale et sa bande [bas ; haut] en valeur absolue ; le signe est porté par le canal.
# Aucun chiffrage de tiers des programmes 2027 n'est lu.
#
# Les documents, avec le fichier lu (copie hors git, data/raw/bienetre/) :
#   GB   : HM Treasury, « Wellbeing guidance for appraisal: supplementary Green Book
#          guidance », juillet 2021 (greenbook_wellbeing.pdf, 90 p.)
#   GBF  : HM Treasury, « Wellbeing guidance for appraisal: background paper reviewing
#          methods and approaches », juillet 2021 (greenbook_background.pdf, 44 p.)
#   DMO  : Di Tella, MacCulloch et Oswald, « Preferences over Inflation and Unemployment:
#          Evidence from Surveys of Happiness », American Economic Review 91(1), 2001,
#          p. 335-341 ; version révisée du 7 février 2000 (aerfeb2000.pdf, 16 p.)
#   HH   : Helliwell et Huang, « New Measures of the Costs of Unemployment: Evidence from
#          the Subjective Well-Being of 3.3 Million Americans », NBER WP 16829, révisé en
#          février 2014 (Economic Inquiry 52(4), 2014) (w16829.pdf)

documents:
  GB: "HM Treasury, Wellbeing guidance for appraisal: supplementary Green Book guidance
    (juillet 2021)"
  GBF: "HM Treasury, Wellbeing guidance for appraisal: background paper reviewing methods
    and approaches (juillet 2021)"
  DMO: "Di Tella, MacCulloch et Oswald, Preferences over Inflation and Unemployment,
    American Economic Review 91(1), 2001 (version révisée du 7 février 2000)"
  HH: "Helliwell et Huang, New Measures of the Costs of Unemployment, NBER WP 16829
    (révisé en février 2014 ; Economic Inquiry 52(4), 2014)"

revenu:
  # β : le coefficient du log du revenu du ménage dans une équation de satisfaction 0-10.
  # Une hausse de 1 % du revenu réel fait 0,01 β point.
  centre: 0.425
  bas: 0.35
  haut: 0.50
  document: GBF
  lieu: "p. 19 du PDF : « a coefficient of 0.35-0.50 on ln(income) (LS on a 0-10 scale)
    is the estimate with the most confidence » (Lindqvist et al. 2020, gains de loterie
    suédois, effets de long terme, revenu exogène) ; le centre est le milieu de la plage,
    choisi"
  autres: "p. 18 du PDF : 0,13 (Clark et al. 2018, panel britannique, hors de la bande),
    0,48 (Murtin et al. 2017, Gallup, monde), 0,49 (Brenig et Proeger 2016, Europe) ;
    GB p. 59-61 du PDF : 1,96 (Fujiwara 2021, échelle 1-7 portée à 0-10), le
    coefficient qui fonde la valeur du WELLBY, pas celui de l'effet du revenu sur la
    satisfaction (D-595)"

chomage_propre:
  # δ : ce que perd une personne qui devient chômeuse, en points de satisfaction par an,
  # au-delà de la perte de revenu (le revenu est dans l'équation : GB p. 44 du PDF).
  centre: 0.46
  bas: 0.38
  haut: 0.53
  document: GB
  lieu: "annexe A2, p. 65 du PDF (folio 62), ligne « From employment to unemployment » :
    « Selected values (Clark et al., 2018): UK: -0.46 (95% CI: -0.38 to -0.53) » ; p. 44
    du PDF (encadré 11) : le coefficient s'entend au-delà de la perte de revenu salarial ;
    p. 14 du PDF : pas d'adaptation tant que dure le chômage (Clark et al. 2018)"

chomage_autour:
  # ε : ce que perd chaque adulte, en points de satisfaction par an, quand le taux de
  # chômage monte d'un point (la peur du chômage, l'insécurité de l'emploi), au-delà de
  # son propre statut. DMO l'estime sur une échelle de 1 à 4 ; il est porté sur 0-10 par
  # l'ancrage sur le chômage propre, mesuré dans la même étude (tableau A1 : un chômeur,
  # −0,33 sur la même échelle) : ε = (c / 100) × δ / 0,33, c le coefficient du taux.
  coefficient_dmo:
    centre: 2.0
    bas: 1.7
    haut: 2.8
    lieu: "DMO, tableau 1, p. 14 du PDF : le taux de chômage (en fraction) −2,0 (colonne 2,
      tendances par pays, celle du calcul de la p. 11) ; la bande, les colonnes sur tout
      l'échantillon des tableaux 1 et 2 (p. 14-15) : −1,7 (colonne 6) à −2,8 (colonne 1) ;
      p. 11 : « The second component, which is more akin to higher fear of unemployment
      for everyone in society, is 0.02 »"
  chomeur_dmo:
    valeur: 0.33
    lieu: "DMO, tableau A1, p. 16 du PDF : « Unemployed −0.33 » (MCO, même échelle) ;
      p. 11 : « The loss from being unemployed is equal to 0.33 when measured in the same
      units »"
  # La borne basse de la bande est celle de HH, plus basse que DMO : l'effet fixe (modèle 3)
  # sur l'échelle de Cantril (0-10) des personnes en emploi, 2,4 % du revenu par point de
  # chômage, fois β au centre : 0,024 × 0,425 = 0,0102 point.
  bas_hh:
    equivalent_revenu: 0.024
    lieu: "HH, tableau 2, p. 22 du PDF : « Life ladder, Employed », modèle 3 (effets fixes)
      2,4 % ; modèle 1 (de base) 4,4 %, le résumé (p. 1) : « roughly equivalent to a four
      percent decline in household income » ; p. 36-37 : la sécurité de l'emploi est un
      canal de cet effet"
  document: DMO

inflation:
  # φ : ce que perd chaque adulte quand l'inflation (moyenne mobile sur trois ans, comme
  # DMO) monte d'un point, au-delà de son revenu : φ = (c / 100) × δ / 0,33.
  coefficient_dmo:
    centre: 1.4
    bas: 0.7
    haut: 2.3
    lieu: "DMO, tableau 1, p. 14 du PDF : l'inflation (en fraction) −1,4 (colonne 2) ;
      p. 11 : « 0.014 is the marginal effect of inflation on well-being », le taux marginal
      de substitution de 1,66 ; la bande, les colonnes sur tout l'échantillon des tableaux 1
      et 2 : −0,7 (colonne 6, tableau 2, p. 15) à −2,3 (colonne 5, tableau 1)"
  moyenne_mobile: 3
  document: DMO

insecurite:
  # Pas un canal de plus : l'insécurité de l'emploi passe par le chômage autour de soi
  # (HH p. 36-37 ; DMO p. 11, « fear of unemployment ») ; l'ajouter compterait deux fois.
  # Le coefficient du Green Book est gardé pour mémoire.
  valeur_memoire: 0.230
  document: GB
  lieu: "annexe A2, note 112, p. 66 du PDF : « Job is secure (Very True) +0.230 (0.035) »
    (Clark et al. 2018) ; aucune source ne relie le taux de chômage à la part des emplois
    dits sûrs : non lu"

adultes:
  # La satisfaction est mesurée à partir de 16 ans (SRCV, EU-SILC) ; les cellules portent
  # les personnes, enfants compris. La part des 16 ans ou plus, uniforme entre déciles.
  part: 0.8183
  document: "Eurostat, demo_pjan (population au 1er janvier par âge), France, 2024"
  lieu: "68 669 303 personnes, dont 12 474 259 de moins de 16 ans (âges 0 à 15) ;
    extraction du 17 novembre 2026"

wellby:
  # La valeur d'un WELLBY, une convention : celle du Green Book, en livres de 2019, au
  # cours moyen de 2019 de la BCE.
  livres_2019:
    centre: 13000
    bas: 10000
    haut: 16000
    document: GB
    lieu: "p. 33 du PDF (encadré 7) et p. 57-60 : « multiplying by £13,000 [Low: £10,000,
      High £16,000]. This is the recommended standard value of one wellbeing adjusted
      life year […] in 2019 prices and values »"
  livre_en_euros_2019:
    # 1 € = 0,8777706 £ en moyenne en 2019.
    valeur: 0.8777706
    document: "BCE, série EXR.A.GBP.EUR.SP00.A (cours de référence, moyenne annuelle), 2019"
