hypotheses:
- texte: 'La C3S (0,16 % en 2026) et la CVAE sont supprimées sur le droit de 2026, comme dans
    la mesure de David Lisnard qui supprime ces deux impôts, avec les mêmes plages. La mesure
    n''est chiffrée qu''en partie : le forfait social maintenu à 20 % sur la participation
    légale est le droit de 2026 et ne change rien, mais sa suppression sur l''intéressement,
    la participation supra-légale et l''épargne retraite, une baisse de recette, n''a pas
    de bouton et n''est pas chiffrée ; l''exonération de la part industrielle de la CFE non
    plus. Le coût affiché est celui de la C3S et de la CVAE seules.'
  source: le chiffrage de la mesure (`programmes/retailleau.json`)
