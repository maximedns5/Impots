hypotheses:
- texte: 'Une réduction d''impôt de 50 % des intérêts annuels de l''emprunt de la résidence
    principale avec un enfant mineur à charge, 75 % avec deux, 100 % à partir de trois ; rien
    sans enfant mineur. Plafonnée à 400 € plus 400 € par enfant mineur (le plafond borne la
    réduction, hypothèse de D-383), hors du plafond global des niches. Les intérêts sont ceux
    qu''impute la population aux accédants (18,64 Md€ en 2024, D-383). La durée du prêt et
    une date d''achat ne sont pas lues. Une réduction, non un crédit : elle s''arrête à l''impôt.
    Pas de plage : le candidat dit ses taux et ses plafonds. Contre le droit de 2026.'
  source: le chiffrage de la mesure (`programmes/retailleau.json`)
