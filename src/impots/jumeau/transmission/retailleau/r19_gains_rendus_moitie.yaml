incidence:
- horizon: immediat
  qui: les salariés
  texte: Le net monte ; le brut et le coût du travail ne bougent pas.
  source: 'Saez, Matsaganis et Tsakloglou (2012), « Earnings determination and taxes : evidence
    from a cohort-based payroll tax reform in Greece », QJE 127(1) : à moyen terme, les cotisations
    restent sur celui qui les verse (incidence statutaire)'
- horizon: court
  qui: les régimes de retraite
  texte: La caisse perd sa recette ; sans compensation, le déficit de la branche se creuse.
  source: 'Code de la sécurité sociale, art. L131-7 (loi du 25 juillet 1994) : l''État compense
    à la Sécurité sociale toute exonération ou réduction de cotisations, sauf dérogation d''une
    loi de financement ; Direction de la Sécurité sociale, rapport à la Commission des comptes
    de la Sécurité sociale (2025) : le solde par branche'
- horizon: long
  qui: salariés et employeurs
  texte: 'Le brut peut se renégocier à la baisse : une part du gain du net revient à l''employeur,
    qui voit alors son coût baisser et peut embaucher. Une cotisation de retraite liée à des
    droits se reporte sur le salaire : si les droits sont maintenus, la renégociation est
    plus probable.'
  source: 'Lehmann, Marical et Rioux (2013), « Labor income responds differently to income-tax
    and payroll-tax reforms », Journal of Public Economics 99 (France, DADS) : une baisse
    de cotisations se retrouve en partie dans le salaire, lentement ; Bozio, Breda et Grenet
    (2019), « Does tax-benefit linkage matter for the incidence of social security contributions
    ? », IZA DP 12502 (France) : une cotisation liée à des droits se reporte sur le salaire,
    une cotisation sans lien reste sur l''employeur ; Fullerton et Metcalf (2002), « Tax incidence
    », Handbook of Public Economics, vol. 4, ch. 26 : à long terme, l''incidence ne dépend
    pas de qui verse l''impôt, mais des élasticités de l''offre et de la demande'
