hypotheses:
- texte: 'Une prestation neuve (D-382), individuelle : 300 € par mois, plus 250 € à qui travaille
    ou cherche un emploi, moins 30 % des revenus d''activité nets, nulle au-delà de 1 833
    € de revenus d''activité par mois, de 18 ans à la veille de 65, à la place du RSA, de
    la prime d''activité et de l''ASS (que la population ne porte pas). Hypothèses : l''insertion
    va à qui touche une allocation chômage ou se déclare chômeur, la population ne portant
    pas les quinze heures ; les revenus de remplacement (chômage, pension) sont déduits à
    100 %, la règle des minima remplacés, la plage allant de 30 % (le taux du salaire) à 100
    %. Servi en espérance avec la loi de recours du RSA. Les aides au logement restent, sans
    le RIA dans leurs ressources. La situation régulière n''est pas lue. Contre le droit de
    2026.'
  source: le chiffrage de la mesure (`programmes/retailleau.json`)
