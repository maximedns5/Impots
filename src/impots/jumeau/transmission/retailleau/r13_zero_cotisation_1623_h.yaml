hypotheses:
- texte: '« Toutes les cotisations sociales au-delà de 1 623 heures par an » : les heures
    supplémentaires imputées (D-383) comptent depuis la durée légale, 1 607 h ; les 16 premières
    de l''année restent soumises (une franchise), la plage descend à 0 pour la lecture de
    Public Sénat (« au-delà de 1 607 heures »). Les cotisations salariales que la loi laisse
    au-delà de sa réduction, et les patronales nettes des allègements, dans le privé ; la
    CSG et la CRDS sont maintenues, comme l''exonération d''impôt. Pas de plafond d''heures.
    La déduction forfaitaire patronale des petites entreprises n''est pas portée. Seules les
    heures déjà faites ; l''annualisation (r14) n''est pas lue. Contre le droit de 2026.'
