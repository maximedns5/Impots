incidence:
- horizon: immediat
  qui: le payeur légal
  texte: Le premier effet est sur celui que la loi désigne.
  source: 'Fullerton et Metcalf (2002), « Tax incidence », Handbook of Public Economics, vol.
    4, ch. 26 : à long terme, l''incidence ne dépend pas de qui verse l''impôt, mais des élasticités
    de l''offre et de la demande'
- horizon: court
  qui: les salariés
  texte: Le net bouge, le brut et le coût du travail non.
  source: 'Saez, Matsaganis et Tsakloglou (2012), « Earnings determination and taxes : evidence
    from a cohort-based payroll tax reform in Greece », QJE 127(1) : à moyen terme, les cotisations
    restent sur celui qui les verse (incidence statutaire)'
- horizon: long
  qui: salariés et employeurs
  texte: 'Le brut peut se renégocier : une part de la baisse revient à l''employeur.'
  source: 'Lehmann, Marical et Rioux (2013), « Labor income responds differently to income-tax
    and payroll-tax reforms », Journal of Public Economics 99 (France, DADS) : une baisse
    de cotisations se retrouve en partie dans le salaire, lentement'
