hypotheses:
- texte: 'Une prestation neuve (D-382) : 240 € par mois pour chaque enfant de moins de 18
    ans dès le premier, 480 € pour le troisième. Des douze dispositifs que le document du
    28 avril 2026 dit remplacer, le moteur en porte cinq ; quatre sont retirés : les allocations
    familiales (et leur majoration pour âge), le complément familial, l''allocation de rentrée
    scolaire, les parts du quotient familial des enfants (0 au lieu d''une demi-part, d''une
    part au troisième). La réduction d''impôt pour frais de scolarité reste : la population
    ne déclare pas ses cases, et son retrait serait un zéro sans assiette (D-390). Le supplément
    familial de traitement, les bourses et la prise en compte des enfants dans le RSA et la
    prime d''activité ne sont pas lus ; la PAJE, l''ASF, les aides au logement et l''AEEH
    restent, comme le dit le document. Les parts des enfants majeurs rattachés tombent avec
    celles des mineurs ; la demi-part du parent isolé reste. La condition de cinq ans de résidence
    et d''activité n''est pas lue. Recours plein, comme les allocations familiales. Pas de
    plage : le candidat dit ses montants. Contre le droit de 2026.'
  source: le chiffrage de la mesure (`programmes/retailleau.json`)
