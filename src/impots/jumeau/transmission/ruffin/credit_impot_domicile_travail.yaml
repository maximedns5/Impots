hypotheses:
- texte: 'Un crédit d''impôt de 30 % des frais de trajet domicile-travail de chaque salarié
    (« autour de 30 % », plage de 25 à 35 %), sur les frais qu''impute la population (D-383),
    sans franchise ni plafond ni condition de revenu : les « gros rouleurs aux revenus moyens
    » ne sont pas définis. La remise à plat des frais kilométriques et des avantages en nature
    des véhicules n''est pas lue ; les frais réels déclarés restent. Contre le droit de 2026.'
