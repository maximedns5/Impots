incidence:
- horizon: immediat
  qui: les entreprises
  texte: La marge après impôt bouge.
  source: 'Fullerton et Metcalf (2002), « Tax incidence », Handbook of Public Economics, vol.
    4, ch. 26 : à long terme, l''incidence ne dépend pas de qui verse l''impôt, mais des élasticités
    de l''offre et de la demande'
- horizon: long
  qui: salariés, clients, actionnaires
  texte: Un impôt sur les bénéfices retombe pour partie sur les salaires ; un impôt sur le
    chiffre d'affaires, en cascade, sur les prix.
  source: 'Fuest, Peichl et Siegloch (2018), « Do higher corporate taxes reduce wages ? »,
    American Economic Review 108(2) : environ la moitié de l''impôt local sur les bénéfices
    retombe sur les salaires (Allemagne) ; Martin et Trannoy (2019), « Les impôts sur (ou
    contre) la production », Note du CAE n° 53 : les impôts sur le chiffre d''affaires et
    la valeur ajoutée se reportent en cascade sur les prix et pèsent sur la compétitivité'
financement:
  annonce: « Une partie de cette œuvre de justice fiscale devra être orientée vers la réduction
    de notre déficit »
  source: Mélenchon, « Comment nous allons remettre de l'ordre dans les comptes publics »,
    p. 6
  chiffre: true
  note: une recette du programme ; son bilan (p. 14) en affecte 81,7 Md€ aux dépenses et 24,7
    Md€ au déficit, sans dire laquelle va où
