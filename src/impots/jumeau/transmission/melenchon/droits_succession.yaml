- texte: Le montant de la première année est tenu ensuite ; le candidat le dit de la première
    année seulement.
  source: non sourcée
- texte: Le montant entre en 2027, par la loi de finances pour 2027 que le document décrit.
  source: 'Mélenchon, « Comment nous allons remettre de l''ordre dans les comptes publics
    », p. 6 : « Cette loi de finances, si elle était adoptée pour 2027, permettrait un ajustement
    de 25 milliards d''euros l''année prochaine »'
- texte: Le montant annoncé se réalise en entier (ρ = 1, D-319).
  source: non sourcée
- texte: 'Aucune variante de Mésange pour cet impôt : le mode réduit ne lit aucun effet sur
    l''activité, seulement la recette.'
  source: 'Insee et DG Trésor, « Le modèle macroéconométrique Mésange : réestimation et nouveautés
    », document de travail G2017-04, §4 (les variantes publiées)'
