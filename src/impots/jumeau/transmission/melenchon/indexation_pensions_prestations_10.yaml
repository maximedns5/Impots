hypotheses:
- texte: 'La mesure se mesure contre l''indexation légale sur les prix, la référence du but
    21 : l''indexation qu''elle promet est celle du droit, et ne coûte rien ; la hausse de
    10 % est la mesure. Trois coefficients de 1,10 sur ce que le droit porte : les pensions
    de retraite de la population (des données, multipliées au 1er janvier), la base mensuelle
    des allocations familiales (au 1er avril) et les paramètres des aides au logement révisés
    en octobre. Ils sont posés à la date légale de 2025 pour que toute l''année chiffrée porte
    la hausse, comme les boutons « portée » (D-301). Le candidat dit « allocations familiales
    » : la base mensuelle porte aussi le complément familial, l''allocation de soutien familial,
    l''allocation de rentrée scolaire et l''allocation de base de la PAJE, qui montent avec
    elles ; c''est la traduction qui ne choisit pas entre les prestations familiales. Les
    pensions d''invalidité et les autres prestations ne bougent pas. Plages : du droit (1)
    à 10 % prolongé de la moitié de l''écart (1,15).'
  source: le chiffrage de la mesure (`programmes/melenchon.json`)
- texte: Le candidat annonce 8 Md€ ; le rapport chiffre 31,97 Md€ la première année, une revalorisation
    de 10 % de toutes les pensions et des prestations nommées au-dessus du droit de 2026.
    Le candidat ne dit pas si ses 8 Md€ s'entendent au-delà de l'indexation sur l'inflation
    ; l'écart n'est pas résolu ici.
  source: 'le rapport de la mesure ; Mélenchon, document du 14 octobre 2026, p. 10 : « toutes
    les pensions, allocations familiales et APL, qui seront rehaussées de 10 % (8 milliards
    d''euros) »'
