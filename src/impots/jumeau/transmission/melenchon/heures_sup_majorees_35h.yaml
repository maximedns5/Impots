  texte: 'Code du travail, art. L3121-27 (la durée légale de 35 heures), L3121-33 et L3121-36
    (la majoration des heures supplémentaires, 25 % puis 50 %, réductible à 10 % par accord)
    : la majoration rendue impérative'
