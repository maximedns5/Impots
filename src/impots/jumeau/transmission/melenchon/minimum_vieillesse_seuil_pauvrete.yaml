montant:
  origine: hypothese
  annonce:
    montant_md: 2.66
    sens: depense
    horizon: ASPA = seuil de pauvreté (1 337 € par mois selon le programme)
    citation: « Porter, a minima, toutes les pensions pour une carrière complète (salarié,
      indépendant, agriculteur) au niveau du SMIC revalorisé, et le minimum vieillesse au
      niveau du seuil de pauvreté »
    url: https://melenchon2027.fr/programme/livre/mettre-en-securite-sociale/chapitre1
    par: calcul
    calcul: '754 500 allocataires du minimum vieillesse fin 2024 (Drees) × (1 337 € − 1 043,59
      €, le plafond de l''ASPA d''une personne seule en 2026) × 12 mois = 2,66 Md€ par an.
      L''ASPA est différentielle : chaque allocataire reçoit l''écart des plafonds. Les couples
      (plafond de 1 620,18 €) et les nouveaux entrants ne sont pas comptés ; à la dépense
      de 2026 (4,353 Md€, CCSS) relevée de 28,1 %, il en coûterait 1,22 Md€, une borne basse.'
