hypotheses:
- texte: 'Une prestation neuve (D-382) : chaque jeune reçoit la différence entre 1 337 € par
    mois et ses ressources propres du mois (salaire, revenu d''indépendant, chômage, pension),
    sans les ressources de ses parents ni les prestations de sa famille. Le candidat dit «
    les jeunes » sans âge : de 18 ans à la veille de 25, l''âge sous lequel le RSA est fermé,
    est une hypothèse ; la plage de l''âge de sortie va de 21 (la fin des prestations familiales)
    à 30 ans. Le programme du 6 novembre la réserve aux jeunes « détachés du foyer fiscal
    parental » : la population ne dit pas le rattachement, et la garantie va à tous les jeunes
    de la tranche, ce qui la surestime. Servie en espérance avec la loi de recours du RSA
    (D-382). Elle ne remplace rien et n''entre dans aucune base de ressources. Contre le droit
    de 2026, où elle n''existe pas.'
  source: le chiffrage de la mesure (`programmes/melenchon.json`)
- texte: Le candidat annonce 9,5 Md€ ; le rapport chiffre 35,65 Md€ versés (51,92 Md€ de droits)
    la première année. L'écart tient à la définition du jeune et du revenu pris en compte,
    que le candidat ne donne pas.
  source: le rapport de la mesure ; Mélenchon, document du 14 octobre 2026, p. 10
- texte: L'État verse la garantie.
