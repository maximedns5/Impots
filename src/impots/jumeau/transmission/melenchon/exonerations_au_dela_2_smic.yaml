  scenario: pres2027_melenchon_exonerations_au_dela_2_smic
  rapport: reports/etudes/presidentielle_melenchon/mesures/exonerations_au_dela_2_smic/predictif_pres2027_melenchon_exonerations_au_dela_2_smic.json
  premiere_annee:
