schema: 1
mesure: exonerations_au_dela_2_smic
candidat: melenchon
libelle: Fin des exonérations de cotisations au-dessus de 2 SMIC
sorte: chiffree
source:
  citation: « Aussi proposons-nous d'interrompre cette subvention au-dessus de 2 SMIC, où
    les exonérations ne sont plus qu'un effet d'aubaine sans aucun effet sur l'emploi. »
  url: https://melenchon2027.fr/wp-content/uploads/2026/10/Comment-nous-allons-remettre-de-l-ordre-dans-les-comptes-publics.pdf
  date: '2026-10-14'
levier:
  texte: 'Code de la sécurité sociale, art. L241-13 (la réduction générale des cotisations
    patronales) et art. L241-2-1 et L241-6-1 (les taux réduits maladie et famille) : le plafond
    des allègements ramené à 2 Smic'
  parametre: allegement_general_plafond
  valeur:
    allegement_general_plafond: 2.0
  enonce: 'seuil : 2 SMIC'
  couche: menages
payeurs:
- qui: entreprises
  sens: paie
  par: cotisations_employeurs
  note: +6,33 Md€ de coût du travail au-dessus de 2 Smic (rapport, 2026, figé)
- qui: apu:etat
  sens: recoit
  par: cotisations_employeurs
  note: moins de compensation des allègements à la Sécurité sociale (art. L131-7 CSS)
incidence:
- horizon: court
  qui: les employeurs
  texte: Le coût du travail monte au-dessus de 2 Smic.
  source: 'Saez, Schoefer et Seim (2019), « Payroll taxes, firm behavior, and rent sharing
    », American Economic Review 109(5) (Suède) : une baisse de cotisations patronales ne passe
    pas dans les salaires ; elle passe dans l''emploi et l''investissement'
- horizon: long
  qui: salariés et employeurs
  texte: Une part peut passer dans les salaires.
  source: 'Lehmann, Marical et Rioux (2013), « Labor income responds differently to income-tax
    and payroll-tax reforms », Journal of Public Economics 99 (France, DADS) : une baisse
    de cotisations se retrouve en partie dans le salaire, lentement ; Bozio, Breda et Grenet
    (2019), « Does tax-benefit linkage matter for the incidence of social security contributions
    ? », IZA DP 12502 (France) : une cotisation liée à des droits se reporte sur le salaire,
    une cotisation sans lien reste sur l''employeur'
financement:
  annonce: « Une partie de cette œuvre de justice fiscale devra être orientée vers la réduction
    de notre déficit »
  source: Mélenchon, « Comment nous allons remettre de l'ordre dans les comptes publics »,
    p. 6
  chiffre: true
  note: une recette du programme ; son bilan (p. 14) en affecte 81,7 Md€ aux dépenses et 24,7
    Md€ au déficit, sans dire laquelle va où
canaux:
- emploi
- salaires
- cout_travail_tranche
- incidence_cotisations
- compensation_exonerations
- financement_sous_secteurs
hypotheses:
- texte: 'Sur le droit de 2026, les taux réduits de cotisations maladie et famille (les «
    bandeaux ») ont disparu, fondus dans la réduction générale des cotisations patronales,
    qui est la seule exonération générale ; son seuil de sortie, 3 SMIC (le paramètre allegement_general_plafond),
    est ramené à 2 SMIC. Le candidat ne dit rien de la courbe sous 2 SMIC : elle reste celle
    de 2026, et la réduction s''arrête net à 2 SMIC, ce que dit « interrompre ». Plage : de
    3 SMIC (le droit de 2026) à 1,5 SMIC (2 SMIC prolongé de la moitié de l''écart).'
  source: le chiffrage de la mesure (`programmes/melenchon.json`)
- texte: 'Le candidat ne chiffre pas cette mesure : le total de ses recettes (106,4 Md€, p.
    14) est la somme exacte de ses quatorze recettes chiffrées, sans elle. Elle peut aussi
    être comprise dans les 22 Md€ des niches sociales ; le document ne le dit pas.'
  source: 'Mélenchon, document du 14 octobre 2026, p. 13-14 (somme : 9 + 10 + 22 + 3 + 15
    + 20 + 3 + 5 + 3,9 + 5 + 5 + 2,5 + 1 + 2 = 106,4)'
montant:
