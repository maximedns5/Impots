    source: reports/etudes/presidentielle_melenchon/mesures/exonerations_au_dela_2_smic/premiere_annee_pres2027_melenchon_exonerations_au_dela_2_smic.json
    ecarts_md:
      salaire_super_brut: 6.33
      allegement_general: -6.33
assiette:
  texte: le coût des allègements généraux de cotisations en 2025 (le montant que le candidat
    cite aussi)
  montant_md: 75.6
  annee: 2025
  source: Commission des comptes de la Sécurité sociale, mai 2026, §1.6 « Les dispositifs
    d'exonération en faveur de l'emploi »
calendrier:
