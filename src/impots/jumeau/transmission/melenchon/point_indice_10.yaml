hypotheses:
- texte: 'La valeur du point d''indice relevée de 10 %. Plage du point : du droit de 2026
    (1, le point gelé) à 10 % prolongé de la moitié de l''écart (1,15). Le bouton multiplie
    le traitement indiciaire des fonctionnaires titulaires, leur brut sur 1,195 (le taux de
    prime du moteur) ; leurs primes ne bougent pas. La part du salaire des contractuels qui
    suit le point n''est pas publiée : 0 pour la valeur retenue, la plage allant jusqu''à
    1 (tous payés sur une grille indiciaire). La mesure se mesure contre le droit de 2026,
    où le point est gelé depuis le 1er janvier 2024 : il n''a pas d''indexation légale. Le
    coût compte le salaire que paient l''État, les collectivités et les hôpitaux, moins les
    cotisations, la CSG et l''impôt qui en reviennent ; les collectivités sont comptées comme
    l''État, leur compensation éventuelle ne change pas le coût public.'
  source: le chiffrage de la mesure (`programmes/melenchon.json`)
- texte: Le candidat annonce 17 Md€ ; le rapport chiffre 11,09 Md€ de coût net la première
    année (le brut +16,67 Md€, les cotisations des employeurs publics et la pension des fonctionnaires
    de l'État en plus, moins ce qui revient en cotisations, CSG et IR). Le candidat ne dit
    pas si son montant est brut ou net.
  source: le rapport de la mesure (`premiere_annee_pres2027_melenchon_point_indice_10.json`)
    ; Mélenchon, document du 14 octobre 2026, p. 10
- texte: 'Les primes ne suivent pas le point ; les contractuels non plus (part du salaire
    indexée sur le point : 0 retenu, non publiée).'
  source: le chiffrage de la mesure (`programmes/melenchon.json`, plages)
