hypotheses:
- texte: 'Le SMIC mensuel porté à 1 700 € nets, « immédiatement ». Le bouton est un coefficient
    sur le SMIC horaire brut de chaque mois de 2026, qui en porte deux : 12,02 € de janvier
    à mai (1 823,03 € bruts par mois), 12,31 € de juin à décembre (1 867,02 €), 1 848,69 €
    en moyenne. Le coefficient retenu, 1,1617, donne 1 700 € nets par mois en moyenne sur
    l''année ; la plage va de 1,1503 (1 700 € nets atteints depuis le SMIC de juin) à 1,178
    (depuis celui de janvier). Le net est le brut moins les prélèvements salariaux d''un non-cadre
    sous le plafond (vieillesse 7,30 %, Agirc-Arrco et CEG 4,01 %, CSG et CRDS 9,70 % sur
    98,25 % du brut), soit 79,16 % du brut, sans mutuelle ni prévoyance. La diffusion au-dessus
    du nouveau SMIC, entre 1 et 1,5 SMIC dans le privé, est une hypothèse déclarée (D-380)
    : le profil à un an avec effets fixes d''entreprise de Koubi et Lhommeau (Insee, Les salaires
    en France 2007), le plus large des quatre publiés, à l''échelle 0 pour la valeur du candidat
    (le premier jour, la loi seule relève les salaires horaires sous le nouveau SMIC), sa
    plage allant jusqu''à 1 (le profil entier). La mesure se mesure contre le SMIC de l''arbre
    de 2026. Le coût ne compte pas le salaire que paie un employeur privé ; il compte celui
    que paie l''État employeur (les agents publics relevés au SMIC), les cotisations, la CSG
    et l''impôt qui montent, la prime d''activité qui bouge, et les allègements généraux,
    qui suivent le SMIC : un SMIC relevé les élargit aussi pour les salaires qui ne bougent
    pas.'
  source: le chiffrage de la mesure (`programmes/melenchon.json`)
- texte: Le chiffrage relève le Smic de 16,17 % (le Smic de la population de 2024) ; au Smic
    de juin 2026, 1 700 € net en font +15,0 %.
  source: le chiffrage de la mesure ; service-public.gouv.fr, fiche F2300
- texte: 'Les allègements généraux suivent le Smic : +35,34 Md€ d''allègements dans la passe
    de la première année, que l''État compense à la Sécurité sociale.'
  source: le rapport de la mesure ; Code de la sécurité sociale, art. L131-7
- texte: Pas de diffusion aux salaires voisins dans le chiffrage (`smic_diffusion_echelle`
    à 0) ; le bloc `travail` du jumeau la porte.
  source: le chiffrage de la mesure (`programmes/melenchon.json`) ; D-469, D-478
