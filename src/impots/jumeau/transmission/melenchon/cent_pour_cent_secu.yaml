    calcul: 'Les organismes complémentaires financent 12,8 % de la consommation de soins et
      de biens médicaux, 33 Md€ en 2024 (Drees, comptes de la santé, édition 2025) ; leur
      intégration à la Sécurité sociale transfère au moins ces 33 Md€ à la dépense publique.
