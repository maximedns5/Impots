canaux:
- patrimoine_menages
- consommation_menages
hypotheses:
- texte: 'Le prélèvement forfaitaire unique supprimé : chaque foyer est imposé comme s''il
    cochait la case 2OP, ses revenus du capital au barème de l''impôt sur le revenu (abattement
    de 40 % sur les dividendes, CSG déductible). Les prélèvements sociaux ne changent pas
    ; « imposer les revenus du capital comme ceux du travail » ne dit pas d''autre taux. Le
    capital est celui qu''impute la population (D-248) : ni l''assurance vie, ni les plus-values
    d''avant 2018. Contre le droit de 2026. Pas de plage : la mesure est un oui ou un non.'
  source: le chiffrage de la mesure (`programmes/melenchon.json`)
