incidence:
- horizon: immediat
  qui: les détenteurs du patrimoine
  texte: Statutaire.
  source: 'Fullerton et Metcalf (2002), « Tax incidence », Handbook of Public Economics, vol.
    4, ch. 26 : à long terme, l''incidence ne dépend pas de qui verse l''impôt, mais des élasticités
    de l''offre et de la demande'
- horizon: long
  qui: les détenteurs du patrimoine
  texte: L'assiette répond (épargne, transmission, localisation).
  source: 'Jakobsen, Jakobsen, Kleven et Zucman (2020), « Wealth taxation and wealth accumulation
    », QJE 135(1) (Danemark) : l''assiette répond à l''impôt sur la fortune, d''autant plus
    en haut de la distribution'
financement:
