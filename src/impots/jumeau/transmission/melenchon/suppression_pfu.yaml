schema: 1
mesure: suppression_pfu
candidat: melenchon
libelle: Suppression du PFU (« flat tax »)
sorte: chiffree
source:
  citation: « suppression de la flat tax pour que le capital ne soit pas moins imposé que
    le travail (9 milliards d'euros) »
  url: https://melenchon2027.fr/wp-content/uploads/2026/10/Comment-nous-allons-remettre-de-l-ordre-dans-les-comptes-publics.pdf
  date: '2026-10-14'
levier:
  texte: 'Code général des impôts, art. 200 A (le prélèvement forfaitaire unique de 12,8 %
    sur les revenus du capital) : supprimé, ces revenus vont au barème (art. 197)'
  parametre: pfu_supprime
  valeur:
    pfu_supprime: true
  enonce: suppression
  couche: menages
payeurs:
- qui: menages
  sens: paie
  par: ir
  note: '+13,89 Md€ d''IR la première année (rapport, 2026, figé) : les ménages qui ont des
    revenus du capital'
- qui: apu:etat
  sens: recoit
  par: impot_sur_le_revenu
incidence:
- horizon: immediat
  qui: les détenteurs du patrimoine
  texte: Statutaire.
  source: 'Fullerton et Metcalf (2002), « Tax incidence », Handbook of Public Economics, vol.
    4, ch. 26 : à long terme, l''incidence ne dépend pas de qui verse l''impôt, mais des élasticités
    de l''offre et de la demande'
- horizon: long
  qui: les détenteurs du patrimoine
  texte: L'assiette répond (épargne, transmission, localisation).
  source: 'Jakobsen, Jakobsen, Kleven et Zucman (2020), « Wealth taxation and wealth accumulation
    », QJE 135(1) (Danemark) : l''assiette répond à l''impôt sur la fortune, d''autant plus
    en haut de la distribution'
financement:
  annonce: « Une partie de cette œuvre de justice fiscale devra être orientée vers la réduction
    de notre déficit »
  source: Mélenchon, « Comment nous allons remettre de l'ordre dans les comptes publics »,
    p. 6
  chiffre: true
  note: une recette du programme ; son bilan (p. 14) en affecte 81,7 Md€ aux dépenses et 24,7
    Md€ au déficit, sans dire laquelle va où
canaux:
- patrimoine_menages
- consommation_menages
hypotheses:
- texte: 'Le prélèvement forfaitaire unique supprimé : chaque foyer est imposé comme s''il
    cochait la case 2OP, ses revenus du capital au barème de l''impôt sur le revenu (abattement
    de 40 % sur les dividendes, CSG déductible). Les prélèvements sociaux ne changent pas
    ; « imposer les revenus du capital comme ceux du travail » ne dit pas d''autre taux. Le
    capital est celui qu''impute la population (D-248) : ni l''assurance vie, ni les plus-values
    d''avant 2018. Contre le droit de 2026. Pas de plage : la mesure est un oui ou un non.'
  source: le chiffrage de la mesure (`programmes/melenchon.json`)
- texte: Le candidat annonce 9 Md€ ; le rapport chiffre 13,79 Md€ de recette la première année,
    sans réponse des dividendes versés.
  source: le rapport de la mesure ; Mélenchon, document du 14 octobre 2026, p. 13
montant:
  origine: rapport
  scenario: pres2027_melenchon_suppression_pfu
  rapport: reports/etudes/presidentielle_melenchon/mesures/suppression_pfu/predictif_pres2027_melenchon_suppression_pfu.json
  annonce_md: 9.0
  premiere_annee:
    annee: 2026
    source: reports/etudes/presidentielle_melenchon/mesures/suppression_pfu/premiere_annee_pres2027_melenchon_suppression_pfu.json
    ecarts_md:
      ir: 13.89
      revenu_disponible: -13.79
assiette:
  texte: les recettes de PFO et de PFU (l'acompte de 12,8 % sur les dividendes et intérêts),
    dans l'impôt sur le revenu net
  montant_md: 8.1
  annee: 2026
  source: 'Annexe au PLF 2026, Évaluation des voies et moyens, tome 1, impôt sur le revenu,
    tableau de composition (ligne « PFO/PFU » : 7,5 ; 8,0 ; 8,1 Md€ en 2024, 2025, 2026)'
calendrier:
  texte: dès 2027, par la loi de finances pour 2027
  source: Mélenchon, « Comment nous allons remettre de l'ordre dans les comptes publics »,
    p. 6
