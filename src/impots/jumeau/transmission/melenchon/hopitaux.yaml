hypotheses:
- texte: 'Les 3 Md€ se partagent comme les charges des hôpitaux publics : 64 % de rémunérations
    (D1, 63,3 sur 99,4 Md€ en 2024), 36 % de consommations (P2).'
  source: Drees, « Les établissements de santé », édition 2026, fiche 25
- texte: '10 000 postes au salaire net moyen de l''hôpital (2 980 € par mois en EQTP, 2024)
    font 0,36 Md€ de salaires nets : les postes ne sont qu''une part des 3 Md€.'
  source: Insee, Siasp 2024, « Emploi, chômage, revenus du travail », édition 2026, fiche
    29, figure 1
- texte: Le montant entre en 2027, par la loi de finances pour 2027 que le document décrit.
  source: 'Mélenchon, « Comment nous allons remettre de l''ordre dans les comptes publics
    », p. 6 : « Cette loi de finances, si elle était adoptée pour 2027, permettrait un ajustement
    de 25 milliards d''euros l''année prochaine »'
- texte: Le montant de la première année est tenu chaque année de 2027 à 2035, en euros courants
    ; le candidat ne donne qu'un montant annuel, sans trajectoire.
  source: non sourcée
- texte: Le montant annoncé se réalise en entier (ρ = 1, D-319).
  source: non sourcée
- texte: 'La variante de Mésange la plus proche : depense_publique (la composition moyenne
    de la dépense publique, G2017-04, p. 106), faute de savoir quelle dépense.'
  source: non sourcée
