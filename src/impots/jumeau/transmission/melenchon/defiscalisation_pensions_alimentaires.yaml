hypotheses:
- texte: '« Défiscaliser les pensions alimentaires », sans plafond ni condition. Les pensions
    alimentaires perçues (1AO à 1DO) sortent du revenu imposable du parent qui les reçoit,
    entières : le bouton de l''étape 4 (D-383), sans plafond par enfant. Les pensions sont
    celles qu''impute la population, perçues par les parents isolés pour leurs enfants (5,55
    Md€ en 2024, vieillies par les prix) : celles que reçoit un parent en couple ou un ex-conjoint
    pour lui-même ne sont pas portées. Les prestations qui comptent la pension ne bougent
    pas. Contre le droit de 2026. Pas de plage : la mesure est un oui ou un non.'
  source: le chiffrage de la mesure (`programmes/melenchon.json`)
