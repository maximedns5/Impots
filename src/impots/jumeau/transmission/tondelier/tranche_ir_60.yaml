hypotheses:
- texte: 'Barème de 2026 et une 6e tranche à 60 % au-delà de 250 000 €. Le seuil s''applique
    au revenu par part, comme tous les seuils du barème, et c''est ce que fait la réforme
    : pour un couple, qui a deux parts, la tranche à 60 % commence au-delà de 500 000 € de
    revenu imposable. Le candidat ne dit pas s''il l''entend par foyer. La plage va du taux
    de la tranche supérieure actuelle, 45 % (la mesure retirée), à 67,5 %.'
  source: le chiffrage de la mesure (`programmes/tondelier.json`)
