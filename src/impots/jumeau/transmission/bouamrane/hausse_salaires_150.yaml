  texte: Code du travail, Smic (art. L3231-1 et s.) ; point d'indice (décret n° 85-1148)
  parametre: smic_revalorisation, smic_diffusion_profil, smic_diffusion_echelle
  valeur:
    smic_revalorisation: 1.0811
    smic_diffusion_profil: annee_avec_effets_fixes
