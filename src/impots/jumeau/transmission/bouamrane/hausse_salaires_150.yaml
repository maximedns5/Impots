  citation: « On parle de 100 ou 200 euros d'augmentation, de 150 euros très exactement. J'ai
    envie de dire que c'est le minimum syndical. »
  url: https://www.sudradio.fr/linvite-politique/karim-bouamrane-il-faut-arreter-de-regarder-melenchon-comme-le-superman-de-la-gauche
  date: '2026-11-09'
