hypotheses: []
montant:
  origine: aucun
  manque: 'Un écart cible entre travail et inactivité n''est pas un paramètre : il faudrait
    l''allocation unique qui le produirait, que le moteur ne porte pas. (porte « prestations_hors_modele
    »)'
