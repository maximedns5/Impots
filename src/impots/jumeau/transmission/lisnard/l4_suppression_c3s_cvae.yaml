hypotheses:
- texte: 'La C3S est supprimée (taux de 0,16 % en 2026 ramené à 0) et la CVAE aussi, sur le
    droit de 2026. Le candidat ne supprime la CVAE que « le cas échéant » : le choix retenu
    suit son chiffrage de 11,5 Md€, qui compte les deux impôts, et la plage de cvae_echelle
    couvre son maintien (1). La plage de la C3S va du droit de 2026 à 0, la borne du schéma.
    L''objectif d''impôts de production ramenés de 2 % à 1 % du PIB va au-delà de ces deux
    impôts (c''est la mesure « Baisse des impôts de production, à commencer par la C3S »)
    et n''est pas chiffré ici.'
