hypotheses:
- texte: 'Le candidat ne dit pas comment répartir la baisse de 2,6 points entre la part déductible
    (6,8 %) et la part imposable (2,4 %). Le choix retenu est la répartition proportionnelle,
    qui garde à chaque part son poids dans le taux : 4,88 % et 1,72 %, soit 6,6 %. Chaque
    plage va du droit de 2026 à la valeur retenue prolongée de la moitié de l''écart ; celle
    de la part imposable descend jusqu''à 0 pour couvrir l''autre répartition extrême (6,6
    % et 0 %), et celle de la part déductible contient la baisse portée sur elle seule (4,2
    % et 2,4 %). La CSG des revenus de remplacement et du capital n''est pas touchée.'
  source: le chiffrage de la mesure (`programmes/lisnard.json`)
