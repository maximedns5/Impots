hypotheses:
- texte: 'Les salaires des moins de 30 ans au 1er janvier de l''année des revenus sortent
    du revenu imposable jusqu''à 4 SMIC bruts annuels. « Jusqu''à quatre fois le Smic » se
    lit comme un abattement : le salaire au-delà reste imposé, sans falaise (l''autre lecture,
    tout imposé au-delà, n''est pas codée). Le SMIC est brut, le candidat ne le dit pas ;
    4 SMIC nets feraient 3,17 SMIC bruts, dans la plage. Les revenus des non-salariés, le
    chômage et les pensions ne sont pas exonérés ; les prestations, qui lisent le salaire
    entier, ne bougent pas. Un jeune rattaché au foyer de ses parents allège l''impôt de ce
    foyer. Plage du plafond : de 0 (la mesure retirée) à 4 SMIC prolongés de la moitié de
    l''écart (6). Contre le droit de 2026.'
  source: le chiffrage de la mesure (`programmes/le_pen.json`)
