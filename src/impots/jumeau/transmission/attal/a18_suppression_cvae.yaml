hypotheses:
- texte: 'La CVAE est supprimée sur le droit de 2026 (son barème mis à l''échelle 0). L''IS
    reste à 25 %, son taux de 2026 : aucun bouton à régler. La « poursuite de la baisse des
    impôts de production » n''a pas de taux et n''est pas chiffrée. La plage va de la suppression
    (0) au droit de 2026 (1).'
  source: le chiffrage de la mesure (`programmes/attal.json`)
- texte: 'La passe de la première année retire 3,28 Md€ de CVAE et rend 0,62 Md€ d''IS (la
    CVAE est déductible du bénéfice) : 2,55 Md€ de prélèvements en moins ; le PLF 2026 prévoit
    2,74 Md€ de CVAE pour l''État.'
  source: le rapport de la mesure ; Évaluation des voies et moyens 2026, tome 1, ligne 1497
