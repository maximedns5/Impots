mesure: a18_suppression_cvae
candidat: attal
libelle: Suppression de la CVAE ; IS maintenu à 25 % ; poursuite de la baisse des impôts de
  production
sorte: chiffree
source:
  citation: « Le taux de l'impôt sur les sociétés reste à 25 %. Il veut mener enfin à terme
    la suppression de la CVAE » (texte de la page)
  url: https://attalpresident.fr/programme/mesures/loi-de-stabilite-fiscale
  date: '2026-08-27'
levier:
  texte: Code général des impôts, art. 1586 ter et s. (la CVAE) ; loi de finances pour 2024,
    art. 79 (sa suppression progressive jusqu'en 2030), que la mesure mène à terme
  parametre: cvae_echelle
  valeur:
    cvae_echelle: 0.0
  enonce: CVAE = 0 ; IS à 25 %
  couche: entreprises
payeurs:
- qui: entreprises
  sens: recoit
  par: cvae
- qui: apu:apul
  sens: paie
  par: impots_production_entreprises
  note: la CVAE est affectée aux collectivités, compensée par une fraction de TVA depuis 2021
incidence:
- horizon: immediat
  qui: les entreprises
  texte: La marge après impôt bouge.
  source: 'Fullerton et Metcalf (2002), « Tax incidence », Handbook of Public Economics, vol.
    4, ch. 26 : à long terme, l''incidence ne dépend pas de qui verse l''impôt, mais des élasticités
    de l''offre et de la demande'
- horizon: long
  qui: clients et salariés
  texte: Un impôt de production pèse sur la compétitivité et les prix.
  source: 'Martin et Trannoy (2019), « Les impôts sur (ou contre) la production », Note du
    CAE n° 53 : les impôts sur le chiffre d''affaires et la valeur ajoutée se reportent en
    cascade sur les prix et pèsent sur la compétitivité'
