hypotheses:
- texte: 'Une prestation neuve (D-382) : 350 € par mois pour chaque enfant à charge dès le
    premier, à la place des allocations familiales (avec leur majoration pour âge et leur
    forfait) et du complément familial, que « unique » fond ; l''allocation de rentrée scolaire
    reste. Hypothèses : par enfant, comme le dit « dès le premier enfant » (l''autre lecture,
    350 € par famille, coûterait bien moins et n''est pas la valeur retenue) ; jusqu''à la
    veille de 20 ans, l''âge des allocations familiales. « Dégressif en fonction de l''impôt
    sur le revenu » n''a pas de barème : l''allocation annuelle de la famille baisse de la
    moitié de l''impôt de son foyer (un douzième par mois), sans plancher ; la plage va de
    0 (pas de dégressivité) à 1 (un euro d''allocation par euro d''impôt). Ni imposable ni
    dans les ressources des minima et des aides au logement (D-382). Contre le droit de 2026.'
  source: le chiffrage de la mesure (`programmes/philippe.json`)
