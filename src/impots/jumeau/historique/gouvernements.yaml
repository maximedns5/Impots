    debut: 2017-05-14
    fin: 2022-05-13
  - nom: Emmanuel Macron
    mandat: 2
    debut: 2022-05-14
    fin: 2027-05-13

a_venir:
  evenement: élection présidentielle de 2027
  fin_du_mandat_en_cours: 2027-05-13
  premier_jour_du_successeur: 2027-05-14
  note: >-
    Le successeur et son gouvernement ne sont pas connus. Un programme de candidat part de
    l'état que laisse le gouvernement en fonction au 13 mai 2027.

