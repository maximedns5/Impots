# La frise des gouvernements de la France, de 2010 à 2027 (but 23, lot 5, D-410).
#
# Des faits juridiques : les décrets de nomination du Premier ministre et de composition du
# gouvernement, publiés au Journal officiel. Lus par `jumeau/votees.py`.
#
# LA CONVENTION, une seule, pour que la frise couvre chaque jour sans trou ni chevauchement :
# un gouvernement court du jour de la nomination de son Premier ministre (`debut`) à la
# veille de la nomination du suivant (`fin`). Entre une démission et la nomination suivante,
# le gouvernement démissionnaire expédie les affaires courantes : il est encore celui de la
# frise. Un Premier ministre renommé après une démission ouvre un nouveau gouvernement.
# `composition` est la date du décret qui nomme les ministres ; `demission`, celle où le
# président l'a acceptée. Le dernier gouvernement n'a pas de `fin` : il est en fonction au
# dernier fait connu du dépôt.
#
# Les présidents courent de leur investiture à la veille de celle du suivant. Le mandat en
# cours finit le 13 mai 2027 ; le suivant n'est pas connu (`a_venir`) : c'est là qu'un
# candidat se branche sur l'état que laisse le dernier gouvernement.
#
# Vérification : dates de mémoire, Légifrance n'étant pas joignable depuis la session du
# 14 novembre 2026 (403) ; le Premier ministre de 2025 et 2026 est lu sur les en-têtes des
# PLF 2026 et 2027 et du PLFSS 2027 déposés (data/raw). À relire sur le JORF.
#
# L'HISTOIRE LONGUE (D-446) : la frise remonte au 17 mai 1995 (Jacques Chirac, Alain Juppé)
# pour ranger les mesures votées de 1995 à 2009. Dates de mémoire comme les autres : les
# décrets de nomination ne sont pas dans l'extrait du JO de D-446 (lois et décrets de
# cotisations seulement). À relire sur le JORF.

presidents:
  - nom: Jacques Chirac
    mandat: 1
    debut: 1995-05-17
    fin: 2002-05-16
  - nom: Jacques Chirac
    mandat: 2
    debut: 2002-05-17
