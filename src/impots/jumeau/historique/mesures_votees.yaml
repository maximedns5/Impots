# La base des mesures fiscales et sociales votées, de 2010 à 2026, par gouvernement
# (but 23, lot 5, D-410). Lue par `jumeau/votees.py`.
#
# CE QUE LA BASE PORTE : le droit voté. Pour chaque mesure, le texte (loi, ordonnance ou
# décret, son numéro et sa date de promulgation ou de signature), l'article, l'instrument,
# les paramètres que le texte change (avant, après) et l'année d'effet. Le gouvernement
# est celui en fonction à la date du texte, selon la frise de `gouvernements.yaml` (une
# loi de finances préparée par un gouvernement et promulguée sous le suivant est au
# suivant ; la note le dit).
#
# CE QU'ELLE NE PORTE PAS, ET NE DOIT JAMAIS PORTER : ce que la mesure a coûté ou
# rapporté. Aucun montant budgétaire, aucune évaluation préalable de PLF ou de PLFSS,
# aucun chiffrage de tiers : ce sont les juges du passé (D-359 à D-361), que le lot 6
# préenregistrera avant de les ouvrir. Les seuls montants sont des paramètres du droit
# (un seuil, un plafond, un abattement), écrits en euros entiers. Un test le vérifie.
#
# LA VÉRIFICATION, dite mesure par mesure (`verification`) :
# * « codes.droit.org » : l'article et la loi sont confirmés sur l'export de la base de
#   Légifrance que publie codes.droit.org (mis à jour le 31 octobre 2026 pour le CGI) :
#   la version en vigueur de l'article codifié porte la loi et l'article cités, ou son
#   texte les nomme ;
# * « mémoire » : écrit de mémoire, Légifrance n'étant pas joignable depuis la session du
#   14 novembre 2026 (refus 403). Le numéro d'article est le premier à relire.
#
# Les instruments (vocabulaire fermé, `votees.INSTRUMENTS`) : ir, ir_capital, csg,
# cotisations_employeurs, cotisations_salaries, is, impots_production, tva,
# accises_energie, taxe_habitation, patrimoine, transmission, prestations, retraites,
# remunerations, autres_impots. Les statuts (`votees.STATUTS`) : en_vigueur, remplacee
# (par une mesure suivante, `suite`), temporaire, suspendue, abrogee, abrogee_avant_effet,
# censuree.

mesures:

