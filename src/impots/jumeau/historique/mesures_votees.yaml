    article: "2"
    codification: CGI, art. 1447-0, 1586 ter et suivants
    annee_effet: 2010
    parametres:
      - {quoi: "taxe professionnelle", avant: "assise sur les valeurs locatives et, jusqu'en 2009, les équipements et biens mobiliers", apres: supprimée}
      - {quoi: "cotisation foncière des entreprises (CFE)", avant: néant, apres: "assise sur les valeurs locatives foncières"}
      - {quoi: "cotisation sur la valeur ajoutée des entreprises (CVAE)", avant: néant, apres: "1,5 % de la valeur ajoutée, taux effectif progressif selon le chiffre d'affaires (nul sous 500 000 €)"}
    statut: remplacee
    verification: mémoire

