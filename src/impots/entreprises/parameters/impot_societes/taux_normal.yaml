description: "Taux normal de l'impôt sur les sociétés"
metadata:
  unit: /1
  reference:
    2021-01-01: https://www.legifrance.gouv.fr/jorf/article_jo/JORFARTI000036339292
    2022-01-01: https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000006308387
values:
  # CGI art. 219-I. Confirmed against Légifrance 2026-09-01.
  #
  # Trigger: exercices OUVERTS à compter du 1er janvier 2022. We key parameters by
  # calendar year, which is exact for a firm whose exercice is the calendar year
  # and wrong for one straddling it: a firm running 01/07/2021-30/06/2022 is taxed
  # at 26,5 % (or 27,5 % above 250 M€ of CA), not 25 %. The population has no
  # exercice dates, so every firm is treated as calendar-year. Recorded as a bias,
  # not fixed — see docs/DECISIONS.md D-020.
  #
  # 2021 (D-706) : 26,5 %, exercices ouverts à compter du 1er janvier 2021 (LF 2018,
  # art. 84, JORFARTI000036339292) ; 27,5 % pour les redevables d'au moins 250 M€ de
  # chiffre d'affaires (LF 2020, art. 39, JORFARTI000039683972), dans
  # taux_normal_grandes_entreprises.yaml. Les deux lus au JORF (D-413 :
  # jumeau/historique/mesures_votees.yaml, lfi2018_is_25, lfi2020_is_grandes_entreprises).
  # En 2021, plus de tranche de bénéfice : un taux sur tout le bénéfice, selon le CA.
  # C'est la lecture des étapes de 2021 ; À VÉRIFIER sur le texte de l'art. 219 (si les
  # 500 000 premiers euros restaient à 26,5 % chez les grandes, l'écart est de 5 000 €
  # par entreprise au-delà de 250 M€).
  #
  # Deliberately no value before 2021: in 2019 and 2020 the normal rate also had a
  # 500 000 € profit tranche (28 % below it, 31 % or 33 1/3 % above it, depending on
  # turnover), which this module does not encode. A query for an earlier year fails
  # loudly rather than silently returning a flat rate that never existed.
  2021-01-01:
    value: 0.265
  2022-01-01:
    value: 0.25
