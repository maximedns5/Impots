description: "Taux normal de l'impôt sur les sociétés"
metadata:
  unit: /1
  reference:
    2022-01-01: https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000006308387
values:
  # CGI art. 219-I. Confirmed against Légifrance 2026-09-01.
  #
  # Trigger: exercices OUVERTS à compter du 1er janvier 2022. We key parameters by
  # calendar year, which is exact for a firm whose exercice is the calendar year
  # and wrong for one straddling it: a firm running 01/07/2021-30/06/2022 is taxed
  # at 26,5 % (or 27,5 % above 250 M€ of CA), not 25 %. The population has no
  # exercice dates, so every firm is treated as calendar-year. Recorded as a bias,
  # not fixed — see docs/DECISIONS.md D-020.
  #
  # Deliberately no value before 2022: from 2019 to 2021 the normal rate was a
  # two-bracket scale that also depended on turnover (0,28 / 0,31 / 0,333 with a
  # 250 M€ CA threshold), which this module does not encode. A query for an earlier
  # year fails loudly rather than silently returning a flat rate that never existed.
  2022-01-01:
    value: 0.25
