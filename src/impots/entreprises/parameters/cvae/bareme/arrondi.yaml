description: "Pas d'arrondi du taux de CVAE (CGI art. 1586 quater, I, dernier alinea)"
# PIEGE. « Les taux sont exprimes en pourcentages et arrondis au centieme le plus
# proche » : l'arrondi porte sur le taux EN POINTS DE POURCENTAGE (0,0827 % -> 0,08
# %), soit un arrondi au multiple de 0,0001 en fraction. Ne pas l'appliquer biaise le
# taux jusqu'a +/- 6 % dans le bas du bareme. Il ne s'applique PAS au taux plafond de
# la tranche e.
