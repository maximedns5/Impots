description: "Taux de la CEBGE, CA < 3 Md€ (LF 2025 art. 48, IV-A)"
# Non codifie : la CEBGE ne figure pas au CGI, elle vit dans l'article 48 de la loi de
# finances pour 2025, proroge par l'article 12 de la loi de finances pour 2026. La
# baisse a 10,3 % proposee au PLF 2026 n'a PAS ete retenue. DATES PAR ANNEE CIVILE,
# sous l'hypothese d'exercices calendaires (D-020). La CEBGE porte sur les DEUX
# PREMIERS EXERCICES CLOS a compter du 31 decembre 2025 : pour un exercice calendaire,
# l'exercice 2025 est le premier et l'exercice 2026 le second. Une entreprise
# cloturant au 30 juin est touchee sur 30/06/2026 et 30/06/2027, ce que ce parametrage
# ne sait pas representer.
