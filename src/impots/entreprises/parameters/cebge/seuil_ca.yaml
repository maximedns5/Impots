description: "CA a partir duquel la CEBGE est due (LF 2025 art. 48, II ; LF 2026 art. 12, 2°)"
# Le seuil MONTE de 1 a 1,5 Md€ au second exercice, et surtout il change de nature :
# au premier exercice il est teste sur l'exercice courant OU le precedent, au second
# sur le seul exercice courant (BOI-IS-AUT-60 § 70). Une entreprise a 1,2 Md€ en 2026
# apres 1,1 Md€ en 2025 sort donc du champ la seconde annee alors qu'elle y etait la
# premiere. DATES PAR ANNEE CIVILE, sous l'hypothese d'exercices calendaires (D-020).
# La CEBGE porte sur les DEUX PREMIERS EXERCICES CLOS a compter du 31 decembre 2025 :
# pour un exercice calendaire, l'exercice 2025 est le premier et l'exercice 2026 le
# second. Une entreprise cloturant au 30 juin est touchee sur 30/06/2026 et
# 30/06/2027, ce que ce parametrage ne sait pas representer.
