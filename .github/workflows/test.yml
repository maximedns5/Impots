name: test

on:
  # LANCEMENT MANUEL SEULEMENT, depuis le 2026-10-16 (D-212). Depuis le 2026-10-15 à
  # 13 h 56 UTC, aucun job n'obtient de runner, la forme d'un quota de minutes épuisé
  # (D-161), et le propriétaire a décidé de continuer sans les Actions. Chaque poussée
  # déclenchait un run qui échouait en quelques secondes : une croix rouge qui ne
  # vérifiait rien et qu'on finit par ne plus lire. Pour rétablir les runs
  # automatiques, remettre les deux déclencheurs d'avant :
  #
  #   push:
  #     branches: [main]
  #   pull_request:
  #
  # `push` était restreint à `main` : sans filtre, il déclenchait un run sur chaque
  # branche en plus du run `pull_request` du même commit, et le job le plus cher
  # tournait deux fois par poussée.
  workflow_dispatch:

# Sans ce groupe, une poussée qui en remplace une autre laisse la précédente aller
# jusqu'au bout — cinquante minutes de runner pour un commit que personne ne
# regardera plus. `cancel-in-progress` ne s'applique PAS à `main` : on veut que la
# ligne d'historique de la branche par défaut reste complète.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # The pre-commit hook that enforces this lives in .githooks/, and
  # core.hooksPath is local config that does not survive a clone. This job is the
  # backstop: it asserts the property on the pushed tree, for everyone who never
  # ran `git config core.hooksPath .githooks`.
  no-data-committed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: No data files in the tree (D-016)
        run: python scripts/check_no_data_committed.py --tree

  # LE JOB QUI TOURNE SUR CHAQUE POUSSÉE.
  #
  # Mesuré dans un arbre neuf, chaîne de données complète, machine au repos :
  # `-m "not slow"` fait 1 366 passés et 115 sautés en **11 min 16 s**, contre
  # ~65 min en local pour la suite entière. Le même écart en CI : l'étape Tests de la
  # suite complète y a pris 46 min, donc ce job devrait y tenir sous la dizaine de
  # minutes.
  #
  # Deux chiffres FAUX ont précédé celui-ci, et ils sont consignés en D-161 plutôt
  # qu'effacés : 6 min 39 s, mesuré sans données — rapide parce que cinq tests
  # échouaient d'emblée ; puis 25 min 39 s, mesuré pendant que TROIS pytest se
  # disputaient la machine. Une durée relevée sous contention n'est pas une durée.
  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Pin check
        run: |
          python - <<'PYPIN'
          from importlib.metadata import version
          assert version("openfisca-france") == "176.0.8", version("openfisca-france")
          assert version("openfisca-core") == "44.7.0", version("openfisca-core")
          print("pins OK")
          PYPIN

      # Les deux portes du moteur, venues du job complet quand celui-ci est sorti de
      # la CI automatique (D-172) : elles ne tournaient nulle part ailleurs. ~25 s à
      # elles deux, sans aucune donnée.
      - name: Engine assumptions
        run: python scripts/verify_openfisca.py

      # The population-scale gate: subrole vocabulary, the nbptr guard, the NaN
      # guard. Small N in CI — it is testing wiring, not throughput.
      - name: Population engine assumptions
        run: python scripts/verify_population_engine.py 2000

      - name: Lint
        run: ruff check src tests scripts

      # Le repli de clé (D-205) : un manifeste qui change restaure le cache du
      # précédent au lieu de tout retélécharger. Un fichier restauré n'est gardé que
      # s'il est conforme, octet pour octet ; l'élagage retire ceux que le manifeste ne
      # source plus. Sans lui, une PR qui touche au manifeste dépend de chaque serveur
      # source, et la panne d'un seul la rougit (impots.gouv.fr, 2026-10-14).
      - name: Restore the raw sources (keyed on their manifest checksums)
        uses: actions/cache@v4
        with:
          path: |
            data/raw/*
            !data/raw/MANIFEST.json
          key: raw-sources-${{ hashFiles('data/raw/MANIFEST.json') }}
          restore-keys: raw-sources-

      - name: Drop restored files the manifest no longer sources
        run: python -c "from impots.donnees import elaguer_cache; print(elaguer_cache())"

      # LE MÊME profil que la suite complète, délibérément. Un second profil, réduit,
      # a été écrit puis retiré : mesuré, il faisait gagner ~35 s (fetch 36 s + build
      # 6 s en CI) et coûtait une seconde liste à garder suffisante, qui dérive en
      # silence et fait rougir ce job pour un fichier manquant au lieu d'un vrai
      # défaut. Tout le gain est dans `-m "not slow"`, pas dans les données.
      - name: Fetch the raw sources
        run: impots data fetch --profile tests

      - name: Build the derived artefacts
        run: |
          impots entreprises cells
          impots population build

      - name: Preflight — every dependency present and valid
        run: impots data check --profile tests

      - name: Tests (fast subset)
        run: pytest -q -m "not slow"
        env:
          IMPOTS_SKIP_PERF: "1"

  # LA SUITE COMPLÈTE — hors de la CI automatique depuis D-172, sur décision du
  # propriétaire. Elle ne se lance plus qu'à la main : Actions → test → « Run
  # workflow », sur la branche voulue. Elle n'a JAMAIS fini sur un runner — deux
  # essais, tués avant leur résumé (`f1e5837` par SIGTERM ; `1e12460` par un signal
  # d'arrêt du runner, à ~63 % après 73 min) —, il lui faut ~2 h à ce rythme, et ces
  # minutes sont facturées. La vérification complète est `make full` en local, comme
  # la charte l'exige déjà (§4) ; `fast` couvre chaque PR et chaque poussée sur `main`.
  pytest:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      # openfisca-france is a ~1 min install and its parameter tree is the bulk of
      # it. The pip cache above keeps the wheels; this keeps the resolved venv from
      # being rebuilt when nothing in pyproject.toml moved.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Pin check
        run: |
          python - <<'PY'
          from importlib.metadata import version
          # The golden values in tests/golden/ are anchored to these exact versions.
          # A silent bump would turn a legislative change into a mysterious test failure.
          assert version("openfisca-france") == "176.0.8", version("openfisca-france")
          assert version("openfisca-core") == "44.7.0", version("openfisca-core")
          print("pins OK")
          PY

      - name: Engine assumptions
        run: python scripts/verify_openfisca.py

      # The population-scale gate: subrole vocabulary, the nbptr guard, the NaN
      # guard. Small N in CI — it is testing wiring, not throughput.
      - name: Population engine assumptions
        run: python scripts/verify_population_engine.py 2000

      - name: Lint
        run: ruff check src tests scripts

      # THE DATA CHAIN, which CI did not have. Eighteen tests failed here after 47
      # minutes, each on the FIRST missing file of its chain — and the trace named only
      # that first file: the macro store alone reads three PDFs, not the one its error
      # showed. `impots data` derives the list from the readers' own constants, so it
      # asks for everything the suite reads rather than what the last failure printed.
      #
      # Raw sources are cached keyed on the manifest: they are immutable by sha256, so a
      # cache hit is correct by construction. A manifest change falls back on the last
      # cache (D-205): `data fetch` keeps a restored file only if it matches the new
      # manifest byte for byte, re-fetches the rest, and the pruning step drops what the
      # manifest no longer sources. The derived artefacts are NOT cached — they are rebuilt from verified sources every
      # run, because a stale population silently reused is the failure this whole chain
      # exists to prevent. Every source is Licence Ouverte or open access (see the
      # manifest); none is committed (D-016) — they live in the runner, not the tree.
      - name: Restore the raw sources (keyed on their manifest checksums)
        uses: actions/cache@v4
        with:
          path: |
            data/raw/*
            !data/raw/MANIFEST.json
          key: raw-sources-${{ hashFiles('data/raw/MANIFEST.json') }}
          restore-keys: raw-sources-

      - name: Drop restored files the manifest no longer sources
        run: python -c "from impots.donnees import elaguer_cache; print(elaguer_cache())"

      # By manifest entry only: URL, byte count and sha256 are checked BEFORE the file
      # is renamed into place, so a publication that changed under the same URL fails
      # here, loudly, instead of producing plausible numbers downstream (D-007).
      - name: Fetch the raw sources the suite reads
        run: impots data fetch --profile tests

      - name: Build the derived artefacts
        run: |
          impots entreprises cells
          impots population build

      # Fails in about a second, listing every missing or invalid dependency with the
      # command that produces it — before the 47-minute run, not during it.
      - name: Preflight — every dependency present and valid
        run: impots data check --profile tests

      # `-m ""` overrides the default gate in pyproject, which excludes the tests that
      # need a full population pass.
      #
      # An earlier version of this comment said "CI is where minutes are cheap". On a
      # PRIVATE repository they are not: this workflow ran on `push:` AND
      # `pull_request:`, so the fifty-minute job ran twice per push, and the account's
      # Actions allowance ran out mid-review. The sentence is corrected rather than
      # deleted, because it is the assumption that produced the bill.
      - name: Tests
        run: pytest -q -m ""
        env:
          IMPOTS_SKIP_PERF: "1"

  perf:
    # Timing budget, run separately so a noisy runner cannot fail the correctness job.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: pytest -q -k "budget or faster_than"
