name: test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # The pre-commit hook that enforces this lives in .githooks/, and
  # core.hooksPath is local config that does not survive a clone. This job is the
  # backstop: it asserts the property on the pushed tree, for everyone who never
  # ran `git config core.hooksPath .githooks`.
  no-data-committed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: No data files in the tree (D-016)
        run: python scripts/check_no_data_committed.py --tree

  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      # openfisca-france is a ~1 min install and its parameter tree is the bulk of
      # it. The pip cache above keeps the wheels; this keeps the resolved venv from
      # being rebuilt when nothing in pyproject.toml moved.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Pin check
        run: |
          python - <<'PY'
          from importlib.metadata import version
          # The golden values in tests/golden/ are anchored to these exact versions.
          # A silent bump would turn a legislative change into a mysterious test failure.
          assert version("openfisca-france") == "176.0.8", version("openfisca-france")
          assert version("openfisca-core") == "44.7.0", version("openfisca-core")
          print("pins OK")
          PY

      - name: Engine assumptions
        run: python scripts/verify_openfisca.py

      # The population-scale gate: subrole vocabulary, the nbptr guard, the NaN
      # guard. Small N in CI — it is testing wiring, not throughput.
      - name: Population engine assumptions
        run: python scripts/verify_population_engine.py 2000

      - name: Lint
        run: ruff check src tests scripts

      # The population tests run against tests/fixtures/eec_sample.parquet, so CI
      # needs neither network access nor the 11.7 MB INSEE file. The full-data path
      # is exercised locally.
      # GitHub runners are slower and noisier than a laptop; the timing assertions
      # exist to catch an accidental benefits cascade, not to benchmark CI.
      # `-m ""` overrides the default gate in pyproject, which excludes the tests
      # that need a full population pass. CI is where minutes are cheap, so it runs
      # everything it can.
      #
      # Worth stating plainly: those tests currently SKIP here anyway, because CI has
      # no built population — the EEC file is 11.7 MB and downloading it is not CI's
      # job. So the full pass genuinely runs only on a machine that has the data.
      # `-m ""` is what makes CI pick them up the day that changes, rather than
      # silently continuing to skip a suite everyone believes is running.
      - name: Tests
        run: pytest -q -m ""
        env:
          IMPOTS_SKIP_PERF: "1"

  perf:
    # Timing budget, run separately so a noisy runner cannot fail the correctness job.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: pytest -q -k "budget or faster_than"
