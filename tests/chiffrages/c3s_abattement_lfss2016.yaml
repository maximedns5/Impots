description: >
  Relèvement de l'abattement d'assiette de la C3S de 3,25 M€ à 19 M€, étape 2 du
  Pacte de responsabilité. Le réformé encode le MIROIR — le retour à 3,25 M€ — parce
  que 19 M€ est le droit courant et n'a jamais bougé depuis. La formule du dépôt,
  assiette = max(CA − abattement, 0) × taux, est exactement l'objet chiffré.
