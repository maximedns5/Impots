key: cebge_creation_lfi2025
article: "LFI 2025, art. 48 (déposé comme PLF 2025, art. 11)"
year: 2025
scope: firm
description: >
  Création de la contribution exceptionnelle sur les bénéfices des grandes
  entreprises. Le réformé encode le MIROIR de l'article — l'abrogation, taux mis à
  zéro sur les deux tranches — parce que l'arbre de paramètres porte déjà la CEBGE
  en 2025 : rejouer l'article serait un no-op contre la référence. La grandeur
  comparée aux 8 Md€ est donc |Δ|.
