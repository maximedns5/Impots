key: ir_bareme_indexation_lfi2024
article: "LFI 2024 (loi n° 2023-1322 du 29 décembre 2023), art. 2"
year: 2023
scope: household
description: >
  Indexation de 4,8 % du barème de l'IR, de la décote et du plafond du quotient
  familial au titre des revenus de 2023. Le réformé encode l'état AVANT — le barème
  des revenus 2022 — parce que la référence openfisca au millésime 2023 porte déjà
  l'état APRÈS : rejouer l'article serait un Δ nul. Le backtest compare donc AVANT
  contre APRÈS à population constante, et |Δ| est la grandeur chiffrée.
