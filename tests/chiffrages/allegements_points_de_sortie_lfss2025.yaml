key: allegements_points_de_sortie_lfss2025
article: "LFSS 2025 (loi n° 2025-199 du 28 février 2025) — abaissement des points de sortie"
year: 2024
scope: household
description: >
  Abaissement du point de sortie du bandeau maladie de 2,5 à 2,25 SMIC et du bandeau
  famille de 3,5 à 3,3 SMIC. L'article est rejoué tel quel sur le droit 2024 : la
  référence porte encore les anciens plafonds, donc le Δ EST la mesure. C'est le
  premier cas produit par la règle de re-balayage de D-036 — les leviers de
  cotisations patronales étant nouveaux, les articles exprimables ont été rebalayés.
