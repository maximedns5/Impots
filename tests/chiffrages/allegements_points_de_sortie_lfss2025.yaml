tier: light
tolerance: 0.25
tolerance_reason: >
  ±25 %, the tolerance this project already declares for an instrument. Nothing wider
  is defensible for a measure whose published figure and whose simulated one are both
  clean quantities: the article moves two parameters, both expressible, and the
  population is one year from the measure's vintage.
expect_red: true
caveat: >
  RED BY A FACTOR OF TWO, AND IT IS THE MOST INFORMATIVE RESULT IN THE SUITE.
  Simulated 4.23 Md€ against a published 2.0 Md€: +112 %, measured on the FULL
  population. The figure first recorded here was 4.15 Md€ / +107 %, taken from a
  20 000-household subsample drawn by a sampler later found to be biased (D-074); the
  same case on the same subsample now reads +122 %, and the 0.10 between that and the
  sample-free +112 % is the draw. This case is the reason the pin moved: it is the most
  sample-sensitive in the suite, because its yield depends on the mass in a narrow wage
  band and a subsample estimates that mass badly.

  Mechanical explanations first (D-029), and both fail. *Vintage*: re-encoding the
  case at 2025 as a mirror — putting the ceilings back to 2,5 and 3,5 against 2025
  law and the 2025 SMIC — gives 4.84 Md€, or +142 %. The alternative encoding is
  WORSE, so the year is not the problem. *Scope*: the published figure is on the
  régimes de base, 1,6 CNAM plus 0,4 CNAF, and both bandeaux are CNAM and CNAF
  measures, so nothing is missing from the comparator.

  What is left is the population's wage distribution, and this case measures it far
  more sharply than the barème one does. Both bandeaux are **cliffs**: below the
  ceiling the reduction is a flat rate, above it there is nothing. Lowering a ceiling
  therefore removes the whole reduction from everyone between the old and new one, so
  the yield is proportional to the MASS IN THAT BAND ALONE — 2,25 to 2,5 SMIC, and
  3,3 to 3,5 SMIC. A population carrying too many earners there overshoots directly
  and without damping.

  So this is a second external measurement of D-015, on a different instrument, and it
  is much larger than the first: the barème-indexation case reads +10 % on an
  instrument whose brackets are progressive, this one reads +112 % on two narrow
  cliffs. That contrast is the finding. It says the synthetic income distribution's
  error is not a gentle level shift but a mis-shaped density, and that any reform
  whose yield depends on the mass in a narrow wage band will be badly overstated
  until the population carries observed incomes.

  Under D-035's rule this is the acceptance test's companion: PHASE1C_ERFS §6 says the
  barème case re-runs first on the ERFS population. This one should re-run second, and
  it is the more demanding of the two.
