# Les données critiques des fiches de Philippe (but 27, volet `fiches`, D-505).
p3_deal_impots_production:
  levier:
    texte: "Code général des impôts : CVAE (art. 1586 ter), CFE (art. 1447), taxe foncière ;
      Code de la sécurité sociale, art. L137-30 (C3S)"
  assiette:
    texte: "les autres impôts sur la production reçus par les APU (D29) : les 50 Md€ en
      font 38 %"
    montant_md: 132.8
    annee: 2025
    source: "Insee, comptes nationaux annuels base 2020, t. 7.301 (compte des APU, S13), ligne D29"
p19_baisse_aides_entreprises:
