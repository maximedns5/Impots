      cotisations (75,6 Md€) n'y sont pas"
    montant_md: 56.5
    annee: 2025
    source: "Insee, comptes nationaux annuels base 2020, t. 7.301 (compte des APU, S13), ligne D3"
p5_retraite_65_ans_45_annuites:
