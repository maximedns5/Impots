  - *H_RHO
  - *H_VAR_DEP

a23_revalorisation_enseignants:
  code: D1
  profil: {profil: calendrier, debut: 2027, plein: 2028, fin: 2035,
           calendrier: {2027: 0.71, 2028: 2.13}}
  montant:
    md: 2.13
    sens: depense
    calcul: "888 800 enseignants payés par l'État (747 400 du public et 141 400 du privé
      sous contrat, rentrée 2025) × 200 € nets × 12 mois = 2,13 Md€ nets par an ; un
      tiers en 2027 (de la rentrée de septembre) : 0,71 Md€. Une borne basse du coût
      public : le brut, les cotisations de l'employeur et les +500 € en milieu de carrière
      n'y sont pas."
  levier:
    texte: "décrets indemnitaires des enseignants (l'indemnité de suivi et
      d'accompagnement des élèves et la prime d'attractivité, décret n° 2021-276) ; mission
      « Enseignement scolaire »"
  assiette:
    texte: les enseignants du secteur public (747 400) et du privé sous contrat (141 400), à
      la rentrée 2025
    montant_md: null
    valeur: 888800
    unite: enseignants
    annee: 2025
    source: "DEPP, « Panorama statistique des personnels de l'enseignement scolaire
      2025-2026 »"
  payeurs:
  - {qui: "apu:etat", sens: paie, par: depense_publique}
  - {qui: menages, sens: recoit, par: salaire_net}
  calendrier:
    texte: « dès la rentrée 2027 »
    source: "attalpresident.fr/programme/mesures/revalorisation-salaires-professeurs (1er
      septembre 2026)"
  financement:
    annonce: "« dépenser moins pour les dépenses courantes et pour les dépenses sociales, et
      plus pour l'avenir et pour l'éducation »"
    source: "Attal, lettre du 15 octobre 2026, p. 1 (la deuxième règle d'or)"
    chiffre: false
  hypotheses:
  - texte: Les enseignants du privé sous contrat, payés par l'État, ont la même hausse.
    source: non sourcée
  - texte: Le montant tombe sur les rémunérations (D1).
    source: "le candidat : une revalorisation des salaires des professeurs"
  - texte: Les +500 € « en milieu de carrière » ne sont pas comptés, faute de calendrier et
      d'effectif.
    source: "attalpresident.fr, page de la mesure"
  - *H_RHO
  - texte: "La variante de Mésange la plus proche : depense_publique."
    source: non sourcée

a24_plan_ia_france_2040:
  code: INV
  montant:
    md: 10.0
    sens: depense
    citation: "« Gabriel Attal veut porter l'effort à 200 milliards d'euros, partagés à
