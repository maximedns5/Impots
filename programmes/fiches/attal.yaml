# Les données critiques des fiches de transmission d'Attal, mesure par mesure (but 27,
# volet `fiches`, D-505). Même règle que `melenchon.yaml` : le candidat, la loi ou une
# statistique publique ; un calcul écrit ; « non sourcée » quand rien ne porte.

_sources:
  lettre: &LETTRE "Attal, lettre aux Français sur les finances publiques, 15 octobre 2026
    (doc.parti.re/2026/Lettre-finances-publiques.pdf)"
  tenu: &H_TENU
    texte: Le montant est tenu chaque année jusqu'en 2035, en euros courants ; le candidat ne
      donne pas de trajectoire.
    source: non sourcée
  rho: &H_RHO
    texte: Le montant annoncé se réalise en entier (ρ = 1, D-319).
    source: non sourcée
  var_dep: &H_VAR_DEP
    texte: "La variante de Mésange la plus proche : depense_publique (la composition moyenne
      de la dépense, G2017-04, p. 106), faute de savoir quelle dépense."
    source: non sourcée
  fin_eco: &FIN_ECO
    annonce: "« deux tiers des économies seront réalisées sur nos dépenses sociales »"
    source: "Attal, lettre aux Français sur les finances publiques, 15 octobre 2026, p. 1"
    chiffre: false
    note: une économie ; elle finance le redressement (déficit sous 3 % avant 2032), pas une
      mesure nommée
  cal_elu: &CAL_ELU
    texte: « dès mon élection », 2027
    source: "Attal, lettre aux Français sur les finances publiques, 15 octobre 2026, p. 1"
  cal_page: &CAL_PAGE
    texte: aucune date dans la page de la mesure
    source: "attalpresident.fr, page de la mesure"
  fin_brut: &FIN_BRUT
    annonce: "« Ce choc de salaires doit être financé à l'euro près par des économies sur le
      modèle social, d'abord l'assurance chômage et les indemnités journalières, sans
      alourdir le coût du travail. »"
    source: "attalpresident.fr/programme/mesures/droit-au-brut (22 juillet 2026)"
    chiffre: false
    note: "le financement nommé (assurance chômage : 5 Md€, a11 ; indemnités journalières :
      sans montant, a12) couvre moins d'un dixième du coût de la première année"

# ---------------------------------------------------------------------------- chiffrées
a16_droit_au_brut:
  assiette:
  - texte: les cotisations salariales des APU (la part des ménages dans les cotisations
      sociales effectives) ; la mesure en retire 77,14 Md€ la première année
    montant_md: 120.2
    annee: 2026
    source: "le rapport de la première année du programme d'Attal (passe des ménages, total
      `cotisations_salariales` de la référence, 120,17 Md€)"
  calendrier:
    texte: « dès le début 2027 »
    source: "attalpresident.fr/programme/mesures/droit-au-brut (22 juillet 2026)"
  financement: *FIN_BRUT
  hypotheses:
  - texte: "L'échelle des cotisations salariales de retraite à 0,22 traduit « +250 € nets
      par mois au salaire médian » : 3 000 € par an sur 3 845 € de cotisations retraite
      salariales au médian."
    valeur: 0.22
    source: "le chiffrage de la mesure (`programmes/attal.json`, D-381 et suivantes), mesuré
      par le moteur"
  - texte: Les droits à la retraite des salariés ne baissent pas avec leurs cotisations.
    source: non sourcée
  - texte: "La caisse perd la recette : l'État la compense (art. L131-7 CSS) ou le régime
      s'endette ; le candidat ne dit pas lequel, et l'Agirc-Arrco n'est pas tenue par la
      loi."
    source: "Code de la sécurité sociale, art. L131-7"
  - texte: Aucune renégociation du brut la première année.
    source: "Saez, Matsaganis et Tsakloglou (2012), QJE 127(1)"

a18_suppression_cvae:
  levier:
    texte: "Code général des impôts, art. 1586 ter et s. (la CVAE) ; loi de finances pour
      2024, art. 79 (sa suppression progressive jusqu'en 2030), que la mesure mène à terme"
  assiette:
    texte: les recettes de CVAE de l'État
    montant_md: 2.741
    annee: 2026
    source: "Annexe au PLF 2026, Évaluation des voies et moyens, tome 1, ligne 1497 (4,265
      Md€ en 2024, 4,069 en 2025, 2,741 en 2026)"
  calendrier: *CAL_PAGE
  financement:
    annonce: null
    source: null
    chiffre: false
    note: la mesure ne dit pas son financement ; la « loi de stabilité fiscale » n'en porte
      pas
  hypotheses:
  - texte: "La passe de la première année retire 3,28 Md€ de CVAE et rend 0,62 Md€ d'IS
      (la CVAE est déductible du bénéfice) : 2,55 Md€ de prélèvements en moins ; le PLF
      2026 prévoit 2,74 Md€ de CVAE pour l'État."
    source: "le rapport de la mesure ; Évaluation des voies et moyens 2026, tome 1, ligne
      1497"

a22_pensions_alimentaires:
  levier:
    texte: "Code général des impôts, art. 79 (les pensions alimentaires reçues, imposables)
      et 156, II, 2° (leur déduction chez le débiteur) : les pensions reçues pour les
      enfants sorties du revenu imposable"
  calendrier: *CAL_PAGE
  hypotheses:
  - texte: La déduction chez le parent qui verse la pension est maintenue.
    source: non sourcée

# ------------------------------------------------------ les montants déclarés (hypothèses)
a2_frein_urgence_20_md:
  levier:
    texte: "loi de finances pour 2027 (et loi de finances rectificative) : des crédits gelés
      ou annulés, non désignés"
  assiette:
    texte: "la dépense des APU hors charges d'intérêts n'est pas lue ici ; la dépense de
      consommation finale des APU (P3) donne l'ordre de grandeur : 20 Md€ en font 2,8 %"
    montant_md: 719.6
    annee: 2025
    source: "Insee, comptes nationaux annuels base 2020, t. 7.301 (compte des APU, S13),
      ligne P3"
  payeurs:
  - {qui: "apu:etat", sens: recoit, par: depense_publique}
  calendrier:
    texte: « dès 2027 », « dès son arrivée à l'Élysée »
    source: "attalpresident.fr/programme/mesures/deficit-sous-trois-pour-cent ; Attal,
      lettre du 15 octobre 2026"
  financement: *FIN_ECO
  hypotheses:
  - texte: "Les 20 Md€ de 2027 sont les premiers des 150 Md€ du quinquennat (a1) : a1 n'a
      pas de montant annuel et n'est pas additionné."
    source: "Attal, lettre du 15 octobre 2026, p. 1 : « D'abord … un frein d'urgence de 20
      milliards … Ensuite, je lancerai un plan de 150 milliards »"
  - *H_TENU
  - *H_RHO
  - *H_VAR_DEP

a9_big_bang_territorial:
  levier:
    texte: "Code général des collectivités territoriales : un échelon de collectivité
      supprimé, non nommé (la Constitution, art. 72, nomme communes, départements et
      régions : une révision constitutionnelle si l'échelon est le département ou la
      région)"
  payeurs:
  - {qui: "apu:apul", sens: recoit, par: depense_publique,
     note: les collectivités dépensent moins}
  calendrier:
    texte: aucune date ; « chaque année » une fois la réforme faite
    source: "Attal, lettre du 15 octobre 2026, p. 1 : « Plus de 7 milliards d'euros pourront
      ainsi être économisés chaque année »"
  financement: *FIN_ECO
  hypotheses:
  - texte: L'économie est pleine dès 2027 ; une réforme des échelons prend plusieurs années,
      que le candidat ne dit pas.
    source: non sourcée
  - *H_TENU
  - *H_RHO
  - *H_VAR_DEP

a14_epargne_retraite_naissance:
  levier:
    texte: "aucun texte en vigueur : un plan d'épargne retraite ouvert par l'État à chaque
      naissance (Code monétaire et financier, art. L224-1 et s., le PER)"
  assiette:
    texte: "les naissances : 660 M€ pour 1 000 € par enfant en supposent 660 000 par an"
    montant_md: null
    annee: 2026
    source: "attalpresident.fr, actualité du 28 octobre 2026 (« 1 000 euros à chaque
      naissance … 660 millions d'euros par an »)"
  payeurs:
  - {qui: "apu:etat", sens: paie, par: depense_publique}
  - {qui: menages, sens: recoit, par: autre,
     note: une épargne bloquée jusqu'à la retraite de l'enfant}
  calendrier: *CAL_PAGE
  financement:
    annonce: null
    source: null
    chiffre: false
    note: la mesure ne dit pas son financement
  hypotheses:
  - texte: Le montant est un transfert en capital de l'État aux ménages (D9), qui ne
      consomment pas cette épargne.
    source: "le candidat : un plan d'épargne retraite, attalpresident.fr/programme/mesures/
      capitalisation-startups"
  - texte: Le montant entre en 2027.
    source: non sourcée
  - *H_TENU
  - *H_RHO

a31_geoenergie:
  montant:
    md: 0.08
    sens: depense
    calcul: "« Doubler les subventions à la géoénergie, pour les porter à 160 millions
      d'euros par an » : 80 M€ aujourd'hui, 160 M€ demain ; le coût est l'écart, 160 − 80 =
      80 M€ par an, et non 160."
  levier:
    texte: "les aides de l'Ademe à la chaleur renouvelable (le Fonds chaleur), ligne de la
      mission « Écologie, développement et mobilité durables »"
  assiette:
    texte: les subventions à la géoénergie aujourd'hui, la moitié des 160 M€ visés
    montant_md: 0.08
    annee: 2026
    source: "attalpresident.fr/programme/mesures/doubler-subventions-geoenergie (25 juin
      2026)"
  payeurs:
  - {qui: "apu:etat", sens: paie, par: depense_publique}
  - {qui: entreprises, sens: recoit, par: aides_publiques}
  calendrier:
    texte: « dès 2027 »
    source: "attalpresident.fr/programme/mesures/doubler-subventions-geoenergie"
  financement:
    annonce: null
    source: null
    chiffre: false
    note: la mesure ne dit pas son financement
  hypotheses:
  - texte: Le montant est une aide à l'investissement (D9).
    source: non sourcée
  - *H_TENU
  - *H_RHO

# --------------------------------------- les paramètres : chiffrés par une assiette ou dits
a8_cent_mille_postes:
  code: D1
  profil: {profil: rampe, debut: 2027, plein: 2031, fin: 2035}
  montant:
    md: 3.29
    sens: economie_depense
    calcul: "100 000 postes × 2 740 € (le salaire mensuel net moyen en EQTP de la fonction
      publique, 2024) × 12 mois = 3,29 Md€ de salaires nets par an, une borne basse de
      l'économie (sans les cotisations des employeurs publics) ; moins la prime de départ
      volontaire, sans montant."
  levier:
    texte: "lois de finances (plafonds d'emplois de l'État) et budgets des collectivités ;
      un plan de départs volontaires"
  assiette:
    texte: le salaire mensuel net moyen en EQTP de la fonction publique (2 740 €)
    montant_md: null
    valeur: 2740
    unite: € nets par mois
    annee: 2024
    source: "Insee, Siasp 2024, « Emploi, chômage, revenus du travail », édition 2026, fiche
      29, figure 1"
  payeurs:
  - {qui: "apu:etat", sens: recoit, par: depense_publique,
     note: "l'État et les collectivités ; le partage n'est pas dit"}
  - {qui: "apu:apul", sens: recoit, par: depense_publique}
  - {qui: menages, sens: paie, par: salaire_net,
     note: les postes non remplacés ; la prime de départ en rend une part}
  calendrier:
    texte: aucune date ; un plan de départs volontaires sur le quinquennat
    source: "Attal, lettre du 15 octobre 2026, p. 1"
  financement: *FIN_ECO
  hypotheses:
  - texte: Le montant tombe sur les rémunérations (D1) ; ce sont des postes.
    source: "Attal, lettre du 15 octobre 2026, p. 1 : « supprimer 100 000 postes de
      fonctionnaires »"
  - texte: Montée en charge linéaire de 2027 à 2031, la fin du mandat.
    source: non sourcée
  - texte: "La prime de départ volontaire n'est pas comptée : le candidat ne la chiffre
      pas."
    source: "Attal, lettre du 15 octobre 2026, p. 1 (« avec une prime de départ »)"
  - texte: L'économie peut être comprise dans les 20 Md€ du frein d'urgence (a2) ; le
      candidat ne le dit pas.
    source: non sourcée
  - *H_RHO

a11_assurance_chomage:
