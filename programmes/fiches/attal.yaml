    sens: economie_depense
    citation: "« Gabriel Attal veut la reprendre dès le début du mandat, avec deux
      objectifs : remettre les Français en emploi et dégager 5 milliards d'euros
      d'économies »"
    url: "https://attalpresident.fr/programme/mesures/reforme-assurance-chomage-cinq-milliards"
  levier:
    texte: "Code du travail, art. L5422-1 et s. et L5422-20 (le règlement d'assurance
      chômage, par décret à défaut d'accord des partenaires sociaux)"
  payeurs:
  - {qui: "apu:secu:chomage", sens: recoit, par: depense_publique, note: l'Unédic}
  - {qui: menages, sens: paie, par: chomage_brut}
  calendrier:
    texte: « dès le début du mandat »
    source: "attalpresident.fr/programme/mesures/reforme-assurance-chomage-cinq-milliards"
  financement:
    annonce: "« financé à l'euro près par des économies sur le modèle social, d'abord
      l'assurance chômage et les indemnités journalières »"
    source: "attalpresident.fr/programme/mesures/droit-au-brut"
    chiffre: true
    note: l'économie finance le droit au brut (a16), dont elle couvre une petite part
  hypotheses:
  - texte: Le montant tombe sur les allocations chômage (D62), aux ménages au prorata du
