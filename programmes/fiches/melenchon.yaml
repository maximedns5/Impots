    montant_md: null
    annee: 2026
    source: "Mélenchon, document du 14 octobre 2026, p. 10 : « plus aucun jeune ne doit
      vivre sous le seuil de pauvreté, fixé à 1 337 euros par mois »"
  payeurs:
  - qui: "apu:etat"
    sens: paie
    par: depense_publique
    note: la caisse qui verse n'est pas dite ; l'État par défaut
  - qui: menages
