    calcul: "754 500 allocataires du minimum vieillesse fin 2024 (Drees) × (1 337 € − 1 043,59
      €, le plafond de l'ASPA d'une personne seule en 2026) × 12 mois = 2,66 Md€ par an.
      L'ASPA est différentielle : chaque allocataire reçoit l'écart des plafonds. Les
      couples (plafond de 1 620,18 €) et les nouveaux entrants ne sont pas comptés ; à la
      dépense de 2026 (4,353 Md€, CCSS) relevée de 28,1 %, il en coûterait 1,22 Md€, une
      borne basse."
  levier:
    texte: "Code de la sécurité sociale, art. L815-1 et s. (l'allocation de solidarité aux
      personnes âgées) et D815-1 (son plafond)"
  assiette:
  - texte: les allocataires du minimum vieillesse fin 2024
    montant_md: null
    annee: 2024
    source: "Drees, communiqué du 4 décembre 2025 sur les minima sociaux (754 500
      allocataires, +4,3 %)"
  - texte: le plafond mensuel de l'ASPA pour une personne seule (1 043,59 €, brut)
    montant_md: null
    annee: 2026
    source: "service-public.gouv.fr, fiche F16871 (vérifiée le 23 juin 2026)"
  - texte: la dépense de minimum vieillesse de la CNAV
    montant_md: 4.353
    annee: 2026
    source: "Commission des comptes de la Sécurité sociale, mai 2026, tableau 1 de la fiche
      CNAV (3,845 Md€ en 2024, 4,105 en 2025, 4,353 en 2026)"
  payeurs:
  - qui: "apu:secu:vieillesse"
    sens: paie
    par: depense_publique
    note: la CNAV verse le minimum vieillesse depuis la fin du FSV en 2026 (CCSS)
  - qui: menages
    sens: recoit
    par: prestations
  calendrier: *CAL_LIVRE
  financement: *FIN_DEP
  hypotheses:
  - texte: Le montant tombe sur les prestations en espèces (D62), aux ménages au prorata
      des prestations.
    source: "Insee, t. 7.301 (D62)"
  - texte: Le seuil de 1 337 € est celui du candidat, tenu en euros de 2026.
    source: "programme de Mélenchon, livre, « Mettre en sécurité sociale », chapitre 1"
  - texte: Le montant entre en 2027 et est tenu jusqu'en 2035, en euros courants.
