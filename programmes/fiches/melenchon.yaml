# Les données critiques des fiches de transmission de Mélenchon, mesure par mesure
# (but 27, volet `fiches`, D-504). Lu par `scripts/jumeau_fiches_transmission.py`, qui
# écrit `src/impots/jumeau/transmission/melenchon/<mesure>.yaml` : cette table passe avant
# les fiches précises et les gabarits du script. Chaque nombre a sa source : le candidat,
# la loi, ou une statistique publique (aucun chiffrage de tiers du programme n'a été lu).
# Un calcul (assiette fois paramètre) est écrit en entier ; « non sourcée » dit ce que rien
# ne porte.

_sources:
  ns: &NS non sourcée
  doc: &DOC "Mélenchon, « Comment nous allons remettre de l'ordre dans les comptes publics »,
    14 octobre 2026 (melenchon2027.fr)"
  debut: &H_DEBUT
    texte: Le montant entre en 2027, par la loi de finances pour 2027 que le document
      décrit.
    source: "Mélenchon, « Comment nous allons remettre de l'ordre dans les comptes publics »,
      p. 6 : « Cette loi de finances, si elle était adoptée pour 2027, permettrait un
      ajustement de 25 milliards d'euros l'année prochaine »"
  tenu: &H_TENU
    texte: Le montant de la première année est tenu chaque année de 2027 à 2035, en euros
      courants ; le candidat ne donne qu'un montant annuel, sans trajectoire.
    source: non sourcée
  rho: &H_RHO
    texte: Le montant annoncé se réalise en entier (ρ = 1, D-319).
    source: non sourcée
  var_dep: &H_VAR_DEP
    texte: "La variante de Mésange la plus proche : depense_publique (la composition moyenne
      de la dépense publique, G2017-04, p. 106), faute de savoir quelle dépense."
    source: non sourcée
  var_aucune: &H_VAR_AUCUNE
    texte: "Aucune variante de Mésange pour cet impôt : le mode réduit ne lit aucun effet
      sur l'activité, seulement la recette."
    source: "Insee et DG Trésor, « Le modèle macroéconométrique Mésange : réestimation et
      nouveautés », document de travail G2017-04, §4 (les variantes publiées)"
  fin_dep: &FIN_DEP
    annonce: "« Pour financer ces besoins, il est nécessaire de récupérer l'argent là où il
      s'est accumulé lors des deux derniers quinquennats : revenus du capital, ménages les
      plus fortunés et profits des grandes entreprises. »"
    source: "Mélenchon, « Comment nous allons remettre de l'ordre dans les comptes publics »,
      p. 6 ; bilan p. 14 : « 106,4 milliards d'euros de recettes, 81,7 milliards de
      dépenses, 24,7 milliards de réduction du déficit »"
    chiffre: false
    note: le programme gage l'ensemble de ses dépenses par l'ensemble de ses recettes
      (106,4 Md€ contre 81,7 Md€), sans lier une recette à une dépense
  fin_rec: &FIN_REC
    annonce: "« Une partie de cette œuvre de justice fiscale devra être orientée vers la
      réduction de notre déficit »"
    source: "Mélenchon, « Comment nous allons remettre de l'ordre dans les comptes publics »,
      p. 6"
    chiffre: true
    note: une recette du programme ; son bilan (p. 14) en affecte 81,7 Md€ aux dépenses et
      24,7 Md€ au déficit, sans dire laquelle va où
  vm1: &VM1 "Annexe au projet de loi de finances pour 2026, Évaluation des voies et moyens,
    tome 1 (recettes)"
  vm2: &VM2 "Annexe au projet de loi de finances pour 2026, Évaluation des voies et moyens,
    tome 2 (dépenses fiscales)"
  ccss: &CCSS "Commission des comptes de la Sécurité sociale, « Les comptes de la Sécurité
    sociale », mai 2026"
  cal27: &CAL27
    texte: dès 2027, par la loi de finances pour 2027
    source: "Mélenchon, « Comment nous allons remettre de l'ordre dans les comptes publics »,
      p. 6"
  cal_livre: &CAL_LIVRE
    texte: aucune date ; la mesure est au programme (livre du 6 novembre 2026), pas dans la
      loi de finances pour 2027 du document du 14 octobre
    source: "programme de Mélenchon, melenchon2027.fr/programme/livre (6 novembre 2026)"
  etat_paie: &ETAT_PAIE {qui: "apu:etat", sens: paie, par: depense_publique}

# --------------------------------------------------------------- les chiffrées (rapports)
point_indice_10:
  levier:
    texte: "Décret n° 85-1148 du 24 octobre 1985, art. 3 (la valeur du point d'indice de
      la fonction publique), relevé par décret ; le candidat veut en outre « inscrire son
      dégel dans la loi »"
  assiette:
    texte: les salaires et traitements bruts des administrations publiques (D11), dont le
      traitement indiciaire des titulaires est la part que le point multiplie
    montant_md: 247.6
    annee: 2025
    source: "Insee, comptes nationaux annuels base 2020, t. 7.301 (compte des APU, S13), ligne
      D11"
  payeurs:
  - qui: "apu:etat"
    sens: paie
    par: depense_publique
    part: 0.765
    note: "la fonction publique de l'État (46,5 % de la masse nette) et la compensation
      intégrale des collectivités (30,0 %) que le candidat promet ; parts du volume de
      travail en EQTP fois le salaire net moyen par versant, 2024 (Insee, Siasp 2024,
      « Emploi, chômage, revenus du travail », édition 2026, fiche 29, figure 1)"
  - qui: "apu:secu:maladie"
    sens: paie
    par: depense_publique
    part: 0.235
    note: la fonction publique hospitalière (23,5 % de la masse nette, même source),
      financée par l'Assurance maladie
  - qui: "apu:apul"
    sens: paie
    par: depense_publique
    part: 0.0
    note: les collectivités paient leurs agents, l'État les compense « intégralement »
  - qui: menages
    sens: recoit
    par: salaire_net
    note: "+13,46 Md€ de salaires nets, +2,17 Md€ d'IR repris par l'État (rapport de la
      première année, 2026, figé)"
  calendrier:
    texte: loi de finances pour 2027
    source: "Mélenchon, « Comment nous allons remettre de l'ordre dans les comptes publics »,
      p. 10 ; programme, livre, « Une économie au service des besoins », chapitre 2"
  financement: *FIN_DEP
  hypotheses:
  - texte: Le candidat annonce 17 Md€ ; le rapport chiffre 11,09 Md€ de coût net la
      première année (le brut +16,67 Md€, les cotisations des employeurs publics et la
      pension des fonctionnaires de l'État en plus, moins ce qui revient en cotisations,
      CSG et IR). Le candidat ne dit pas si son montant est brut ou net.
    source: "le rapport de la mesure (`premiere_annee_pres2027_melenchon_point_indice_10.json`)
      ; Mélenchon, document du 14 octobre 2026, p. 10"
  - texte: "Les primes ne suivent pas le point ; les contractuels non plus (part du salaire
    indexée sur le point : 0 retenu, non publiée)."
    source: le chiffrage de la mesure (`programmes/melenchon.json`, plages)

indexation_pensions_prestations_10:
  levier:
    texte: "Code de la sécurité sociale, art. L161-25 (la revalorisation annuelle des
      pensions et prestations sur l'inflation) ; Code de la construction et de
      l'habitation, art. L823-4 (les paramètres des aides personnelles au logement) ; pour
      les retraites complémentaires, l'accord national interprofessionnel Agirc-Arrco, que
      la loi ne fixe pas"
  assiette:
  - texte: les prestations sociales en espèces des APU (D62), pensions comprises
    montant_md: 580.9
    annee: 2025
    source: "Insee, comptes nationaux annuels base 2020, t. 7.301 (compte des APU, S13), ligne
      D62"
  - texte: les prestations légales vieillesse nettes de la CNAV
    montant_md: 167.4
    annee: 2025
    source: "Commission des comptes de la Sécurité sociale, mai 2026, tableau 1 de la fiche
      CNAV (prestations légales nettes, 167 398 M€)"
  payeurs:
  - qui: "apu:secu:vieillesse"
    sens: paie
    par: depense_publique
    note: "+37,56 Md€ de pensions imposables dans le rapport (2026, figé), tous régimes
      ensemble : la passe ne sépare pas la CNAV, la fonction publique et l'Agirc-Arrco"
  - qui: "apu:secu:retraite_complementaire"
    sens: paie
    par: depense_publique
    note: les pensions complémentaires sont dans les +37,56 Md€ ; leur revalorisation
      relève de l'Agirc-Arrco, que le candidat ne nomme pas
  - qui: "apu:secu:famille"
    sens: paie
    par: depense_publique
    note: "+1,20 Md€ d'allocations familiales, +0,95 Md€ d'ASF (rapport)"
  - qui: "apu:etat"
    sens: paie
    par: depense_publique
    note: "+1,12 Md€ d'aides au logement (rapport) ; l'État reprend +6,17 Md€ d'IR et
      +3,91 Md€ de CSG sur les pensions"
  - qui: menages
    sens: recoit
    par: retraite
    note: "+31,97 Md€ de revenu disponible (rapport, 2026, figé)"
  calendrier: *CAL27
  financement: *FIN_DEP
  hypotheses:
  - texte: Le candidat annonce 8 Md€ ; le rapport chiffre 31,97 Md€ la première année, une
      revalorisation de 10 % de toutes les pensions et des prestations nommées au-dessus
      du droit de 2026. Le candidat ne dit pas si ses 8 Md€ s'entendent au-delà de
      l'indexation sur l'inflation ; l'écart n'est pas résolu ici.
    source: "le rapport de la mesure ; Mélenchon, document du 14 octobre 2026, p. 10 :
      « toutes les pensions, allocations familiales et APL, qui seront rehaussées de 10 %
      (8 milliards d'euros) »"

smic_1700_net:
  levier:
    texte: "Code du travail, art. L3231-1 et suivants (le salaire minimum de croissance,
      relevé par décret) ; Code de la sécurité sociale, art. L241-13 (la réduction générale,
      calculée sur le Smic)"
  assiette:
    texte: "le Smic mensuel net de 35 heures (1 477,93 €, indicatif) et brut (1 867,02 €,
      12,31 € de l'heure) : 1 700 € net en est +15,0 %"
    montant_md: null
    annee: 2026
    source: "service-public.gouv.fr, fiche F2300 (vérifiée le 1er juin 2026 ; arrêté du 22
      mai 2026 relatif au relèvement du salaire minimum de croissance)"
  calendrier:
    texte: « immédiatement »
    source: "programme de Mélenchon, livre, « Une économie au service des besoins »,
      chapitre 2 : « Augmenter immédiatement le SMIC à 1 700 euros net mensuel »"
  financement:
    annonce: null
    source: null
    chiffre: false
    note: une hausse du Smic est payée par les employeurs ; le candidat ne dit pas qui paie
      la hausse des allègements généraux qui suivent le Smic
  hypotheses:
  - texte: Le chiffrage relève le Smic de 16,17 % (le Smic de la population de 2024) ; au
      Smic de juin 2026, 1 700 € net en font +15,0 %.
    source: "le chiffrage de la mesure ; service-public.gouv.fr, fiche F2300"
  - texte: "Les allègements généraux suivent le Smic : +35,34 Md€ d'allègements dans la
      passe de la première année, que l'État compense à la Sécurité sociale."
    source: "le rapport de la mesure ; Code de la sécurité sociale, art. L131-7"
  - texte: Pas de diffusion aux salaires voisins dans le chiffrage (`smic_diffusion_echelle`
      à 0) ; le bloc `travail` du jumeau la porte.
    source: le chiffrage de la mesure (`programmes/melenchon.json`) ; D-469, D-478

garantie_autonomie_jeunes:
  levier:
