  rationale: 'Celle du cas aveugle plf2027_art_3, inchangée (D-292). Le plafond abaissé
    à 3 000 EUR mord sur les foyers dont 10 % des pensions dépassent ce montant, soit
    plus de 30 000 EUR de pensions déclarées par foyer : la moitié haute de la distribution.
    Aucune pension n''est observée dans cette population : la masse est calée sur
    les pensions déclarées (DGFiP) et sa distribution tirée de lois publiées ; les
    pensions d''un couple sont tirées sans corrélation ; le taux marginal des foyers
    retraités dépend de revenus du capital et fonciers que la population n''a pas,
    ce qui tire vers le bas. Le contrefactuel est l''arbre gelé (plafond de 4 439
    EUR), pas l''arbre revalorisé par l''art. 2 (environ 4 532 EUR) : léger biais
    vers le bas. Plus ou moins 30 % parce que l''incertitude porte sur une queue de
    distribution que la population construit plus qu''elle n''observe. Plancher de
    200 M EUR.'
note: 'Révision de plf2027_art_3 sur la population vieillie (D-317). Comparateur :
