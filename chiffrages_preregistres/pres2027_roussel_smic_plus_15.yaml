  rationale: 'Classe « salaires » (D-384). Mesure d''un salaire (le SMIC, le point
    d''indice) : le salaire horaire est tiré de l''enquête Emploi, le secteur public
    et les titulaires sont imputés, la diffusion au-dessus du SMIC est une hypothèse
    déclarée (D-380), et le coût public tient à une convention que le juge peut ne
    pas partager (le brut ou le super-brut des agents publics, les allègements qui
    suivent le SMIC pour les salaires qui ne bougent pas).'
note: 'Fabien Roussel (PCF), programme relevé le 2026-11-12 — SMIC augmenté de 15
  % : « « augmenter le Smic de 15 % » (franceinfo, matinale du 3 novembre 2026) »
  (https://www.franceinfo.fr/societe/mobilisation-du-17-octobre/fabien-roussel-appelle-a-continuer-la-mobilisation-tant-que-le-gouvernement-n-entend-pas-ce-cri-de-souffrance-de-douleur-de-colere_8265494.html,
  2026-11-03). Le SMIC horaire brut de chaque mois de 2026 relevé de 15 %, le coefficient
  du candidat. La diffusion au-dessus du nouveau SMIC, entre 1 et 1,5 SMIC dans le
  privé, est une hypothèse déclarée (D-380) : le profil à un an avec effets fixes
  d''entreprise de Koubi et Lhommeau (Insee, Les salaires en France 2007), le plus
  large des quatre publiés, à l''échelle 0 pour la valeur du candidat (le premier
  jour, la loi seule relève les salaires horaires sous le nouveau SMIC), sa plage
  allant jusqu''à 1 (le profil entier). La mesure se mesure contre le SMIC de l''arbre
  de 2026. Le coût ne compte pas le salaire que paie un employeur privé ; il compte
  celui que paie l''État employeur (les agents publics relevés au SMIC), les cotisations,
  la CSG et l''impôt qui montent, la prime d''activité qui bouge, et les allègements
  généraux, qui suivent le SMIC : un SMIC relevé les élargit aussi pour les salaires
  qui ne bougent pas.'
