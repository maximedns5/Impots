  rationale: 'Classe « entreprises » (D-321). Mesure des entreprises sur le millésime
    synthétique de 2023 vieilli par le PIB nominal (D-246), la tolérance de l''art.
    15 du PLF 2027. La CVAE disparaît du droit en 2028 : un juge qui chiffre contre
    ce droit-là la compte pour moins que le droit de 2026.'
note: 'Bruno Retailleau (Les Républicains), programme relevé le 2026-11-01 — Suppression
  de la C3S et de la CVAE ; forfait social maintenu à 20 % sur la participation légale,
  supprimé sur l''intéressement, la participation supra-légale et l''épargne retraite
  individuelle ; part industrielle de la CFE exonérée ; CIR sanctuarisé : « « Contribution
  sociale de solidarité des sociétés (C3S, 5,3 milliards d''euros) : suppression intégrale
  » » (https://republicains.fr/wp-content/uploads/2026/02/LR_Produire_Plus_LIVRET.pdf,
  2026-02-18). La C3S (0,16 % en 2026) et la CVAE sont supprimées sur le droit de
  2026, comme dans la mesure L4 de Lisnard, avec les mêmes plages. Le forfait social
  « maintenu » à 20 % est le droit de 2026 : il ne change rien. La CFE n''a pas de
  bouton et n''est pas dans la mesure énoncée.'
