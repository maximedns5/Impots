  rationale: 'Classe « salaires » (D-384). Mesure d''un salaire (le SMIC, le point
    d''indice) : le salaire horaire est tiré de l''enquête Emploi, le secteur public
    et les titulaires sont imputés, la diffusion au-dessus du SMIC est une hypothèse
    déclarée (D-380), et le coût public tient à une convention que le juge peut ne
    pas partager (le brut ou le super-brut des agents publics, les allègements qui
    suivent le SMIC pour les salaires qui ne bougent pas).'
note: 'Marine Tondelier (Les Écologistes), programme relevé le 2026-11-12 — Point
  d''indice indexé sur l''inflation ; +10 % pour les fonctionnaires : « « Améliorer
  le traitement des fonctionnaires par l''indexation du point d''indice sur l''inflation
  » » (https://marinetondelier.fr/s/livret-travail.pdf, 2026-11-04). Le point d''indice
  indexé sur l''inflation, ce que dit le programme : la première année, il monte de
  l''inflation de l''année. L''inflation de 2026 est celle des hypothèses du PLFSS
  2027 (annexe B, IPC hors tabac : 2,1 %), les hypothèses de la population vieillie
  des cas (plf2027). La presse ajoute +10 % pour les fonctionnaires autres que les
  enseignants (+15 % en cinq ans pour ceux-ci, une mesure à part) : c''est le haut
  de la plage du point (1,10), qui va du droit (1, le point gelé) à cette lecture,
  appliquée à tous les titulaires, enseignants compris. Le bouton multiplie le traitement
  indiciaire des fonctionnaires titulaires, leur brut sur 1,195 (le taux de prime
  du moteur) ; leurs primes ne bougent pas. La part du salaire des contractuels qui
  suit le point n''est pas publiée : 0 pour la valeur retenue, la plage allant jusqu''à
  1 (tous payés sur une grille indiciaire). La mesure se mesure contre le droit de
  2026, où le point est gelé depuis le 1er janvier 2024 : il n''a pas d''indexation
  légale. Le coût compte le salaire que paient l''État, les collectivités et les hôpitaux,
  moins les cotisations, la CSG et l''impôt qui en reviennent ; les collectivités
  sont comptées comme l''État, leur compensation éventuelle ne change pas le coût
  public.'
