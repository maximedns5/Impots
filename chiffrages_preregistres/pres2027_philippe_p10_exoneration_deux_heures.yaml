    gelé.'
note: 'Édouard Philippe (Horizons), programme relevé le 2026-11-12 — Exonération de
  cotisations pour les salariés qui travaillent deux heures de plus par semaine :
  « « exonérer de cotisations sociales les salariés qui accepteraient de travailler
  deux heures supplémentaires par semaine » (texte de l''article) » (https://fr.euronews.com/2026/10/09/presidentielle-2027-edouard-philippe-mise-sur-le-travail-et-la-reduction-des-depenses-publ,
  2026-10-09). « Exonérer de cotisations sociales les salariés qui accepteraient de
  travailler deux heures supplémentaires par semaine » : sur les heures supplémentaires
  imputées (D-383), les deux premières de chaque semaine travaillée, 94 heures par
  an sur 47 semaines (plage de 44 à 52 semaines). Les cotisations salariales que la
  loi laisse au-delà de sa réduction ; la CSG et la CRDS restent, la plage va jusqu''à
  les exonérer. Les patronales ne bougent pas : le texte parle des salariés. Seules
  les heures déjà faites : les deux heures neuves que la mesure veut faire faire,
  et les 1 000 € par an qu''elles rapporteraient, ne sont pas comptées. Contre le
  droit de 2026.'
