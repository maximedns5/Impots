  rationale: 'Classe « entreprises » (D-321). Mesure des entreprises sur le millésime
    synthétique de 2023 vieilli par le PIB nominal (D-246), la tolérance de l''art.
    15 du PLF 2027. La CVAE disparaît du droit en 2028 : un juge qui chiffre contre
    ce droit-là la compte pour moins que le droit de 2026.'
note: 'David Lisnard (Nouvelle Énergie), programme relevé le 2026-11-01 — Suppression
  de la C3S et, « le cas échéant », de la CVAE : « « La suppression de la C3S […]
  et, le cas échéant, de la CVAE […] représenterait 11,5 milliards d''euros » » (https://www.unenouvelleenergie.fr/notre-programme/reussir-une-nouvelle-ambition-francaise/,
  2026-11-01). La C3S est supprimée (taux de 0,16 % en 2026 ramené à 0) et la CVAE
  aussi, sur le droit de 2026. Le candidat ne supprime la CVAE que « le cas échéant
  » : le choix retenu suit son chiffrage de 11,5 Md€, qui compte les deux impôts,
  et la plage de cvae_echelle couvre son maintien (1). La plage de la C3S va du droit
  de 2026 à 0, la borne du schéma. L''objectif d''impôts de production ramenés de
  2 % à 1 % du PIB va au-delà de ces deux impôts (L3) et n''est pas chiffré ici.'
