  rationale: 'Classe « salaires » (D-384). Mesure d''un salaire (le SMIC, le point
    d''indice) : le salaire horaire est tiré de l''enquête Emploi, le secteur public
    et les titulaires sont imputés, la diffusion au-dessus du SMIC est une hypothèse
    déclarée (D-380), et le coût public tient à une convention que le juge peut ne
    pas partager (le brut ou le super-brut des agents publics, les allègements qui
    suivent le SMIC pour les salaires qui ne bougent pas).'
note: 'François Ruffin (Debout !), programme relevé le 2026-11-12 — SMIC à 1 600 €
  : « « Des mesures fortes, concrètes, comme le SMIC à 1 600€ ou la retraite à 60
  ans, qui revalorisent le travail. » » (https://nouspresident.fr/statut-travailleurs-essentiels/,
  2026-04-13). Le SMIC porté à 1 600 € par mois. Le livret ne dit pas net ou brut
  ; 1 600 € bruts seraient sous le SMIC de 2026 (1 823,03 € dès janvier) : seule la
  lecture nette est une hausse. Le bouton est un coefficient sur le SMIC horaire brut
  de chaque mois de 2026, qui en porte deux : 12,02 € de janvier à mai (1 823,03 €
  bruts par mois), 12,31 € de juin à décembre (1 867,02 €), 1 848,69 € en moyenne.
  Le coefficient retenu, 1,0933, donne 1 600 € nets par mois en moyenne sur l''année
  ; la plage va de 1,0826 (1 600 € nets atteints depuis le SMIC de juin) à 1,1087
  (depuis celui de janvier). Le net est le brut moins les prélèvements salariaux d''un
  non-cadre sous le plafond (vieillesse 7,30 %, Agirc-Arrco et CEG 4,01 %, CSG et
  CRDS 9,70 % sur 98,25 % du brut), soit 79,16 % du brut, sans mutuelle ni prévoyance.
  La diffusion au-dessus du nouveau SMIC, entre 1 et 1,5 SMIC dans le privé, est une
  hypothèse déclarée (D-380) : le profil à un an avec effets fixes d''entreprise de
  Koubi et Lhommeau (Insee, Les salaires en France 2007), le plus large des quatre
  publiés, à l''échelle 0 pour la valeur du candidat (le premier jour, la loi seule
  relève les salaires horaires sous le nouveau SMIC), sa plage allant jusqu''à 1 (le
  profil entier). La mesure se mesure contre le SMIC de l''arbre de 2026. Le coût
  ne compte pas le salaire que paie un employeur privé ; il compte celui que paie
  l''État employeur (les agents publics relevés au SMIC), les cotisations, la CSG
  et l''impôt qui montent, la prime d''activité qui bouge, et les allègements généraux,
  qui suivent le SMIC : un SMIC relevé les élargit aussi pour les salaires qui ne
  bougent pas.'
