  rationale: 'Premier exercice de la CEBGE (exercice 2024), 20,6 % et 41,2 %, seuils
    de 1 et 3 Md EUR de chiffre d''affaires, contre un droit de 2024 qui ne la connaît
    pas. Plus ou moins 40 % parce que : la contribution est assise sur l''IS de quelques
    centaines d''entreprises, tirées dans les cellules des grandes entreprises d''une
    population bâtie par cellules (331 lignes au-delà d''un milliard, 197 au-delà
    de trois), dont la queue de distribution n''est calée sur aucun total de la CEBGE
    ; l''IS de cette population sort de −20 % à +2 % selon l''année, la contribution
    sociale sur l''IS, que paient surtout les grandes, de −20 % à +34 % (+20 % en
    2024) ; la base est la moyenne de deux exercices, prise stationnaire (D-022) ;
    le seuil se lit sur l''entreprise de la population, pas sur le groupe intégré,
    ce qui tire vers le bas. La contribution sociale tire vers le haut, le seuil vers
    le bas : la direction n''est pas connue d''avance, d''où une fenêtre symétrique.
    Plancher de 300 M EUR.'
