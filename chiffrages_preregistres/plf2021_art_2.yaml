  rationale: 'Indexation de 0,2 % des tranches, de la décote, du plafond général de
    la demi-part et de celui du parent isolé, revenus 2020, chiffrée en miroir : le
    barème à 11 % de la LF 2020 avant indexation, que l''article modifie, rétabli
    sur l''arbre de 2020, dont l''article est l''opposé. Plus ou moins 30 % parce
    que : la grille n''a pas de ligne pour 2020, et ce qui en tient lieu est la loi
    d''erreur de 2022 à 2024 de cette population, ramenée par les mêmes indices, prolongée
    de deux ans sans mesure : les foyers par taux marginal sortent de −15 % à +12
    % de la DGFiP selon la tranche, d''un biais régulier (11 % : −12 à −15 % ; 30
    % : +5 à +12 %, croissant à mesure qu''on recule), environ +2 % en 2022 une fois
    pondérés par le saut de taux, les salaires déclarés de −7 à −8 % ; la structure
    des ménages est celle de 2024, quatre ans plus tard ; la population est ramenée
    à 2020 par les salaires par tête des comptes, qui ne comptent pas l''activité
    partielle : des salaires imposables trop bas d''environ 3 %, un coût trop bas
    de l''ordre de −2 à −4 % ; le scénario ne porte ni les trois autres plafonds de
    quotient familial ni le 196 B, de l''ordre de −1 à −2 % ; le chiffrage officiel
    est fait sur des revenus projetés à l''automne 2020, en pleine crise sanitaire
    ; le sous-échantillon de 20 000 ménages ajoute un bruit de l''ordre du pour cent.
    L''activité partielle et les volets tirent vers le bas, la tranche à 30 % vers
    le haut : fenêtre symétrique, plus large que celle du cas 1 pour les deux années
    de plus et l''année de crise. Plancher de 50 M EUR, la moitié du dixième de milliard
    auquel un chiffre publié peut être arrondi : l''indexation est sept fois plus
    petite que celle du cas 9 et vingt-sept fois plus petite que celle du cas 1, et
    le plancher de 200 M EUR de ces cas n''y laisserait aucune épreuve.'
