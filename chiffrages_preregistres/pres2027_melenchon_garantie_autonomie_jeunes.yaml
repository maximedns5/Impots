  rationale: 'Classe « prestation_neuve » (D-384). Prestation que la loi n''a pas
    (D-382) : son coût tient à un recours supposé, à des conditions que la population
    ne porte pas (résidence, activité passée, rattachement au foyer des parents) et
    à ce qu''elle remplace ; son coût net est l''écart de deux masses de 20 à 60 Md€,
    d''où un plancher en milliards, de l''ordre de 5 % de ces masses.'
note: 'Jean-Luc Mélenchon (La France insoumise), programme relevé le 2026-11-12 —
  Garantie d''autonomie des jeunes : « « plus aucun jeune ne doit vivre sous le seuil
  de pauvreté, fixé à 1 337 euros par mois, ce qui coûtera 9,5 milliards d''euros
  » » (https://melenchon2027.fr/wp-content/uploads/2026/10/Comment-nous-allons-remettre-de-l-ordre-dans-les-comptes-publics.pdf,
  2026-10-14). Une prestation neuve (D-382) : chaque jeune reçoit la différence entre
  1 337 € par mois et ses ressources propres du mois (salaire, revenu d''indépendant,
  chômage, pension), sans les ressources de ses parents ni les prestations de sa famille.
  Le candidat dit « les jeunes » sans âge : de 18 ans à la veille de 25, l''âge sous
  lequel le RSA est fermé, est une hypothèse ; la plage de l''âge de sortie va de
  21 (la fin des prestations familiales) à 30 ans. Le programme du 6 novembre la réserve
  aux jeunes « détachés du foyer fiscal parental » : la population ne dit pas le rattachement,
  et la garantie va à tous les jeunes de la tranche, ce qui la surestime. Servie en
  espérance avec la loi de recours du RSA (D-382). Elle ne remplace rien et n''entre
  dans aucune base de ressources. Contre le droit de 2026, où elle n''existe pas.'
