  rationale: 'Revalorisation de 2,1 % des tranches, de la décote et du plafond général
    de la demi-part, contre un arbre gelé aux paramètres des revenus 2025. Plus ou
    moins 20 % parce que : la ligne IR au barème de cette population sort à +8,8 %
    de la DGFiP, et le coût d''une revalorisation suit le niveau de l''impôt ; les
    revenus sont ceux de 2024, non vieillis, ce qui place moins de foyers au-dessus
    des seuils 2026 ; le scénario ne porte ni les quatre autres plafonds de quotient
    familial, ni le 196 B, ni l''indexation des limites de déductions ; la base n''a
    ni revenu du capital ni revenu d''indépendant ; et le sous-échantillon de 20 000
    ménages ajoute un bruit de l''ordre du pour cent. Les trois biais du milieu tirent
    vers le bas, le premier vers le haut : la direction nette n''est pas connue d''avance,
    d''où une fenêtre symétrique. Plancher de 200 M EUR pour le cas où le chiffre
    publié serait petit.'
